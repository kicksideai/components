version: '1.0'
namespace: app
entries:
  - name: admin_test
    kind: function.lua
    meta: { type: test, suite: kickside_work_admin, timeout: 300s }
    source: file://admin_test.lua
    method: run
    modules: [json, uuid, registry, fs, http_client]
    imports: &admin_imports
      test: wippy.test:test
      session: app:session
      fixture: app:fixture
  - name: admin_scope_test
    kind: function.lua
    meta: { type: test, suite: kickside_work_admin, timeout: 300s }
    source: file://admin_scope_test.lua
    method: run
    modules: [json, uuid, registry]
    imports: *admin_imports
  - name: admin_scope_expectation
    kind: registry.entry
    members_have_access: true
  - name: score_type
    kind: registry.entry
    meta:
      type: kickside.work.type
      plugin: app:ui_plugin
      title: Score
      form: int
      indexes: [number]
      config_schema:
        type: object
        required: [limit]
        properties:
          limit: {type: integer, minimum: 1}
  - name: score_type_discovery
    kind: security.policy
    groups: [app.security:user]
    policy:
      resources: [app:score_type]
      actions: [registry.find, registry.get]
      effect: allow
