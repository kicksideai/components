version: '1.0'
namespace: app
entries:
- name: flow_compatibility_test
  kind: function.lua
  meta: { type: test, suite: kickside_work_admin, timeout: 300s }
  source: file://flow_compatibility_test.lua
  method: run
  modules: [json, uuid, security]
  imports: &flow_imports
    test: wippy.test:test
    session: app:session
    fixture: app:fixture
    repo: kickside.workflows.repo:repo
    workflow: kickside.workflows:workflow
    publish: kickside.workflows.repo:version_publish
- name: publish_flow
  kind: function.lua
  source: file://flow_compatibility_test.lua
  method: publish
  modules: [json, uuid, security]
  imports: *flow_imports
- name: flow_compatibility_step
  kind: function.lua
  source: file://flow_compatibility_test.lua
  method: step
  modules: [json, uuid, security]
  imports: *flow_imports
- name: flow_compatibility_block
  kind: registry.entry
  meta: { type: kickside.block, title: Work Flow compatibility step }
  data:
    block:
      api_version: kickside.block/v1
      input: { type: object, additionalProperties: true }
      config: { type: object, additionalProperties: true }
      output: { type: object, additionalProperties: true }
      ports: [{ id: result, direction: out }]
      execution: { kind: function, function_id: app:flow_compatibility_step }
- name: flow_compatibility_access
  kind: security.policy
  groups: [app.security:work_admin]
  policy:
    resources: [app:flow_compatibility_block, app:flow_compatibility_step]
    actions: [registry.get, registry.find, funcs.call]
    effect: allow
