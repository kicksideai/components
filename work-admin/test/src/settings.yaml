version: '1.0'
namespace: app
entries:
- name: settings_test
  kind: function.lua
  meta:
    type: test
    suite: kickside_work_admin
    timeout: 300s
  source: file://settings_test.lua
  method: run
  modules:
  - json
  - uuid
  - registry
  - fs
  imports:
    test: wippy.test:test
    session: app:session
    fixture: app:fixture
- name: ui_plugin
  kind: registry.entry
  meta:
    type: kickside.work.plugin
    interface_version: 1
    title: Board enhancements
    tools:
    - kickside.work.traits:get_schema
    attachment: app:ui_attachment
    seams: [app:score_type, app:admin_check, app:admin_filter, app:hidden_check, app:hidden_filter]
    config_schema:
      type: object
      properties:
        threshold:
          type: integer
          minimum: 1
          default: 1
      additionalProperties: false
- name: admin_check
  kind: function.lua
  meta:
    type: kickside.work.guard
    plugin: app:ui_plugin
    title: Check release title
    reads: [title]
    cost: interactive
    enforce: write
  source: file://attachment.lua
  method: guard
- name: admin_filter
  kind: registry.entry
  meta:
    type: kickside.work.scope
    plugin: app:ui_plugin
    title: Release filter
    table: release_index
    board_column: board_id
    item_column: item_id
    filters: {release: {column: release, type: text, ops: [eq]}}
- name: uninstalled_filter
  kind: registry.entry
  meta: {type: kickside.work.scope, plugin: 'app:missing_plugin', title: Uninstalled filter}
- name: unowned_check
  kind: function.lua
  meta: {type: kickside.work.guard, plugin: 'app:ui_plugin', title: Undeclared check}
  source: file://attachment.lua
  method: guard
- name: hidden_check
  kind: function.lua
  meta: {type: kickside.work.guard, plugin: 'app:ui_plugin', title: Hidden check}
  source: file://attachment.lua
  method: guard
- name: hidden_filter
  kind: registry.entry
  meta: {type: kickside.work.scope, plugin: 'app:ui_plugin', title: Hidden filter}
- name: admin_board_app
  kind: registry.entry
  meta: {type: kickside.work.ui.app, title: Release app, icon: 'tabler:rocket', page: /releases}
- name: invalid_board_app
  kind: registry.entry
  meta: {type: kickside.work.ui.app, title: Invalid app, icon: 'tabler:rocket', page: //external}
- name: hidden_board_app
  kind: registry.entry
  meta: {type: kickside.work.ui.app, title: Hidden app, icon: 'tabler:rocket', component: hidden-board}
- name: malformed_ui_plugin
  kind: registry.entry
  meta:
    type: kickside.work.plugin
    interface_version: 1
    title: Invalid enhancement
    attachment: app:ui_attachment
    config_schema:
      type: object
      properties:
        amount:
          type: integer
    projections:
    - kind: app:malformed_projection
      input: unsupported
- name: ui_attachment
  kind: contract.binding
  meta:
    title: Board enhancement attachment
    class:
    - work_admin_attachment
  contracts:
  - contract: kickside.contract:component
    methods:
      get_status: kickside.core.threads:thread_status
  - contract: kickside.contract:deletable
    context_required:
    - component_id
    methods:
      delete: app:ui_attachment_delete
- name: ui_attachment_delete
  kind: function.lua
  source: file://attachment.lua
  method: delete
- name: settings_fixture_access
  kind: security.policy
  groups:
  - kickside.security.groups:members
  policy:
    resources:
    - app:ui_plugin
    - app:admin_check
    - app:admin_filter
    - app:uninstalled_filter
    - app:unowned_check
    - app:admin_board_app
    - app:invalid_board_app
    - app:malformed_ui_plugin
    - app:ui_attachment
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.security
    effect: allow
- name: settings_admin_access
  kind: security.policy
  groups:
  - app.security:work_admin
  policy:
    resources:
    - kickside.settings.api:list_settings.endpoint
    - kickside.settings.api:put_settings.endpoint
    actions:
    - access
    effect: allow
