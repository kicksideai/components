version: '1.0'
namespace: app
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Kickside Work Test Harness
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: Test database; the postgres profile replaces it.
  file: ./.wippy/work-admin-test.sqlite
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  addr: 127.0.0.1:0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    server: gateway
  middleware:
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
  prefix: /api/v1
- name: caller_only
  kind: security.policy
  meta:
    comment: Lets a session run the harness caller function and nothing else.
  policy:
    resources:
    - app:work_call
    - app:publish_flow
    - app:register_schemaless_board
    actions:
    - funcs.call
    effect: allow
- name: actors
  kind: library.lua
  meta:
    comment: Persists harness users so deferred projections resolve their principals.
  source: file://actors.lua
  modules:
  - sql
  - security
- name: realtime_notify
  kind: function.lua
  meta:
    comment: Harness realtime notify accepts each delivery.
  source: file://realtime_fake.lua
  method: notify
- name: realtime_broadcast
  kind: function.lua
  meta:
    comment: Harness realtime broadcast; boards only notify their readers.
  source: file://realtime_fake.lua
  method: broadcast
- name: realtime_binding
  kind: contract.binding
  meta:
    comment: Harness realtime implementation for board notifications.
  contracts:
  - contract: kickside.contract:realtime
    default: true
    methods:
      notify: app:realtime_notify
      broadcast: app:realtime_broadcast
- name: dep.test
  kind: ns.dependency
  version: '*'
  component: wippy/test
- name: dep.migration
  kind: ns.dependency
  version: '*'
  component: wippy/migration
  parameters:
  - name: wippy.migration:app_db
    value: app:db
- name: dep.users
  kind: ns.dependency
  version: '*'
  component: kickside/users
  parameters:
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:env_storage
    value: app:env_storage
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:public_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:user_security_scope
    value: kickside.security.groups:members
  - name: kickside.users:admin_security_scope
    value: app.security:work_admin
  - name: kickside.users:login_role_resource
    value: kickside.security.groups:members
- name: dep.settings
  kind: ns.dependency
  version: '*'
  component: kickside/settings
  parameters:
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
- name: dep.component
  kind: ns.dependency
  version: '*'
  component: kickside/component
  parameters:
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
- name: dep.jobs
  kind: ns.dependency
  version: '*'
  component: kickside/jobs
  parameters:
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
- name: dep.core
  kind: ns.dependency
  version: '*'
  component: kickside/core
  parameters:
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: kickside.security.groups:members
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:work_admin
      subject_type: group
      access_mask: 11
- name: dep.contract
  kind: ns.dependency
  version: '*'
  component: kickside/contract
- name: dep.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
  - name: kickside.security:target_db
    value: app:db
  - name: kickside.security:api_router
    value: app:api
  - name: kickside.security:ui_server
    value: app:gateway
  - name: kickside.security:process_host
    value: app:processes
- name: dep.automation
  kind: ns.dependency
  version: '*'
  component: kickside/automation
  parameters:
  - name: kickside.automation:target_db
    value: app:db
  - name: kickside.automation:api_router
    value: app:api
  - name: kickside.automation:ui_server
    value: app:gateway
- name: dep.module
  kind: ns.dependency
  version: '*'
  component: kickside/work
  parameters:
  - name: kickside.work:target_db
    value: app:db
  - name: kickside.work:api_router
    value: app:api
  - name: kickside.work:registry_admin_grant
    value:
      subject_id: app.security:work_admin
      subject_type: group
      access_mask: 3
- name: dep.bootloader
  kind: ns.dependency
  version: '*'
  component: wippy/bootloader
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
- name: dep.views
  kind: ns.dependency
  version: '*'
  component: wippy/views
  parameters:
  - name: wippy.views:api_router
    value: app:api
  - name: wippy.views:env_storage
    value: app:env_storage
- name: dep.widgets
  kind: ns.dependency
  version: '*'
  component: kickside/widgets
  parameters:
  - name: kickside.widgets:ui_server
    value: app:gateway
  - name: kickside.widgets:api_router
    value: app:api
- name: dep.admin
  kind: ns.dependency
  version: '*'
  component: kickside/work-admin
  parameters:
  - name: kickside.work.admin:ui_server
    value: app:gateway
  - name: kickside.work.admin:api_router
    value: app:api
- name: session
  kind: library.lua
  meta:
    comment: Sessions holding exactly the scope an installation composes for members
      and outsiders, with a bearer token for the pages' endpoints.
  source: file://session.lua
  modules: &id001
  - security
  - funcs
  - uuid
  - json
  - http_client
  - system
  - contract
  - time
  imports: &id002
    actors: app:actors
    execution_identity: kickside.execution:execution_identity
    test: wippy.test:test
- name: public_identity_only
  kind: security.policy
  policy:
    resources:
    - security
    - app:member_scope_probe
    - kickside.contract:scope_resolver
    - kickside.users:scope_resolver_binding
    - kickside.users.binding:scope_resolver_func
    actions:
    - funcs.call
    - contract.get
    - contract.open
    - contract.call
    - contract.security
    effect: allow
- name: public_identity_methods
  kind: security.policy
  policy:
    resources: '*'
    actions:
    - contract.call
    - security.policy.get
    - security.policy_group.get
    - security.scope.create
    effect: allow
- name: member_scope_probe
  kind: function.lua
  source: file://session.lua
  method: scope_probe
  modules: *id001
  imports: *id002
- name: session_test
  kind: function.lua
  meta:
    type: test
    suite: kickside_work_admin
    timeout: 300s
  source: file://session.lua
  method: run
  modules: *id001
  imports: *id002
- name: work_admin_composition
  kind: registry.entry
  meta:
    type: kickside.security.group_composition
  group_id: app.security:work_admin
  groups:
  - kickside.security.groups:members
  policies:
  - kickside.work.security:work_admin
- name: work_call
  kind: function.lua
  source: file://work_call.lua
  method: run
  modules: &work_call_modules
  - contract
  - security
  - registry
  - funcs
  - uuid
  imports: &work_call_imports
    component: kickside.component:component
    envelope: kickside.component:envelope
    threads: kickside.work.persist:threads
    prefix_registry: kickside.work.persist:registry
- name: register_schemaless_board
  kind: function.lua
  source: file://work_call.lua
  method: register_schemaless
  modules: *work_call_modules
  imports: *work_call_imports
  security:
    policies: [app:schemaless_fixture_create]
- name: schemaless_fixture_create
  kind: security.policy
  meta: {private: true, service_only: true, producers: [app:register_schemaless_board]}
  policy:
    resources: [kickside.work.binding:board]
    actions: [component.kind.create, component.kind.update]
    effect: allow
- name: fixture
  kind: library.lua
  source: file://fixture.lua
  modules:
  - uuid
- name: builder_test
  kind: function.lua
  meta:
    type: test
    suite: kickside_work_admin
    timeout: 300s
  source: file://builder_test.lua
  method: run
  modules:
  - uuid
  - json
  imports:
    test: wippy.test:test
    session: app:session
    fixture: app:fixture
- name: dep.workflows
  kind: ns.dependency
  component: kickside/workflows
  version: '*'
  parameters:
  - { name: 'kickside.workflows:target_db', value: 'app:db' }
  - { name: 'kickside.workflows:api_router', value: 'app:api' }
  - { name: 'kickside.workflows:ui_server', value: 'app:gateway' }
  - { name: 'kickside.workflows:process_host', value: 'app:processes' }
- name: dep.sync
  kind: ns.dependency
  component: kickside/sync
  version: '*'
  parameters:
  - { name: 'kickside.sync:ui_server', value: 'app:gateway' }
- name: dep.transform
  kind: ns.dependency
  component: kickside/transform
  version: '*'
  parameters:
  - { name: 'kickside.transform:ui_server', value: 'app:gateway' }
  - { name: 'kickside.transform:api_router', value: 'app:api' }
- name: dep.blocks
  kind: ns.dependency
  component: kickside/blocks
  version: '*'
  parameters:
  - { name: 'kickside.blocks:process_host', value: 'app:processes' }
  - { name: 'wippy.session:api_router', value: 'app:api' }
  - { name: 'wippy.session:env_storage', value: 'app:env_storage' }
  - { name: 'wippy.session:delegation_func_id', value: 'userspace.dataflow.session:delegate' }
