version: '1.0'
namespace: kickside.work.admin.api
entries:
  - name: catalog
    kind: library.lua
    source: file://catalog.lua
    modules: [registry]
    imports:
      types: kickside.work.admin:types
      ui_app: kickside.work.command:ui_app
  - name: options
    kind: function.lua
    source: file://options.lua
    method: get
    modules: [http, security]
    imports:
      types: kickside.work.admin:types
      board_client: kickside.work:client
      catalog: kickside.work.admin.api:catalog
      component: kickside.component:component
      http_errors: kickside.contract:http_errors
      plugins: kickside.work.domain:plugins
  - name: options.endpoint
    kind: http.endpoint
    method: GET
    func: options
    path: /work-admin/boards/{id}/options
  - name: principals
    kind: function.lua
    source: file://principals.lua
    method: post
    modules: [http, contract, security, json]
    imports:
      types: kickside.work.admin:types
      board_client: kickside.work:client
      component: kickside.component:component
      http_errors: kickside.contract:http_errors
  - name: principals.endpoint
    kind: http.endpoint
    method: POST
    func: principals
    path: /work-admin/boards/{id}/principal_labels
