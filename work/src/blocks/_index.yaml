version: '1.0'
namespace: kickside.work.blocks
entries:
- name: wait_for_item
  kind: registry.entry
  meta:
    type: kickside.block
    public: true
    title: Wait for Work item
    description: Waits for a single live item state until the deadline passes. A live item with parallel regions returns work_wait_parallel_unsupported.
  data:
    block:
      api_version: kickside.block/v1
      input: {"type":"object","properties":{"board_id":{"type":"string","minLength":1,"description":"Board component id."},"item":{"type":"string","minLength":1,"description":"Immutable item id on the board."},"state":{"type":"string","minLength":1,"description":"Exact single item state id to match."},"cursor":{"type":"object","properties":{"seq":{"type":"integer","minimum":0,"description":"Last sequence from WorkListChanges.next; preserve unchanged, or start with zero."},"item_id":{"type":"string","description":"Visible anchor item id from WorkListChanges.next, or an empty string; preserve unchanged."},"position":{"type":"string","maxLength":128,"description":"Opaque scan anchor when the last examined item was hidden; preserve unchanged."},"access":{"type":"string","description":"Access fingerprint from WorkListChanges.next; preserve unchanged to detect visibility changes."},"floor":{"type":"integer","minimum":0,"description":"Feed floor admitted at bootstrap; preserve the returned value unchanged."}},"additionalProperties":false,"required":["seq","item_id"],"description":"Optional cursor from a previous wait. This invocation checks the current item state."}},"required":["board_id","item","state"],"additionalProperties":false}
      config: {"type":"object","properties":{"timeout_ms":{"type":"integer","minimum":1,"maximum":60000,"default":30000,"title":"Timeout (milliseconds)"}},"additionalProperties":false}
      output: {"type":"object","properties":{"status":{"type":"string","enum":["matched","timed_out"]},"cursor":{"type":"object","properties":{"seq":{"type":"integer","minimum":0,"description":"Last sequence from WorkListChanges.next; preserve unchanged, or start with zero."},"item_id":{"type":"string","description":"Visible anchor item id from WorkListChanges.next, or an empty string; preserve unchanged."},"position":{"type":"string","maxLength":128,"description":"Opaque scan anchor when the last examined item was hidden; preserve unchanged."},"access":{"type":"string","description":"Access fingerprint from WorkListChanges.next; preserve unchanged to detect visibility changes."},"floor":{"type":"integer","minimum":0,"description":"Feed floor admitted at bootstrap; preserve the returned value unchanged."}},"additionalProperties":false,"required":["seq","item_id"],"description":"Unfiltered Work change-feed head from the latest item read."},"item":{"type":"object","properties":{"id":{"type":"string"},"state":{"type":"string"},"version":{"type":"integer"}},"required":["id","state","version"],"additionalProperties":false}},"required":["status","cursor"],"additionalProperties":false}
      ports:
      - {id: matched, direction: out, condition: "output.status == 'matched'"}
      - {id: timed_out, direction: out, condition: "output.status == 'timed_out'"}
      presentation:
        category: Work
        icon: tabler:clock
      execution: {kind: function, function_id: 'kickside.work.blocks:wait'}
- name: wait
  kind: function.lua
  source: file://wait.lua
  method: run
  modules: [time]
  imports:
    access: kickside.work.read:access
    clock: kickside.work.domain:clock
    consts: kickside.work:consts
    domain: kickside.work:types
    feeds: kickside.work.read:feeds
    item_view: kickside.work.read:item_view
    reads: kickside.work.read:types
    schemas: kickside.work.blocks:schemas
    shape: kickside.work.domain:shape
    projection_reader: kickside.core.projections.persist:reader
    store: kickside.work.persist:store
    types: kickside.work.blocks:types
    waiters: kickside.core.threads:cursor_waiters
- name: schemas
  kind: library.lua
  source: file://schemas.lua
  modules: [json]
  imports:
    shape: kickside.work.domain:shape
    types: kickside.work.blocks:types
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    reads: kickside.work.read:types
    domain: kickside.work:types
