version: '1.0'
namespace: kickside.work.domain
entries:
- name: clock
  kind: library.lua
  meta:
    comment: Deadlines and canonical RFC3339 UTC timestamps.
  source: file://clock.lua
  modules:
  - time
  imports:
    types: kickside.work:types
- name: shape
  kind: library.lua
  meta:
    comment: Tolerant JSON schemas - validate decoded Lua values where an empty table stands for an empty list.
  source: file://shape.lua
  modules:
  - json
  imports:
    types: kickside.work:types
- name: values
  kind: library.lua
  meta:
    comment: Canonical value forms, equality keys and order values.
  source: file://values.lua
  modules:
  - json
  imports:
    types: kickside.work:types
- name: operands
  kind: library.lua
  meta:
    comment: Filter operands - $actor and $now values resolved when a query compiles.
  source: file://operands.lua
  imports:
    durations: kickside.work.domain:process_time
    seams: kickside.work.domain:seams
    clock: kickside.work.domain:clock
    types: kickside.work:types
- name: filter_history
  kind: library.lua
  meta:
    comment: History conditions - was, by and during answered from the change table.
  source: file://filter_history.lua
  imports:
    values: kickside.work.domain:values
    operands: kickside.work.domain:operands
    types: kickside.work:types
- name: filter_relation
  kind: library.lua
  meta:
    comment: Relation conditions - some, every and none over the items a typed link reaches.
  source: file://filter_relation.lua
  imports:
    types: kickside.work:types
- name: filter
  kind: library.lua
  meta:
    comment: The filter tree - and, or, not and typed leaves compiled to one SQL fragment with bound values.
  source: file://filter.lua
