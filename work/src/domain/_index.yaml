    values: kickside.work.domain:values
    operands: kickside.work.domain:operands
    search: kickside.work.domain:search
    filter_history: kickside.work.domain:filter_history
    filter_relation: kickside.work.domain:filter_relation
    types: kickside.work:types
- name: manifests
  kind: library.lua
  meta:
    comment: Plugin manifests - load a kickside.work.plugin declaration, check board config, compute effective config, resolve
      the plugin's schema from its template or provider.
  source: file://manifests.lua
