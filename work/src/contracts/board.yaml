  - name: update
    description: Update board title, description or icon under board ADMIN; returns whether metadata changes and its command position, while the key prefix stays immutable.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"title":{"type":"string","description":"Nonblank board display title up to 255 bytes; omit to keep the current title."},"description":{"type":"string","description":"Board descriptive text; omit to retain the current text."},"icon":{"type":"string","description":"Board icon identifier; omit to retain the current icon."},"key_prefix":{"description":"Immutable board key prefix; any supplied value is refused with prefix_immutable."}},"required":["board_id"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id to pass to subsequent board calls."},"status":{"type":"string","enum":["updated","unchanged"],"description":"Current command or durable-operation status."},"seq":{"type":"integer","description":"Sequence of the command append, absent when nothing is appended."},"as_of":{"type":"integer","description":"Committed sequence covered by the returned snapshot."}},"required":["board_id","status"],"additionalProperties":false}'
  - name: list
    description: List boards readable by the caller; requires Work membership and returns board ids, titles, item counts and effective access.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"limit":{"type":"integer","minimum":1,"maximum":50,"description":"Maximum boards in this page, from 1 to 50; omit for 50."},"after":{"type":"integer","minimum":0,"description":"Continuation returned as next by WorkListBoards; omit for the first page and keep the same caller."}},"additionalProperties":false}'
