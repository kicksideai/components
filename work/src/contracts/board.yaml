"},"hard":{"type":"boolean","description":"Set true to refuse exceeding the limit; omit or set false to report a warning and allow the change."}},"required":["limit"],"additionalProperties":false},"description":"State ids from WorkGetSchema mapped to active-item limits; omit for no board-specific WIP limits."},"stage_timeout":{"type":"string","description":"Default positive ISO 8601 automated attempt timeout; omit for PT1H."},"stage_max_visits":{"type":"integer","minimum":1,"description":"Default automated visits per item and state; omit for 5."}},"required":[],"additionalProperties":false,"description":"Board retention, audit and state-limit overrides; omit to retain current policy or application defaults on creation."},"remove":{"anyOf":[{"type":"object","properties":{"fields":{"anyOf":[{"type":"array","items":{"type":"string"}},{"type":"object","maxProperties":0}],"description":"Existing field codes from WorkGetSchema to destroy; omit to keep fields."},"item_types":{"anyOf":[{"type":"array","items":{"type":"string"}},{"type":"object","maxProperties":0}],"description":"Existing type ids from WorkGetSchema to remove; omit to keep item types."},"processes":{"anyOf":[{"type":"array","items":{"type":"string"}},{"type":"object","maxProperties":0}],"description":"Existing process ids from WorkGetSchema to remove; omit to keep processes."},"relation_types":{"anyOf":[{"type":"array","items":{"type":"string"}},{"type":"object","maxProperties":0}],"description":"Existing relation ids from WorkGetSchema to remove; omit to keep relation types."}},"additionalProperties":false},{"type":"array","maxItems":0}],"description":"Explicit existing field codes and entry ids to remove; omit to preserve entries absent from the incoming declaration."},"plugins":{"type":"array","items":{"type":"object","properties":{"use":{"type":"string","description":"Exact installed plugin registry id; WorkGetSchema.plugins lists ids active on this board, and titles and attachment ids do not resolve."}}