  - name: get
    description: Read the saved definition, title and anchor board id under READ access to the view, its anchor and its selected boards.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."}},"required":["view_id"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."},"board_id":{"type":"string","description":"Board component id to pass to subsequent board calls."},"title":{"type":"string","description":"Display title of this board or saved view."},"view":{"type":"object","properties":{"type":{"type":"string"},"where":{"type":"object"},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}]},"group_by":{"type":"string"},"sub_group_by":{"type":"string"},"columns":{"type":"array","items":{"type":"string"}},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"where":{"type":"object"}},"required":["id"],"additionalProperties":false}},"card":{"type":"object"},"config":{"type":"object"},"boards":{"anyOf":[{"type":"string","enum":["readable"]},{"type":"array","items":{"type":"string"}}],"description":"Board component ids from WorkListBoards, or readable to select all readable boards; omit for a single-board query, with at most 50 boards."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition."}},"required":["view_id","board_id","title","view"],"additionalProperties":false}'
  - name: list
    description: List a bounded page of saved views under READ access to the anchor and each view. Entries with an unavailable selection carry only status, view id and anchor id.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"after":{"type":"string","pattern":"^[0-9]+$","description":"Continuation returned by the previous page of this method; omit to start at the beginning and reuse unchanged with the same filters."},"limit":{"type":"integer","minimum":1,"maximum":200,"description":"Maximum page size from 1 to 200; omit for 100 entries."}},"required":["board_id"],"additionalProperties":false}'
