      definition: '{"type":"object","properties":{"as_of":{"type":"integer","description":"Committed sequence covered by the returned snapshot."},"generation":{"type":"integer","description":"Schema generation read, planned or committed by this call."},"items":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"key":{"type":"string"},"type":{"type":"string"},"state":{"anyOf":[{"type":"string"},{"type":"object","additionalProperties":{"type":"string"}}]},"category":{"type":"string"},"visit":{"type":"integer"},"process_generation":{"type":"integer"},"version":{"type":"integer"},"parent":{"type":"string"},"life":{"type":"string"},"rank":{"type":"string"},"values":{"type":"object","additionalProperties":{}},"created_seq":{"type":"integer"},"updated_seq":{"type":"integer"},"board_id":{"type":"string"},"value_states":{"type":"object","additionalProperties":{"type":"string","enum":["absent","cleared","provided"]}},"findings":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"field":{"type":"string"}},"required":["code","message"],"additionalProperties":false}},"transitions":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string"},"to":{"type":"string"},"require":{"type":"array","items":{"type":"string"}},"region":{"type":"string"}},"required":["id","name","to","require"],"additionalProperties":false}},"gate":{"type":"object","properties":{"entered_by":{"type":"object","properties":{"kind":{"type":"string","enum":["user","group","service"]},"id":{"type":"string"}},"required":["kind","id"],"additionalProperties":false},"entered_at":{"type":"string"},"can_approve":{"type":"boolean","description":"The caller belongs to the live approver set and passes prevent_self; approve also requires board WRITE."},"approvals":{"type":"array","items":{"type":"object","properties":{"principal":{"type":"object","properties":{"kind":{"type":"string","enum":["user",