version: '1.0'
namespace: kickside.work
entries:
- name: view
  kind: contract.definition
  meta:
    title: Work view
  methods:
  - name: create
    description: Create a personal view under anchor READ or a shared view under anchor WRITE. Returns the saved view id after validating the query and presentation on the selected boards.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"view":{"type":"object","properties":{"type":{"type":"string","description":"Installed view type id, such as list or board; WorkGetView.view.type lists the selected type of an existing saved view."},"where":{"type":"object","description":"Filter tree: and/or/not, {field,op,value}, or {awaiting:true} for live items awaiting the caller. Principal member_of accepts a group id or list. Omit for all visible live items."},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}],"description":"One indexed sort field or 1..3 {field,dir} entries on one board; cross-board queries accept one key, and omission sorts by rank."},"group_by":{"type":"string","description":"Field code from WorkGetSchema or a built-in grouping field; omit for an ungrouped view."},"sub_group_by":{"type":"string","description":"Second grouping field code from WorkGetSchema; omit for one grouping level and supply only with group_by."},"columns":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to display; omit to use the presentation default."},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."},"card":{"type":"object","description":"Presentation metadata stored with the view; omit when no card layout is needed."},"config":{"type":"object","description":"Presentation configuration accepted by the installed view type declaration; WorkGetView shows the current config, and omission uses that type''s defaults."},"boards":{"anyOf":[{"type":"string","enum":["readable"]},{"type":"array","items":{"type":"string"}}],"description":"Board component ids from WorkListBoards, or readable to select all readable boards; omit for a single-board query, with at most 50 boards."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition; WorkGetView returns the existing definition for an update."},"title":{"type":"string","description":"Display title of the saved view; omit to use View."},"personal":{"type":"boolean","description":"Set true to create a private root view under board READ; omit or set false for a shared view under board WRITE."}},"required":["board_id","view"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."}},"required":["view_id"],"additionalProperties":false}'
  - name: save
    description: Save a view definition under view WRITE and anchor READ. An optional title also requires the personal owner or board ADMIN. Work saves the title and validated definition atomically.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."},"view":{"type":"object","properties":{"type":{"type":"string","description":"Installed view type id, such as list or board; WorkGetView.view.type lists the selected type of an existing saved view."},"where":{"type":"object","description":"Filter tree: and/or/not, {field,op,value}, or {awaiting:true} for live items awaiting the caller. Principal member_of accepts a group id or list. Omit for all visible live items."},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}],"description":"One indexed sort field or 1..3 {field,dir} entries on one board; cross-board queries accept one key, and omission sorts by rank."},"group_by":{"type":"string","description":"Field code from WorkGetSchema or a built-in grouping field; omit for an ungrouped view."},"sub_group_by":{"type":"string","description":"Second grouping field code from WorkGetSchema; omit for one grouping level and supply only with group_by."},"columns":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to display; omit to use the presentation default."},"scopes":{"type":"array","items":{"type":"object","p