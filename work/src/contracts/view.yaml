ned by WorkFindItems. Preserve unchanged."}},"required":["id"],"additionalProperties":false},{"type":"boolean","const":true}]},"description":"Per-board merge progress returned by Work. Preserve unchanged."}},"additionalProperties":false,"required":["id","boards","selection","frontiers"],"description":"Cross-board continuation returned by WorkRunView. Pass it unchanged with the same saved view and omit after."}},"required":["view_id"],"additionalProperties":false}'
