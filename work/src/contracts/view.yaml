version: '1.0'
namespace: kickside.work
entries:
- name: view
  kind: contract.definition
  meta:
    title: Work view
  methods:
  - name: create
    description: Create a personal view under board READ or a shared view under board WRITE; returns the new saved view id after validating its query and presentation.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"view":{"type":"object","properties":{"type":{"type":"string","description":"Installed view type id, such as list or board; WorkGetView.view.type lists the selected type of an existing saved view."},"where":{"type":"object","description":"Filter tree: and/or/not, {field,op,value}, or {awaiting:true} for live items awaiting the caller. Principal member_of accepts a group id or list. Omit for all visible live items."},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}],"description":"One indexed sort field or 1..3 {field,dir} entries on one board; cross-board queries accept one key, and omission sorts by rank."},"group_by":{"type":"string","description":"Field code from WorkGetSchema or a built-in grouping field; omit for an ungrouped page, with at most 200 groups."},"sub_group_by":{"type":"string","description":"Second grouping field code from WorkGetSchema; omit for one grouping level and supply only with group_by."},"columns":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to display; omit to use the presentation default."},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."},"card":{"type":"object","description":"Presentation metadata stored with the view; omit when no card layout is needed."},"config":{"type":"object","description":"Presentation configuration accepted by the installed view type declaration; WorkGetView shows the current config, and omission uses that type''s defaults."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition; WorkGetView returns the existing definition for an update."},"title":{"type":"string","description":"Display title of the saved view; omit to use View."},"personal":{"type":"boolean","description":"Set true to create a private root view under board READ; omit or set false for a shared view under board WRITE."}},"required":["board_id","view"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."}},"required":["view_id"],"additionalProperties":false}'
  - name: save
    description: Save a view definition under view WRITE and board READ; returns the view id after validating its filter, ordering and presentation.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."},"view":{"type":"object","properties":{"type":{"type":"string","description":"Installed view type id, such as list or board; WorkGetView.view.type lists the selected type of an existing saved view."},"where":{"type":"object","description":"Filter tree: and/or/not, {field,op,value}, or {awaiting:true} for live items awaiting the caller. Principal member_of accepts a group id or list. Omit for all visible live items."},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"Declared field code from WorkGetSchema; use the exact code rather than its display title."},"dir":{"type":"string","enum":["asc","desc"],"description":"Sort ascending or descending; omit for asc, with null values last."}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}],"description":"One indexed sort field or 1..3 {field,dir} entries on one board; cross-board queries accept one key, and omission sorts by rank."},"group_by":{"type":"string","description":"Field code from WorkGetSchema or a built-in grouping field; omit for an ungrouped page, with at most 200 groups."},"sub_group_by":{"type":"string","description":"Second grouping field code from WorkGetSchema; omit for one grouping level and supply only with group_by."},"columns":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to display; omit to use the presentation default."},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."},"card":{"type":"object","description":"Presentation metadata stored with the view; omit when no card layout is needed."},"config":{"type":"object","description":"Presentation configuration accepted by the installed view type declaration; WorkGetView shows the current config, and omission uses that type''s defaults."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition; WorkGetView returns the existing definition for an update."},"title":{"type":"string","minLength":1,"pattern":"\\S","description":"Nonblank new display title; omit to retain the current title."}},"required":["view_id","view"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."}},"required":["view_id"],"additionalProperties":false}'
  - name: run
    description: Run a saved view under READ access to both the view and its board; returns a caller-visible item page using the saved filter and ordering.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."},"limit":{"type":"integer","minimum":1,"maximum":200,"description":"Maximum page size from 1 to 200; omit for 50 entries."},"after":{"type":"object","properties":{"id":{"type":"string","description":"Last item id from the returned cursor; preserve unchanged."},"v":{"type":["integer","string"],"description":"Stored sort value from the returned cursor; preserve its type and omit only when absent in that cursor."},"keys":{"type":"array","items":{"type":"object","properties":{"v":{"type":["string","integer","boolean"],"description":"Stored sort value from the returned cursor; preserve its type and omit only when absent in that cursor."}},"additionalProperties":false},"description":"Stored values for each sort key from the returned cursor; preserve their order and omit only when absent."}},"required":["id"],"additionalProperties":false,"description":"Continuation returned by the previous page of this method; omit to start at the beginning and reuse unchanged with the same filters."},"min_seq":{"type":"integer","description":"Nonnegative minimum committed sequence to include; omit to read the current committed snapshot."}},"required":["view_id"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"as_of":{"type":"integer","description":"Committed sequence covered by the returned snapshot."},"generation":{"type":"integer","description":"Schema generation read, planned or committed by this call."},"items":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"key":{"type":"string"},"type":{"type":"string"},"state":{"anyOf":[{"type":"string"},{"type":"object","additionalProperties":{"type":"string"}}]},"category":{"type":"string"},"visit":{"type":"integer"},"process_generation":{"type":"integer"},"version":{"type":"integer"},"parent":{"type":"string"},"life":{"type":"string"},"rank":{"type":"string"},"values":{"type":"object","additionalProperties":{}},"created_seq":{"type":"integer"},"updated_seq":{"type":"integer"},"board_id":{"type":"string"},"value_states":{"type":"object","additionalProperties":{"type":"string","enum":["absent","cleared","provided"]}},"findings":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"field":{"type":"string"}},"required":["code","message"],"additionalProperties":false}},"transitions":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string"},"to":{"type":"string"},"require":{"type":"array","items":{"type":"string"}},"region":{"type":"string"}},"required":["id","name","to","require"],"additionalProperties":false}},"gate":{"type":"object","properties":{"entered_by":{"type":"object","properties":{"kind":{"type":"string","enum":["user","group","service"]},"id":{"type":"string"}},"required":["kind","id"],"additionalProperties":false},"entered_at":{"type":"string"},"can_approve":{"type":"boolean","description":"The caller belongs to the live approver set and passes prevent_self; approve also requires board WRITE."},"approvals":{"type":"array","items":{"type":"object","properties":{"principal":{"type":"object","properties":{"kind":{"type":"string","enum":["user","group","service"]},"id":{"type":"string"}},"required":["kind","id"],"additionalProperties":false},"decision":{"type":"string","enum":["approve","reject"]},"at":{"type":"string"}},"required":["principal","decision","at"],"additionalProperties":false}}},"required":["entered_by","entered_at","can_approve","approvals"],"additionalProperties":false},"awaiting":{"type":"object","properties":{"since":{"type":"string","description":"State entry timestamp for the current visit."},"by":{"type":"string","description":"Optional due deadline from state entry plus due."},"can_act":{"type":"boolean","description":"Caller eligibility from the awaited principal source and gate prevent_self, for a live item; writes also require board WRITE."},"principals":{"type":"array","items":{"type":"object","properties":{"kind":{"type":"string","enum":["user","group","service"]},"id":{"type":"string"}},"required":["kind","id"],"additionalProperties":false},"description":"Unexpanded awaited source from the recorded process and stable field id; omitted when its field is retired or unreadable."}},"required":["since","can_act"],"additionalProperties":false,"description":"Current visit timing and caller eligibility for the declared awaited source."}},"additionalProperties":false,"required":["id","key","type","state","category","visit","process_generation","version","life","values","created_seq","updated_seq"]},"description":"Caller-visible item records or the item ids produced by this operation."},"after":{"type":"object","properties":{"id":{"type":"string"},"v":{"anyOf":[{"type":"string"},{"type":"integer"},{"type":"boolean"}]},"keys":{"type":"array","items":{"type":"object","properties":{"v":{"type":["string","integer","boolean"]}},"additionalProperties":false}}},"additionalProperties":false,"required":["id"],"description":"Continuation to pass unchanged as after on the next call."},"reindexing":{"type":"boolean","description":"Whether a used field has pending index work."},"cross_after":{"type":"object","properties":{"id":{"type":"string"},"boards":{"type":"object","additionalProperties":{"type":"object","properties":{"id":{"type":"string"},"v":{"type":["string","integer","boolean"]},"keys":{"type":"array","items":{"type":"object","properties":{"v":{"type":["string","integer","boolean"]}},"additionalProperties":false}}},"required":["id"],"additionalProperties":false}},"selection":{"type":"array","items":{"type":"string"}}},"required":["id","boards","selection"],"additionalProperties":false,"description":"Cross-board continuation to pass to WorkFindItems."},"positions":{"type":"object","additionalProperties":{"type":"object","properties":{"as_of":{"type":"integer"},"generation":{"type":"integer"}},"additionalProperties":false},"description":"Committed sequence and schema generation per selected board."},"groups":{"type":"array","items":{"type":"object"},"description":"Grouped results with counts and bounded item pages."},"incomplete":{"type":"boolean","description":"True when the scan stops before completing its requested work."}},"required":["items","reindexing"],"additionalProperties":false}'
  - name: get
    description: Read a saved view under READ access to both the view and its board; returns its definition, title and board id.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."}},"required":["view_id"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."},"board_id":{"type":"string","description":"Board component id to pass to subsequent board calls."},"title":{"type":"string","description":"Display title of this board or saved view."},"view":{"type":"object","properties":{"type":{"type":"string"},"where":{"type":"object"},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}]},"group_by":{"type":"string"},"sub_group_by":{"type":"string"},"columns":{"type":"array","items":{"type":"string"}},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"where":{"type":"object"}},"required":["id"],"additionalProperties":false}},"card":{"type":"object"},"config":{"type":"object"}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition."}},"required":["view_id","board_id","title","view"],"additionalProperties":false}'
  - name: list
    description: List saved views under board READ and each view's READ access; returns a bounded cursor page of view definitions and presentation metadata.
    input_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"after":{"type":"string","pattern":"^[0-9]+$","description":"Continuation returned by the previous page of this method; omit to start at the beginning and reuse unchanged with the same filters."},"limit":{"type":"integer","minimum":1,"maximum":200,"description":"Maximum page size from 1 to 200; omit for 100 entries."}},"required":["board_id"],"additionalProperties":false}'
    output_schemas:
    - format: application/schema+json
      definition: '{"type":"object","properties":{"views":{"type":"array","items":{"type":"object","properties":{"view_id":{"type":"string"},"board_id":{"type":"string"},"title":{"type":"string"},"view":{"type":"object","properties":{"type":{"type":"string"},"where":{"type":"object"},"order":{"anyOf":[{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},{"type":"array","items":{"type":"object","properties":{"field":{"type":"string"},"dir":{"type":"string","enum":["asc","desc"]}},"required":["field"],"additionalProperties":false},"minItems":1,"maxItems":3}]},"group_by":{"type":"string"},"sub_group_by":{"type":"string"},"columns":{"type":"array","items":{"type":"string"}},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"where":{"type":"object"}},"required":["id"],"additionalProperties":false}},"card":{"type":"object"},"config":{"type":"object"}},"required":["type"],"additionalProperties":false}},"required":["view_id","board_id","title","view"],"additionalProperties":false},"description":"Saved view definitions or proposed shared views."},"after":{"type":"string","description":"Continuation to pass unchanged as after on the next call."}},"required":["views"],"additionalProperties":false}'
  - name: rename
    description: Rename a saved view as its owner or a board administrator; returns the view id after updating its nonblank title.
    input_schemas:
    - format: json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."},"title":{"type":"string","minLength":1,"pattern":"\\S","description":"Nonblank new display title for the saved view."}},"required":["view_id","title"],"additionalProperties":false}'
    output_schemas:
    - format: json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."}},"required":["view_id"],"additionalProperties":false}'
  - name: delete
    description: Delete a saved view as its owner or a board administrator through its component lifecycle; returns its view id and deletion progress.
    input_schemas:
    - format: json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view component id returned by WorkListViews or WorkCreateView; titles do not resolve."}},"required":["view_id"],"additionalProperties":false}'
    output_schemas:
    - format: json
      definition: '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."},"deleted":{"type":"boolean","description":"Whether the saved view is removed."},"in_progress":{"type":"boolean","description":"Whether accepted view deletion is still completing."}},"required":["view_id","deleted","in_progress"],"additionalProperties":false}'
