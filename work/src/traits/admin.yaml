- name: update_board
  kind: function.lua
  meta:
    type: tool
    title: Work update board
    llm_alias: WorkUpdateBoard
    llm_description: 'Update board metadata under board ADMIN, returning whether it changes and the committed position. Supply board_id in the call or omit it to use trait context; the call argument takes precedence.'
    mcp:
      required_scopes:
      - state.write
    input_schema: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"title":{"type":"string","description":"Nonblank board display title up to 255 bytes; omit to keep the current title."},"description":{"type":"string","description":"Board descriptive text; omit to retain the current text."},"icon":{"type":"string","description":"Board icon identifier; omit to retain the current icon."},"key_prefix":{"description":"Immutable board key prefix; any supplied value is refused with prefix_immutable."}},"required":["board_id"],"additionalProperties":false}'
