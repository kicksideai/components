  method: approve
  modules:
  - ctx
  imports:
    types: kickside.work.traits:types
    board_client: kickside.work:client
- name: report
  kind: function.lua
  meta:
    type: tool
    title: Work report
    llm_alias: WorkReport
    llm_description: 'Report a WorkListHistory stage-entered visit and attempt under board WRITE for an item id from WorkGetItem, returning outcomes and the resulting item version. Supply board_id in the call or omit it to use trait context; the call argument takes precedence.'
    mcp:
      required_scopes:
      - state.write
    input_schema: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"item":{"type":"string","description":"Item id string returned by WorkGetItem or WorkFindItems; resolve a key with WorkGetItem before writing."},"visit":{"type":"integer","minimum":1,"description":"Current visit from WorkGetItem.visit or WorkListHistory stage.entered after.visit for a regional visit; stale visits are refused."},"key":{"type":"string","description":"Nonempty replay identity for the same request; creation trims spaces, creation and item keys allow at most 255 bytes, and omission where optional disables replay protection."},"source":{"type":"string","description":"Attribution label for emitted events; omit to use api."},"origin":{"type":"object","description":"Origin metadata copied onto emitted events; omit when no upstream origin is recorded."},"trace_context":{"type":"object","properties":{"trace_id":{"type":"string","description":"Execution trace id; omit to use the active trace when available."},"run_id":{"type":"string","description":"Execution run id; omit when no run is associated."},"caused_by_event_id":{"type":"string","description":"Upstream event id that causes this command; omit when no event causes it."},"correlation_key":{"type":"string","description":"Caller correlation key for diagnostics; omit when no correlation is needed."}},"additionalProperties":false,"description":"Diagnostic correlation metadata; omit to derive the active execution trace without changing command identity."},"attempt":{"type":"integer","minimum":1,"description":"Current attempt from WorkListHistory stage.entered after.attempt or the stage-entered event; stale attempts are refused."},"outcome":{"enum":["passed","failed","canceled"],"description":"Completed automated stage result; the process definition in WorkGetSchema determines the resulting transition."},"outputs":{"type":"object","description":"Stage outputs as an object up to 65536 canonical JSON bytes; omit when no outputs are reported."},"progress":{"type":"object","description":"Stage progress metadata recorded with the report; omit when no progress metadata is needed."}},"required":["item","visit","attempt","outcome"],"additionalProperties":false}'
    output_schema: *work_schema_2
