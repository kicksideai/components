tems":{"type":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."},"card":{"type":"object","description":"Presentation metadata stored with the view; omit when no card layout is needed."},"config":{"type":"object","description":"Presentation configuration accepted by the installed view type declaration; WorkGetView shows the current config, and omission uses that type''s defaults."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition; WorkGetView returns the existing definition for an update."},"title":{"type":"string","minLength":1,"pattern":"\\S","description":"Nonblank new display title; omit to retain the current title."}},"required":["view_id","view"],"additionalProperties":false}'
