":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."},"card":{"type":"object","description":"Presentation metadata stored with the view; omit when no card layout is needed."},"config":{"type":"object","description":"Presentation configuration accepted by the installed view type declaration; WorkGetView shows the current config, and omission uses that type''s defaults."}},"required":["type"],"additionalProperties":false,"description":"Saved query and presentation definition; WorkGetView returns the existing definition for an update."},"title":{"type":"string","description":"Display title of the saved view; omit to use View."},"personal":{"type":"boolean","description":"Set true to create a private root view under board READ; omit or set false for a shared view under board WRITE."}},"required":["board_id","view"],"additionalProperties":false}'
    output_schema: &work_schema_9 '{"type":"object","properties":{"view_id":{"type":"string","description":"Saved view id to pass to WorkGetView, WorkRunView or view mutations."},"success":{"type":"boolean","const":true,"description":"True when the contract call returns a result without an error."}},"required":["view_id","success"],"additionalProperties":false}'
