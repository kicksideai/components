- name: apply
  kind: function.lua
  meta:
    type: tool
    title: Work apply
    llm_alias: WorkApply
    llm_description: 'Apply item operations under board WRITE and operation-specific access, returning ordered outcomes, item ids, versions and committed sequence. Supply board_id in the call or omit it to use trait context; the call argument takes precedence.'
    mcp:
      required_scopes:
      - state.write
    input_schema: &work_schema_1 '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"key":{"type":"string","description":"Nonempty replay identity for the same request; creation trims spaces, creation and item keys allow at most 255 bytes, and omission where optional disables replay protection."},"mode":{"type":"string","enum":["atomic","independent"],"description":"Apply the whole batch atomically or allow independent operation outcomes; omit for atomic."},"ops":{"type":"array","items":{"type":"object","properties":{"op":{"description":"Accepted: approve, report, advance, timer, create, set, transition, parent, rank, comment, link, unlink, delete, restore. Each operation returns its own outcome."},"type":{"description":"Item type id for create, or relation type id for link and unlink, as listed by WorkGetSchema; omit for other operations."},"parent":{"description":"Parent item id on this board; omit on create for root, and supply an id or false for a parent operation to reparent or move to root."},"values":{"type":"object","additionalProperties":{},"description":"Field codes from WorkGetSchema mapped to typed values; omit to leave values unchanged, and use item references as {board,item} with ids."},"clear":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to clear locally; omit to clear none."},"unset":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema whose local override is removed to resume inheritance; omit to unset none."},"state":{"description":"Initial state id from WorkGetSchema for create, or recorded state for timer; omit on create to use its initial state and use transition for manual edges."},"item":{"type":"string","description":"Item id string returned by WorkGetItem or WorkFindItems; resolve a key with WorkGetItem before writing."},"expect_version":{"description":"Item version returned by WorkGetItem; omit to use the version read during preparation, or supply it to refuse stale writes."},"transition":{"description":"Transition id from WorkGetSchema; required for a transition operation, and state alone does not select an edge."},"target":{"description":"Relation target as {item: item id, board?: board component id}; omit board for this board and resolve keys with WorkGetItem."},"comment":{"type":"string","description":"Comment id returned by WorkListComments to edit or delete; omit to create a comment."},"body":{"description":"Comment text up to 65536 bytes; required for a new comment and omitted when deleting."},"delete":{"type":"boolean","description":"Set true to delete the comment named by comment; omit or set false to create or edit its body."},"mentions":{"description":"Accepted kinds: user, group, service. Up to 200 {kind,id} principals with ids of 1 to 255 bytes; invalid input returns invalid_mentions."},"after":{"description":"Neighbor item id to rank after; omit to leave that side unbounded and resolve keys with WorkGetItem."},"before":{"description":"Neighbor item id to rank before; omit to leave that side unbounded and resolve keys with WorkGetItem."},"region":{"description":"Active region id from WorkGetItem for a regional transition; omit to transition the root state. Invalid input returns parallel_region_unknown."},"force":{"type":"boolean","description":"Set true as board ADMIN to allow the declared transition to leave a managed state; omit or set false for ordinary transition checks."},"visit":{"description":"Current visit from WorkGetItem.visit or WorkListHistory stage.entered after.visit for a regional visit; stale visits are refused."},"attempt":{"description":"Current attempt from WorkListHistory stage.entered after.attempt or the stage-entered event; stale attempts are refused."},"outcome":{"description":"Accepted: passed, failed, canceled. Invalid input returns stage_outcome_invalid."},"decision":{"description":"Accepted: approve, reject. Omit for approve; invalid input returns approval_decision_invalid."},"outputs":{"type":"object","description":"Stage outputs as an object up to 65536 canonical JSON bytes; omit when no outputs are reported."},"progress":{"type":"object","description":"Stage progress metadata recorded with the report; omit when no progress metadata is needed."},"timer":{"type":"string","description":"Timer id from the recorded process in WorkGetSchema; required only for a timer operation."},"scheduled_at":{"type":"string","description":"Exact RFC 3339 deadline from the scheduled process job; required for a timer operation, which process workers normally issue."}},"additionalProperties":false},"description":"Ordered operations to apply, from 1 to 200; non-create operations address existing item ids."},"source":{"type":"string","description":"Attribution label for emitted events; omit to use api."},"origin":{"type":"object","description":"Origin metadata copied onto emitted events; omit when no upstream origin is recorded."},"trace_context":{"type":"object","properties":{"trace_id":{"type":"string","description":"Execution trace id; omit to use the active trace when available."},"run_id":{"type":"string","description":"Execution run id; omit when no run is associated."},"caused_by_event_id":{"type":"string","description":"Upstream event id that causes this command; omit when no event causes it."},"correlation_key":{"type":"string","description":"Caller correlation key for diagnostics; omit when no correlation is needed."}},"additionalProperties":false,"description":"Diagnostic correlation metadata; omit to derive the active execution trace without changing command identity."}},"required":["ops"],"additionalProperties":false}'
    output_schema: &work_schema_2 '{"type":"object","properties":{"outcomes":{"type":"array","items":{"type":"object","properties":{"op":{"type":"integer"},"status":{"type":"string"},"item":{"type":"string"},"key":{"type":"string"},"version":{"type":"integer"},"comment":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"field":{"type":"string"}},"additionalProperties":false,"required":["code","message"]}},"rolled_back":{"type":"boolean"}},"additionalProperties":false,"required":["op","status"]},"description":"Ordered per-operation statuses, item ids, versions and findings."},"applied":{"type":"boolean","description":"Whether this command records changes."},"seq":{"type":"integer","description":"Sequence of the command append, absent when nothing is appended."},"as_of":{"type":"integer","description":"Committed sequence covered by the returned snapshot."},"replayed":{"type":"boolean","description":"True when this request reuses its previously recorded result."},"success":{"type":"boolean","const":true,"description":"True when the contract call returns a result without an error."}},"additionalProperties":false,"required":["outcomes","applied","success"]}'
