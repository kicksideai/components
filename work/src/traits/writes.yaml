    mcp:
      required_scopes:
      - state.write
    input_schema: '{"type":"object","properties":{"board_id":{"type":"string","description":"Board component id returned by WorkListBoards; keys and titles do not resolve."},"key":{"type":"string","minLength":1,"maxLength":255,"description":"Nonempty replay identity for the same request; creation trims spaces, creation and item keys allow at most 255 bytes, and omission where optional disables replay protection."},"query":{"type":"object","properties":{"where":{"type":"object","description":"Filter tree: and/or/not, {field,op,value}, or {awaiting:true} for live items awaiting the caller. Principal member_of accepts a group id or list. Omit for all visible live items."},"min_seq":{"type":"integer","minimum":0,"description":"Nonnegative minimum committed sequence to include; omit to read the current committed snapshot."},"include_trashed":{"type":"boolean","description":"Set true to include trashed items; omit or set false to select live items only."},"scopes":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string","description":"Exact adopted scope registry id from WorkGetSchema; use its declared filter schema for where."},"where":{"type":"object","description":"Filters accepted by this scope declaration from WorkGetSchema; omit to use the scope without additional filters."}},"required":["id"],"additionalProperties":false},"description":"Declared scope ids from WorkGetSchema, with optional filters; omit to apply no scope filters."}},"additionalProperties":false,"description":"Selection frozen when the bulk starts; an empty object selects all live visible items."},"ops_template":{"type":"array","minItems":1,"maxItems":200,"items":{"type":"object","properties":{"op":{"description":"Accepted: approve, report, advance, timer, set, transition, parent, rank, comment, link, unlink, delete, restore. Each operation returns its own outcome."},"type":{"description":"Item type id for create, or relation type id for link and unlink, as listed by WorkGetSchema; omit for other operations."},"parent":{"description":"Parent item id on this board; omit on create for root, and supply an id or false for a parent operation to reparent or move to root."},"values":{"type":"object","additionalProperties":{},"description":"Field codes from WorkGetSchema mapped to typed values; omit to leave values unchanged, and use item references as {board,item} with ids."},"clear":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema to clear locally; omit to clear none."},"unset":{"type":"array","items":{"type":"string"},"description":"Field codes from WorkGetSchema whose local override is removed to resume inheritance; omit to unset none."},"state":{"description":"Initial state id from WorkGetSchema for create, or recorded state for timer; omit on create to use its initial state and use transition for manual edges."},"expect_version":{"description":"Item version returned by WorkGetItem; omit to use the version read during preparation, or supply it to refuse stale writes."},"transition":{"description":"Transition id from WorkGetSchema; required for a transition operation, and state alone does not select an edge."},"target":{"description":"Relation target as {item: item id, board?: board component id}; omit board for this board and resolve keys with WorkGetItem."},"comment":{"type":"string","description":"Comment id returned by WorkListComments to edit or delete; omit to create a comment."},"body":{"description":"Comment text up to 65536 bytes; required for a new comment and omitted when deleting."},"delete":{"type":"boolean","description":"Set true to delete the comment named by comment; omit or set false to create or edit its body."},"mentions":{"description":"Accepted kinds: user, group, service. Up to 200 {kind,id} principals with ids of 1 to 255 bytes; invalid input returns invalid_mentions."},"after":{"description":"Neighbor item id to rank after; omit to leave that side unbounded and resolve keys with WorkGetItem."},"before":{"description":"Neighbor item id to rank before; omit to leave that side unbounded and resolve keys with WorkGetItem."},"region":{"description":"Active region id from WorkGetItem for a regional transition; omit to transition the root state. Invalid input returns parallel_region_unknown."},"force":{"type":"boolean","description":"Set true as board ADMIN to allow the declared transition to leave a managed state; omit or set false for ordinary transition checks."},"visit":{"description":"Current visit from WorkGetItem.visit or WorkListHistory stage.entered after.visit for a regional visit; stale visits are refused."},"attempt":{"description":"Current attempt from WorkListHistory stage.entered after.attempt or the stage-entered event; stale attempts are refused."},"outcome":{"description":"Accepted: passed, failed, canceled. Invalid input returns stage_outcome_invalid."},"decision":{"description":"Accepted: approve, reject. Omit for approve; invalid input returns approval_decision_invalid."},"outputs":{"type":"object","description":"Stage outputs as an object up to 65536 canonical JSON bytes; omit when no outputs are reported."},"progress":{"type":"object","description":"Stage progress metadata recorded with the report; omit when no progress metadata is needed."},"timer":{"type":"string","description":"Timer id from the recorded process in WorkGetSchema; required only for a timer operation."},"scheduled_at":{"type":"string","description":"Exact RFC 3339 deadline from the scheduled process job; required for a timer operation, which process workers normally issue."},"item":{"description":"Any supplied item is refused with bulk_template_item; omit because bulk supplies each selected item id."}},"additionalProperties":false},"description":"From 1 to 200 operations applied to every frozen query match; omit item and do not use create."}},"required":["key","query","ops_template"],"additionalProperties":false}'
    output_schema: &work_schema_6 '{"type":"object","properties":{"bulk_id":{"type":"string","description":"Bulk operation id to pass to WorkBulkStatus or WorkCancelBulk."},"move_id":{"type":"string","description":"Move operation id to pass to WorkMoveStatus."},"job_id":{"type":"string","description":"Durable job id responsible for continuing accepted work."},"status":{"type":"string","description":"Current command or durable-operation status."},"total":{"type":"integer","description":"Matching item count or total items in a durable operation."},"processed":{"type":"integer","description":"Number of selected items processed so far."},"applied":{"type":"integer","description":"Number of applied operations."},"unchanged":{"type":"integer","description":"Number of operations that leave the item unchanged."},"invalid":{"type":"integer","description":"Number of operations refused for invalid values or state."},"denied":{"type":"integer","description":"Number of operations refused by access rules."},"conflict":{"type":"integer","description":"Number of operations refused by version expectations."},"unavailable":{"type":"integer","description":"Number of operations unable to finish."},"error_code":{"type":"string","description":"Machine-readable failure code when the durable operation fails."},"item":{"type":"string","description":"Destination root item id for the proposed or accepted move."},"items":{"type":"array","items":{"type":"string"},"description":"Caller-visible item records or the item ids produced by this operation."},"success":{"type":"boolean","const":true,"description":"True when the contract call returns a result without an error."}},"required":["job_id","status","total","processed","success"],"additionalProperties":false}'
