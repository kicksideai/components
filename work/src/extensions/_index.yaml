version: '1.0'
namespace: kickside.work.extensions
entries:
- name: plugin_projection_state
  kind: library.lua
  source: file://plugin_projection_state.lua
  modules: [json]
  imports:
    local_types: kickside.work.extensions:types
    plugin_feed: kickside.work.extensions:plugin_feed
    threads: kickside.work.persist:threads
    types: kickside.work:types
- name: plugin_projections
  kind: function.lua
  source: file://plugin_projections.lua
  method: run
  modules: [json]
  imports:
    append: kickside.work.persist:append
    limits: kickside.work.settings:limits
    local_types: kickside.work.extensions:types
    threads: kickside.work.persist:threads
    manifests: kickside.work.domain:manifests
    attachments: kickside.work.service:attachments
    store: kickside.work.persist:store
    plugin_rows: kickside.work.persist:plugin_rows
    plugins: kickside.work.read:plugins
    jobs: kickside.core.jobs:jobs
    consts: kickside.work:consts
    types: kickside.work:types
    component: kickside.component:component
    values: kickside.work.domain:values
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    domain: kickside.work:types
    reads: kickside.work.read:types
- name: plugin_batch
  kind: function.lua
  security:
    policies:
    - kickside.work.security:plugin_rebuild_output_publish
    - kickside.work.security:prune_boundary_read
    - kickside.component:attachment_seal_access
  source: file://plugin_projections.lua
  method: batch
  modules: [json]
  imports:
    append: kickside.work.persist:append
    limits: kickside.work.settings:limits
    local_types: kickside.work.extensions:types
    threads: kickside.work.persist:threads
    manifests: kickside.work.domain:manifests
    attachments: kickside.work.service:attachments
    store: kickside.work.persist:store
    plugin_rows: kickside.work.persist:plugin_rows
    plugins: kickside.work.read:plugins
    jobs: kickside.core.jobs:jobs
    consts: kickside.work:consts
    types: kickside.work:types
    component: kickside.component:component
    values: kickside.work.domain:values
- name: plugin_updates
  kind: process.lua
  meta: { private: true }
  source: file://plugin_updates.lua
  method: run
  modules: [channel, events, json, process, registry, time, uuid]
  imports:
    jobs: kickside.core.jobs:jobs
    lifecycle: kickside.work.persist:lifecycle
    limits: kickside.work.settings:limits
    manifests: kickside.work.domain:manifests
    migration_runner: wippy.migration:runner
    plugin_rows: kickside.work.persist:plugin_rows
    store: kickside.work.persist:store
    types: kickside.work.extensions:types
    values: kickside.work.domain:values
- name: plugin_updates_host
  kind: process.host
  meta: { private: true }
  lifecycle:
    auto_start: true
- name: plugin_updates.service
  kind: process.service
  process: kickside.work.extensions:plugin_updates
  host: kickside.work.extensions:plugin_updates_host
  lifecycle:
    depends_on: [wippy.bootloader:bootloader.service, kickside.work.extensions:plugin_updates_host]
    auto_start: true
    security:
      groups: [wippy.security:process, kickside.work.extensions:plugin_updates_group]
- name: plugin_update_resolution
  kind: security.policy
  meta: { private: true }
  groups: [kickside.work.extensions:plugin_updates_group]
  policy:
    resources: '*'
    actions: [registry.resolution.get]
    effect: allow
- name: plugin_feed
  kind: library.lua
  source: file://plugin_feed.lua
  modules: [json]
  imports:
    limits: kickside.work.settings:limits
    access: kickside.work.read:access
    budget: kickside.work.read:budget
    domain: kickside.work:types
    feeds: kickside.work.read:feeds
    manifests: kickside.work.domain:manifests
    plugin_rows: kickside.work.persist:plugin_rows
    store: kickside.work.persist:store
    types: kickside.work.read:types
    local_types: kickside.work.extensions:types
    schema: kickside.work.extensions:plugin_feed_schema
    cursor_reader: kickside.core.projections.persist:reader
- name: plugin_feed_schema
  kind: library.lua
  source: file://plugin_feed_schema.lua
  modules: [json]
  imports:
    types: kickside.work:types
