version: '1.0'
namespace: kickside.work.service
entries:
- name: approve
  kind: function.lua
  meta:
    comment: kickside.work:board approve.
  source: file://process.lua
  method: approve
  imports: &process_imports
    apply_ops: kickside.work.command:apply_ops
    process_report: kickside.work.command:process_report
    locate: kickside.work.command:locate
    requests: kickside.work.service:requests
    commands: kickside.work.command:types
  security:
    policies:
    - kickside.work.security:sync_call
    - kickside.work.security:apply_output_publish
- name: report
  kind: function.lua
  meta:
    comment: kickside.work:board report.
  source: file://process.lua
  method: report
  imports: *process_imports
  security:
    policies:
    - kickside.work.security:sync_call
    - kickside.work.security:apply_output_publish
