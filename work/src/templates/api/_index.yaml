version: '1.0'
namespace: kickside.work.templates.api
entries:
- name: list
  kind: function.lua
  source: file://list.lua
  method: handler
  imports:
    access: kickside.work.api:access
- name: list.endpoint
  kind: http.endpoint
  method: GET
  func: list
  path: /work/boards/{id}/templates
- name: instantiate
  kind: function.lua
  source: file://instantiate.lua
  method: handler
  imports:
    access: kickside.work.api:access
- name: instantiate.endpoint
  kind: http.endpoint
  method: POST
  func: instantiate
  path: /work/boards/{id}/templates/instantiate
