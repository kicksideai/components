- name: tool_list
  kind: function.lua
  meta:
    type: tool
    public: true
    title: WorkListTemplates
    llm_alias: WorkListTemplates
    llm_description: List active versions on a readable board and return only statically readable defaults.
    mcp: {required_scopes: [state.read]}
    input_schema: '{"type":"object","properties":{"board_id":{"type":"string","minLength":1,"maxLength":255,"description":"Exact Work board component id."}},"required":[],"additionalProperties":false}'
    output_schema: '{"type":"object","properties":{"templates":{"type":"array","maxItems":128,"items":{"type":"object","properties":{"template_id":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[a-z][a-z0-9_-]*$","description":"Board-local template id."},"version":{"type":"string","minLength":1,"maxLength":36,"pattern":"^[0-9a-f-]{36}$","description":"An exact immutable template version from the catalog."},"title":{"type":"string","minLength":1,"maxLength":255,"description":"Display title for this version."},"description":{"type":"string","minLength":1,"maxLength":2048,"description":"Display description for this version."},"schema_generation":{"type":"integer","minimum":1,"description":"Work schema generation."},"preset":{"type":"object","properties":{"op":{"type":"string","const":"create"},"type":{"type":"string","minLength":1,"maxLength":40,"pattern":"^[a-z][a-z0-9_]*$","description":"Stable Work schema code."},"parent":{"type":"string","minLength":1,"maxLength":255,"description":"Optional visible parent item id on the same board."},"state":{"type":"string","minLength":1,"maxLength":40,"pattern":"^[a-z][a-z0-9_]*$","description":"Stable Work schema code."},"values":{"type":"object","maxProperties":200,"additionalProperties":{},"description":"Work field codes mapped to values accepted on create."}},"required":["op","type"],"additionalProperties":false},"override_fields":{"type":"array","items":{"type":"string","minLength":1,"maxLength":40,"pattern":"^[a-z][a-z0-9_]*$","description":"Stable Work schema code."},"uniqueItems":true,"maxItems":200,"description":"Field codes whose preset values an instantiation may replace or supply."}},"required":["template_id","version","title","schema_generation","preset","override_fields"],"additionalProperties":false}},"generation":{"type":"integer","minimum":1,"description":"Work schema generation."},"as_of":{"type":"integer","minimum":0},"success":{"type":"boolean"}},"required":["templates","generation","as_of","success"],"additionalProperties":false}'
