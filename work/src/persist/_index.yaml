- name: fold_rank
  kind: library.lua
  source: file://fold_rank.lua
  modules:
  - sql
  - json
  imports:
    jobs: kickside.core.jobs:jobs
    consts: kickside.work:consts
    rank: kickside.work.domain:rank
    store: kickside.work.persist:store
    types: kickside.work:types
    fold_batch: kickside.work.persist:fold_batch
- name: operation_rows
  kind: library.lua
  source: file://operation_rows.lua
  imports:
    store: kickside.work.persist:store
    identity: kickside.execution:execution_identity
    jobs: kickside.core.jobs:jobs
    types: kickside.work.command:types
    expiry: kickside.work.persist:operation_expiry
  modules:
  - sql
  - uuid
- name: operation_expiry
  kind: library.lua
  source: file://operation_expiry.lua
