version: '1.0'
namespace: kickside.work.security
entries:
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.work.api:apply
    - kickside.work.api:apply_schema
    - kickside.work.api:approve
    - kickside.work.api:bulk
    - kickside.work.api:bulk_status
    - kickside.work.api:cancel_bulk
    - kickside.work.api:configure_plugin
    - kickside.work.api:count
