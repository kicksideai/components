    - kickside.work.service:apply
    - kickside.work.service:apply_schema
    - kickside.work.service:approve
    - kickside.work.service:board
    - kickside.work.service:bulk
    - kickside.work.service:bulk_status
    - kickside.work.service:cancel_bulk
    - kickside.work.service:configure_plugin
    - kickside.work.service:count
    - kickside.work.service:create
    - kickside.work.service:create_view
    - kickside.work.service:delete_view
    - kickside.work.service:explain
    - kickside.work.service:get
    - kickside.work.service:get_schema
    - kickside.work.service:get_time_in_state
    - kickside.work.service:get_view
