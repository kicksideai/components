version: '1.0'
namespace: kickside.work.security
entries:
- name: view_public_meta
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers:
    - kickside.work.migrations:02_saved_view_boards
    - kickside.work.service:rename_view
  policy:
    resources: '*'
    actions: component.runtime_meta.write
    effect: allow
    conditions:
    - field: meta.impl_id
      operator: eq
      value: kickside.work.binding:view

- name: framework_callbacks
  kind: security.policy
  meta:
    private: true
    service_only: true
  groups:
  - wippy.security:process
  policy:
    resources:
    - kickside.work.jobs:plugins
    - kickside.work.extensions:plugin_batch
    - kickside.work.persist:publish_meta
    - kickside.work.jobs:migrate
    - kickside.work.jobs:migrate_batch
    - kickside.work.jobs:rebalance
    - kickside.work.jobs:rebalance_batch
    - kickside.work.jobs:recompute
    - kickside.work.jobs:recompute_batch
    - kickside.work.jobs:reindex
    - kickside.work.jobs:reindex_batch
    - kickside.work.jobs:process
    - kickside.work.jobs:advance
    - kickside.work.jobs:process_batch
    - kickside.work.jobs:advance_batch
    - kickside.work.jobs:bulk
    - kickside.work.jobs:move
    - kickside.work.jobs:operation_batch
    - kickside.work.jobs:pack
    - kickside.work.retention:owner
    - kickside.work.service:sync
    - kickside.work.service:sync_position
    - kickside.work.persist:projection
    - kickside.work.persist:projection_committed
    - kickside.work.binding:delete_func
    actions:
    - registry.get
    - funcs.call
    - funcs.security
    effect: allow

- name: pack_batch_call
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers:
    - kickside.work.service:create
    - kickside.work.service:pack_apply
  policy:
    resources:
    - kickside.work.jobs:operation_batch
    actions: funcs.call
    effect: allow

- name: tool_reference_read
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers:
    - kickside.work.domain:validate_tool
  policy:
    resources: '*'
    actions: registry.get
    effect: allow

- name: sync_call
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers:
    - kickside.work.service:bulk
    - kickside.work.service:plan_move
    - kickside.work.service:move
    - kickside.work.service:create
    - kickside.work.service:update
    - kickside.work.service:apply_schema
    - kickside.work.service:apply
    - kickside.work.service:configure_plugin
    - kickside.work.service:approve
    - kickside.work.service:report
    - kickside.work.service:complete_stage
    - kickside.work.sink:stage_launch
    - kickside.work.templates:instantiate
    - kickside.work.service:sync
    - kickside.work.jobs:migrate_batch
    - kickside.work.jobs:rebalance_batch
    - kickside.work.jobs:recompute_batch
    - kickside.work.jobs:reindex_batch
    - kickside.work.jobs:process_batch
    - kickside.work.jobs:advance_batch
    - kickside.work.jobs:operation_batch
  policy:
    resources:
    - kickside.work.service:sync
    - kickside.work.service:sync_position
    actions: funcs.call
    effect: allow

- name: framework_meta
  kind: security.policy
  meta: { private: true, service_only: true }
  groups: [wippy.security:process]
  policy:
    resources: [kickside.work.persist:publish_meta]
    actions: work.meta.publish
    effect: allow

- name: board_kind_create
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers: [kickside.work.service:create]
  policy:
    resources: [kickside.work.binding:board]
    actions: component.kind.create
    effect: allow

- name: board_kind_update
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers:
    - kickside.work.service:create
    - kickside.work.jobs:operation_batch
    - kickside.work.persist:publish_meta
  policy:
    resources: [kickside.work.binding:board]
    actions: component.kind.update
    effect: allow

- name: subject_retirement
  kind: security.policy
  meta: {private: true, service_only: true, producers: [kickside.work.retention:owner, kickside.work.retention:retire_operation]}
  policy:
    resources: [work.board]
    actions: threads.subjects.retire
    effect: allow
- name: prune_boundary_read
  kind: security.policy
  meta: {private: true, service_only: true, producers: [kickside.work.retention:owner, kickside.work.extensions:plugin_batch]}
  policy:
    resources: [work.board]
    actions: threads.prune_boundary.read
    effect: allow
- name: operation_retirement_call
  kind: security.policy
  meta: {private: true, service_only: true, producers: [kickside.work.service:bulk, kickside.work.service:move, kickside.work.service:create, kickside.work.service:pack_apply]}
  policy:
    resources: [kickside.work.retention:retire_operation]
    actions: [registry.get, funcs.call]
    effect: allow
