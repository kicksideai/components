version: '1.0'
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
  enable_history: true
  history_type: memory
override:
  kickside.work.jobs:reindex_batch:imports.append: app:reindex_append
  kickside.work.jobs:pack_commands:imports.schema_commands: app:pack_schema_probe
  kickside.work.jobs:pack_commands:imports.views: app:pack_view_probe
  kickside.work.jobs:bulk_commands:imports.events: app:bulk_progress_probe
  kickside.work.jobs:bulk_commands:imports.apply_ops: app:bulk_apply_probe
  kickside.work.command:bulk:imports.rows: app:operation_rows_probe
  kickside.work.command:move_plan:imports.principals: app:move_admission_probe
  kickside.work.jobs:move_commands:imports.events: app:move_phase_probe
  kickside.work.jobs:bulk:imports.identity: app:deferred_probe
  kickside.work.jobs:migrate_batch:imports.component: app:authorization_probe
  kickside.work.command:prepare_snapshot:imports.component: app:authorization_probe
  kickside.work.persist:predicate_rows:imports.component: app:authorization_probe
  kickside.work.read:query:imports.component: app:authorization_probe
  kickside.work.retention:owner:imports.append: app:retention_append
  kickside.work.binding:delete_func:imports.lifecycle: app:cleanup_observer
  kickside.users.directory:directory_groups:imports.directory: app:directory_probe
  kickside.core.retention.service:sweeper.service:lifecycle.auto_start: false
workspace:
  replacements:
    kickside/work: ..
    kickside/agent-onboarding: ../../agent-onboarding
    kickside/sso: ../../sso
    kickside/dashboard: ../../dashboard
vars:
  pg_host: localhost
  pg_port: 5434
  pg_database: kickside_test_work
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
