version: '1.0'
namespace: app
entries:
- name: flow_binding_test
  kind: function.lua
  meta: { type: test, suite: kickside_work_binding, timeout: 300s }
  source: file://flow_binding_test.lua
  method: run
  modules: [uuid, json]
  imports:
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    values: kickside.work.domain:values
    rows: app:rows
- name: flow_binding_actor
  kind: function.lua
  source: file://flow_binding_actor.lua
  method: run
  modules: [security, json, registry]
  imports:
    schema_commands: kickside.work.command:schema_commands
    probe: app:binding_probe
    repo: kickside.workflows.repo:repo
    workflow: kickside.workflows:workflow
    publish: kickside.workflows.repo:version_publish
    component: kickside.component:component
    automations: kickside.automation:automation
    identifiers: kickside.work.domain:identifiers
- name: binding_block
  kind: registry.entry
  meta: { type: kickside.block, title: Binding test block }
  data:
    block:
      api_version: kickside.block/v1
      input: { type: object, additionalProperties: true }
      config: { type: object, additionalProperties: true }
      output: { type: object, additionalProperties: true }
      ports: [{ id: result, direction: out }]
      execution: { kind: function, function_id: app:flow_binding_actor }
- name: dep.binding_workflows
  kind: ns.dependency
  component: kickside/workflows
  version: '*'
  parameters:
  - { name: 'kickside.workflows:target_db', value: 'app:db' }
  - { name: 'kickside.workflows:api_router', value: 'app:api' }
  - { name: 'kickside.workflows:ui_server', value: 'app:gateway' }
  - { name: 'kickside.workflows:process_host', value: 'app:processes' }
- name: dep.binding_sync
  kind: ns.dependency
  component: kickside/sync
  version: '*'
  parameters:
  - { name: 'kickside.sync:ui_server', value: 'app:gateway' }
- name: dep.binding_transform
  kind: ns.dependency
  component: kickside/transform
  version: '*'
  parameters:
  - { name: 'kickside.transform:ui_server', value: 'app:gateway' }
  - { name: 'kickside.transform:api_router', value: 'app:api' }
- name: binding_probe
  kind: library.lua
  source: file://binding_probe.lua
  modules: [sql, json]
  imports:
    values: kickside.work.domain:values
    automations: kickside.automation:automation
    append: kickside.work.persist:append
- name: binding_pack
  kind: registry.entry
  meta: { type: kickside.work.pack, title: Binding test pack, version: 1.0.0 }
  data:
    schema: { fields: [], item_types: [] }
    processes: []
    views: []
    automations: []
    traits: []
    requires: []
    starter: { items: [], default: false }
