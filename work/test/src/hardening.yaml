version: '1.0'
namespace: app
entries:
- name: hardening_test
  kind: function.lua
  meta: { type: test, suite: kickside_work, timeout: 300s }
  source: file://hardening_test.lua
  method: run
  modules: [sql, json, registry, security, uuid]
  imports:
    retention: kickside.work.retention:rows
    policy: kickside.work.domain:policy
    tables: kickside.work.domain:layout
    identifiers: kickside.work.domain:identifiers
    test: wippy.test:test
    fixture: app:fixture
    scoped: app:scoped
    steps: app:steps
    operations: app:operation_steps
    prepare: kickside.work.command:prepare_context
    outcomes: kickside.work.domain:outcomes
    process_data: kickside.work.persist:process_data
    store: kickside.work.persist:store

- name: hardening_probe
  kind: function.lua
  source: file://hardening_probe.lua
  method: run
  imports:
    receipts: kickside.work.command:receipts
    move: kickside.work.jobs:move_commands

- name: keyed_append
  kind: library.lua
  source: file://keyed_append.lua
  modules: [sql]
  imports:
    append: kickside.work.persist:append
- name: upgrade_seed_test
  kind: function.lua
  meta: { type: upgrade_fixture, suite: kickside_work_upgrade, timeout: 300s }
  source: file://upgrade_restart_test.lua
  method: seed
  modules: [json, time]
  imports: &upgrade_imports
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    store: kickside.work.persist:store
    jobs: kickside.core.jobs:jobs
- name: upgrade_restart_test
  kind: function.lua
  meta: { type: upgrade_fixture, suite: kickside_work_upgrade, timeout: 300s }
  source: file://upgrade_restart_test.lua
  method: verify
  modules: [json, time]
  imports: *upgrade_imports

- name: placement_folder
  kind: contract.binding
  contracts:
  - contract: kickside.contract:component
    methods:
      get_status: kickside.core.threads:thread_status

- name: placement_fixture_discovery
  kind: security.policy
  policy:
    resources: [app:placement_folder]
    actions: [registry.get]
    effect: allow

- name: upgrade_interrupted_test
  kind: function.lua
  meta: { type: upgrade_fixture, suite: kickside_work_upgrade, timeout: 300s }
  source: file://upgrade_restart_test.lua
  method: interrupted
  modules: [json, time]
  imports: *upgrade_imports
- name: recovery_pause_jobs
  kind: library.lua
  source: file://recovery_jobs_probe.lua
  modules: [json, time]
  imports:
    jobs: kickside.core.jobs:jobs
    store: kickside.work.persist:store
    config: app:recovery_pause_config
- name: recovery_resume_jobs
  kind: library.lua
  source: file://recovery_jobs_probe.lua
  modules: [json, time]
  imports:
    jobs: kickside.core.jobs:jobs
    store: kickside.work.persist:store
    config: app:recovery_resume_config
- name: recovery_pause_config
  kind: library.lua
  source: 'return {hold=true}'
- name: recovery_resume_config
  kind: library.lua
  source: 'return {hold=false}'

- name: retirement_threads
  kind: library.lua
  source: file://retirement_threads.lua
  imports:
    threads: kickside.work.persist:threads
    store: kickside.work.persist:store

- name: operation_retirement_call
  kind: security.policy
  meta: {private: true, service_only: true, producers: [app:work_call]}
  policy:
    resources: [kickside.work.retention:retire_operation]
    actions: [registry.get, funcs.call]
    effect: allow
