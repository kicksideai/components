# The legacy pack data is the stock Work Planning 0.1.2 release.
version: '1.0'
namespace: app
entries:
- name: legacy_adoption_pack
  kind: registry.entry
  meta:
    type: kickside.work.pack
    title: Planning
    version: 1.0.0
    icon: tabler:calendar
    description: Plan sprints and milestones and track issue membership.
  data:
    additive: true
    schema:
      fields:
      - code: title
        form: text
      - code: name
        form: text
        title: Name
      - code: planning_start
        form: time
        index: key
        title: Start date
      - code: planning_end
        form: time
        index: key
        title: End date
      - code: planning_goal
        form: text
        title: Goal
      - code: current_sprint
        type: item
        config:
          item_type: sprint
        index: key
        track: true
        title: Current sprint
      - code: milestone
        type: item
        config:
          item_type: milestone
        index: key
        track: true
        title: Milestone
      item_types:
      - id: issue
        title: Issue
        process: planning_issue
        fields:
        - title
        - current_sprint
        - milestone
      - id: sprint
        title: Sprint
        process: planning_period
        fields:
        - name
        - planning_start
        - planning_end
        - planning_goal
      - id: milestone
        title: Milestone
        process: planning_period
        fields:
        - name
        - planning_start
        - planning_end
        - planning_goal
    processes:
    - id: planning_period
      initial: planned
      states:
      - id: planned
        name: Planned
        category: unstarted
        require:
        - name
      - id: active
        name: Active
        category: started
        require:
        - name
        - planning_start
        - planning_end
      - id: closed
        name: Closed
        category: completed
        require:
        - name
      transitions:
      - id: start
        from:
        - planned
        to: active
        guards:
        - kickside.work.planning:date_order
      - id: close
        from:
        - active
        to: closed
    - id: planning_issue
      initial: open
      states:
      - id: open
        name: Open
        category: backlog
      - id: done
        name: Done
        category: completed
      - id: canceled
        name: Canceled
        category: canceled
      transitions:
      - id: complete
        from:
        - open
        to: done
      - id: cancel
        from:
        - open
        to: canceled
    requires:
    - kickside.work.planning:plugin
    views: []
    automations: []
    traits: []
    starter:
      items: []
      default: false
- name: legacy_adoption_selector
  kind: registry.entry
  meta:
    type: kickside.work.transition_adoption
  data:
    pack: app:legacy_adoption_pack
    base_digest: ab038d236b798e211aa66d1657e3dc9d7cede68e29f986faa9b0577b356ba635
    plugin: kickside.work.planning:plugin
    item_type: sprint
    process: planning_period
    transition: close
    command: kickside.work.planning:prepare_close
    fields:
    - name
    - planning_start
    - planning_end
    - planning_goal
    - current_sprint
- name: transition_adoption_test
  kind: function.lua
  meta:
    type: test
    suite: kickside_work_adoption
    timeout: 300s
  source: file://transition_adoption_test.lua
  method: run
  imports:
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    probe: app:schema_guard_probe
