    probe: app:round8_probe
- name: round8_manifests
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_attachments
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_store
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_plugin_rows
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_plugins
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_component
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_limits
  kind: library.lua
  source: 'local probe=require("probe"); return probe :: any'
  imports:
    probe: app:round8_probe
- name: round8_read_budget
  kind: function.lua
  source: file://../round8_read_budget.lua
  method: run
  imports:
    access: kickside.work.read:access
    types: kickside.work.read:types
