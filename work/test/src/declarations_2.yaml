- name: attachment_rows
  kind: library.lua
  source: file://plugin_attachment.lua
  modules: [sql, ctx]
- name: attachment_delete
  kind: function.lua
  source: file://plugin_attachment.lua
  method: delete
  modules: [sql, ctx]

- name: cleanup_observer
  kind: library.lua
  source: file://cleanup_observer.lua
  modules: [sql]
  imports:
    lifecycle: kickside.work.persist:lifecycle
    tables: kickside.work.domain:layout

- name: retention_append
  kind: library.lua
  source: file://retention_append.lua
  modules: [sql, funcs]
  imports:
    append: kickside.work.persist:append
    domain: kickside.work:types
    clock: kickside.work.domain:clock

- name: authorization_probe
  kind: library.lua
  source: file://authorization_probe.lua
  modules: [sql]
  imports:
    component: kickside.component:component
