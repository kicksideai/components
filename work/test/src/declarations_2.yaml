version: '1.0'
namespace: app
entries:
- name: secret_anyOf
  kind: registry.entry
  meta:
    type: kickside.work.plugin
    attachment: app:work_attachment
    config_schema: {"type": "object", "properties": {"payload": {"anyOf": [{"type": "string", "format": "password"}]}}, "$defs": {"private": {"type": "string", "format": "password"}, "loop": {"$ref": "#/$defs/loop"}}}

