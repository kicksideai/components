version: '1.0'
namespace: app
entries:
- name: stage_delivery_test
  kind: function.lua
  meta: { type: test, suite: kickside_work_delivery, timeout: 600s }
  source: file://stage_delivery_test.lua
  method: run
  modules: [uuid, json]
  imports:
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    rows: app:rows
- name: stage_delivery_actor
  kind: function.lua
  source: file://stage_delivery_actor.lua
  method: run
  modules: [funcs, contract, sql]
  imports:
    component: kickside.component:component
    identifiers: kickside.work.domain:identifiers
    probe: app:stage_delivery_probe
- name: stage_delivery_probe
  kind: library.lua
  source: file://stage_delivery_probe.lua
  modules: [sql, json, contract]
  imports:
    admission: kickside.workflows.runs:admission
- name: delivery_crash
  kind: function.lua
  source: file://stage_delivery_actor.lua
  method: crash
  modules: [funcs, contract, sql]
  imports:
    component: kickside.component:component
    identifiers: kickside.work.domain:identifiers
    probe: app:stage_delivery_probe
- name: delivery_crash_block
  kind: registry.entry
  meta: { type: kickside.block, title: Crashing stage test block }
  data:
    block:
      api_version: kickside.block/v1
      input: { type: object, additionalProperties: true }
      config: { type: object, additionalProperties: true }
      output: { type: object, additionalProperties: true }
      ports: [{ id: result, direction: out }]
      execution: { kind: function, function_id: app:delivery_crash }
