version: '1.0'
namespace: app
entries:
- name: bounded_reads_test
  kind: function.lua
  meta: {type: test, suite: kickside_work, timeout: 300s}
  source: file://bounded_reads_test.lua
  method: run
  imports:
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    store: kickside.work.persist:store
- name: query_plans_test
  kind: function.lua
  meta: {type: test, suite: kickside_work, timeout: 300s}
  source: file://query_plans_test.lua
  method: run
  imports:
    test: wippy.test:test
    fixture: app:fixture
    steps: app:steps
    store: kickside.work.persist:store
    tables: kickside.work.domain:layout
- name: query_text_search_plugin
  kind: registry.entry
  meta:
    type: kickside.work.plugin
    attachment: app:work_attachment
    seams: [app:query_text_search_scope]
- name: query_text_search_scope
  kind: registry.entry
  meta:
    type: kickside.work.scope
    plugin: app:query_text_search_plugin
    table: app_work_query_text
    board_column: board_id
    item_column: item_id
    match: [content]
    filters: {}
- name: query_text_search_write
  kind: function.lua
  method: run
  source: |
    local store = require("store")
    local scopes = require("scopes")
    return { run = function(input)
        local db = assert(store.open())
        assert(db:execute([[CREATE TABLE IF NOT EXISTS app_work_query_text
            (board_id text NOT NULL, item_id text NOT NULL, content text NOT NULL, PRIMARY KEY (board_id, item_id))]], {}))
        local err = scopes.write_search(db, "app:query_text_search_scope", input.board, input.item, { content = input.text })
        db:release()
        if err then return nil, err end
        return true
    end }
  imports:
    store: kickside.work.persist:store
    scopes: kickside.work.read:scopes
- name: query_plan_read_page
  kind: function.lua
  source: |
    local query = require("query")
    return { run = function(request) return query.page(request) end }
  method: run
  imports:
    query: kickside.work.read:query
