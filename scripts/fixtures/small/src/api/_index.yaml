version: "1.0"
namespace: acme.small.api

entries:
  - name: list
    kind: function.lua
    source: file://list.lua
    method: handler
    imports:
      repo: acme.small.persist:repo

  - name: list.endpoint
    kind: http.endpoint
    method: GET
    path: /small/items
    func: acme.small.api:list
