version: '1.0'
namespace: kickside.docscout.blocks
entries:
- name: extract_run
  kind: function.lua
  meta:
    comment: Execution target of the Extract document fields Block.
  source: file://extract.lua
  method: run
  imports:
    client: kickside.docscout:client
    shapes: kickside.docscout.engine:shapes
- name: extract
  kind: registry.entry
  meta:
    type: kickside.block
    public: true
    title: Extract document fields
    description: Runs a Docscout extractor on an upload and returns its field values with evidence.
  data:
    block:
      api_version: kickside.block/v1
      input:
        type: object
        additionalProperties: true
        required: [upload_id]
        properties:
          upload_id: { type: string, minLength: 1, title: Upload }
      config:
        type: object
        additionalProperties: false
        required: [extractor_id]
        properties:
          extractor_id: { type: string, title: Extractor, picker: wc-component-picker, class: kickside.docscout }
      output:
        type: object
        additionalProperties: false
        required: [values, fields, verified, run_id]
        properties:
          values: { type: object, description: Field values nested by group path; fields not in the document are absent. }
          fields: {"type": "array", "items": {"type": "object", "required": ["name", "confidence", "verified", "missing", "evidence", "path"], "properties": {"name": {"type": "string"}, "value": {}, "confidence": {"type": "number", "minimum": 0, "maximum": 1}, "verified": {"type": "boolean"}, "missing": {"type": "boolean"}, "reason": {"type": "string"}, "evidence": {"type": "array", "items": {"type": "object", "required": ["quote", "section", "chunk_id"], "properties": {"quote": {"type": "string"}, "section": {"type": "string"}, "chunk_id": {"type": "string"}, "page": {"type": "integer", "minimum": 0}, "page_start": {"type": "integer", "minimum": 0}, "page_end": {"type": "integer", "minimum": 0}, "found": {"type": "boolean"}}}}, "path": {"type": "string", "description": "Full dotted field path."}}}}
          verified: { type: boolean, description: True when every value passed verification. }
          run_id: { type: string }
          pages: { type: integer }
          config_revision: {"type": "integer", "minimum": 0}
          status: {"type": "string", "enum": ["completed", "failed"]}
          duration_ms: {"type": "integer", "minimum": 0}
          tokens: {"type": "integer", "minimum": 0}
          trace: {"type": "array", "items": {"type": "object", "required": ["kind", "status", "scope", "duration_ms", "input_tokens", "output_tokens"], "properties": {"kind": {"type": "string"}, "status": {"type": "string", "enum": ["failed", "completed"]}, "scope": {"type": "string"}, "model": {"type": "string"}, "duration_ms": {"type": "integer", "minimum": 0}, "input_tokens": {"type": "integer", "minimum": 0}, "output_tokens": {"type": "integer", "minimum": 0}, "queries": {"type": "array", "items": {"type": "string"}}, "message": {"type": "string"}}}}
      error:
        type: object
        required: [code, message]
        properties:
          code: { type: string }
          message: { type: string }
      ports:
      - { id: result, label: Values, direction: out }
      - { id: failed, label: Failed, direction: out }
      presentation:
        category: Documents
        icon: tabler:file-search
        hue: violet
        blurb: Pulls typed fields from a document, with quotes and pages for each value.
      execution:
        kind: function
        function_id: kickside.docscout.blocks:extract_run
