version: '1.0'
namespace: kickside.docscout.traits
entries:
- name: run_extraction
  kind: registry.entry
  meta:
    type: tool
    public: false
    title: Run extraction
    llm_alias: run_extraction
    llm_description: Run extraction
    input_schema:
      type: object
      additionalProperties: false
      properties:
        extractor_id: &id001
          type: string
          minLength: 1
        upload_id: *id001
        overrides:
          type: object
          additionalProperties: false
          properties: &id002
            fields:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  name:
                    type: string
                    pattern: ^[A-Za-z][A-Za-z0-9_]*$
                    maxLength: 80
                  type:
                    type: string
                    default: text
                    enum:
                    - text
                    - number
                    - boolean
                    - date
                    - enum
                    - list
                    - object
                  description:
                    type: string
                    default: ''
                    maxLength: 4000
                  enum_values:
                    type: array
                    items:
                      type: string
                      minLength: 1
                    uniqueItems: true
                    maxItems: 100
                  item_type:
                    type: string
                    default: text
                    enum:
                    - text
                    - number
                    - boolean
                    - date
                    - object
                  required:
                    type: boolean
                    default: false
                  search_hints:
                    type: string
                    default: ''
                  validation_hints:
                    type: string
                    default: ''
                  expected_format:
                    type: string
                    default: ''
                  strategy:
                    type: string
                    default: standard
                    enum:
                    - standard
                    - deep
                  evidence_required:
                    type: boolean
                    default: true
                required:
                - name
                - type
                - description
                - enum_values
                - item_type
                - required
                - search_hints
                - validation_hints
                - expected_format
                - strategy
                - evidence_required
              maxItems: 100
            workflow:
              type: array
              items:
                oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: map
                      const: map
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: section
                      enum:
                      - outline
                      - section
                      - chunk
                    model:
                      type: string
                      default: class:fast
                      minLength: 1
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        outline_mode:
                          type: string
                          default: find_or_build
                          enum:
                          - find_or_build
                          - build
                      required:
                      - outline_mode
                  required:
                  - kind
                  - enabled
                  - scope
                  - model
                  - options
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: prefetch
                      const: prefetch
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: section
                      enum:
                      - outline
                      - section
                      - chunk
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        queries:
                          type: array
                          items:
                            type: string
                            minLength: 1
                          maxItems: 100
                      required:
                      - queries
                  required:
                  - kind
                  - enabled
                  - scope
                  - options
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: scout
                      const: scout
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: chunk
                      enum:
                      - outline
                      - section
                      - chunk
                    model:
                      type: string
                      default: class:fast
                      minLength: 1
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        max_iterations:
                          type: integer
                          default: 4
                          minimum: 1
                          maximum: 30
                        target_confidence:
                          type: number
                          default: 0.9
                          minimum: 0
                          maximum: 1
                        max_extra_queries:
                          type: integer
                          default: 3
                          minimum: 0
                          maximum: 20
                        drop_noise:
                          type: boolean
                          default: true
                      required:
                      - max_iterations
                      - target_confidence
                      - max_extra_queries
                      - drop_noise
                  required:
                  - kind
                  - enabled
                  - scope
                  - model
                  - options
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: deep
                      const: deep
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: section
                      enum:
                      - outline
                      - section
                      - chunk
                    model:
                      type: string
                      default: class:fast
                      minLength: 1
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        parallel_fields:
                          type: integer
                          default: 4
                          minimum: 1
                          maximum: 20
                      required:
                      - parallel_fields
                  required:
                  - kind
                  - enabled
                  - scope
                  - model
                  - options
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: extract
                      const: extract
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: chunk
                      enum:
                      - outline
                      - section
                      - chunk
                    model:
                      type: string
                      default: class:premium
                      minLength: 1
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        max_output_tokens:
                          type: integer
                          minimum: 256
                          maximum: 64000
                          default: 4096
                      required:
                      - max_output_tokens
                  required:
                  - kind
                  - enabled
                  - scope
                  - model
                  - options
                - type: object
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      default: verify
                      const: verify
                    enabled:
                      type: boolean
                      default: true
                    scope:
                      type: string
                      default: chunk
                      enum:
                      - outline
                      - section
                      - chunk
                    model:
                      type: string
                      default: class:fast
                      minLength: 1
                    options:
                      type: object
                      additionalProperties: false
                      properties:
                        require_all_values:
                          type: boolean
                          default: true
                      required:
                      - require_all_values
                  required:
                  - kind
                  - enabled
                  - scope
                  - model
                  - options
              minItems: 6
              maxItems: 6
            retrieval:
              type: object
              additionalProperties: false
              properties:
                chunk_size:
                  type: integer
                  default: 1200
                  minimum: 100
                  maximum: 16000
                overlap:
                  type: integer
                  default: 150
                  minimum: 0
                  maximum: 4000
                split_headings:
                  type: boolean
                  default: true
                search_mode:
                  type: string
                  default: hybrid
                  enum:
                  - keyword
                  - semantic
                  - hybrid
                top_results:
                  type: integer
                  default: 6
                  minimum: 1
                  maximum: 100
                contextual_embeddings:
                  type: boolean
                  default: true
                highlighter:
                  type: boolean
                  default: false
                highlighter_model:
                  type: string
                  default: class:fast
                  minLength: 1
                embedding_model:
                  type: string
                  default: class:embed
                  minLength: 1
              required:
              - chunk_size
              - overlap
              - split_headings
              - search_mode
              - top_results
              - contextual_embeddings
              - highlighter
              - highlighter_model
              - embedding_model
            tools:
              type: object
              additionalProperties: false
              properties:
                keyword_search:
                  type: boolean
                  default: true
                semantic_search:
                  type: boolean
                  default: true
                read_section:
                  type: boolean
                  default: true
                read_outline:
                  type: boolean
                  default: true
              required:
              - keyword_search
              - semantic_search
              - read_section
              - read_outline
          required: []
      required:
      - extractor_id
      - upload_id
    output_schema:
      type: object
      additionalProperties: false
      properties:
        run_id: *id001
        upload_id: *id001
        config_revision:
          type: integer
          minimum: 0
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name: *id001
              value:
                type:
                - string
                - number
                - boolean
                - array
                - object
                - 'null'
              confidence:
                type: number
                minimum: 0
                maximum: 1
              evidence:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    quote:
                      type: string
                      minLength: 1
                    section:
                      type: string
                    page:
                      type: integer
                      minimum: 1
                    chunk_id: *id001
                    start_offset:
                      type: integer
                      minimum: 0
                    end_offset:
                      type: integer
                      minimum: 0
                  required:
                  - quote
                  - section
                  - chunk_id
              verified:
                type: boolean
            required:
            - name
            - value
            - confidence
            - evidence
            - verified
        trace:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - map
                - prefetch
                - scout
                - deep
                - extract
                - verify
              status:
                type: string
                enum:
                - running
                - completed
                - failed
              scope:
                type: string
                enum:
                - outline
                - section
                - chunk
              model:
                type: string
              duration_ms:
                type: number
                minimum: 0
              input_tokens:
                type: integer
                minimum: 0
              output_tokens:
                type: integer
                minimum: 0
              cost:
                type: number
                minimum: 0
              queries:
                type: array
                items:
                  type: string
              message:
                type: string
            required:
            - kind
            - status
            - scope
            - duration_ms
            - input_tokens
            - output_tokens
        duration_ms:
          type: number
          minimum: 0
        tokens:
          type: integer
          minimum: 0
        cost:
          type: number
          minimum: 0
      required:
      - run_id
      - upload_id
      - config_revision
      - fields
      - trace
      - duration_ms
      - tokens
  function_id: kickside.docscout:run_extraction
- name: list_extractors
  kind: registry.entry
  meta:
    type: tool
    public: false
    title: List extractors
    llm_alias: list_extractors
    llm_description: List extractors
    input_schema:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    output_schema:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id001
              title:
                type: string
              description:
                type: string
              field_count:
                type: integer
                minimum: 0
              can_edit:
                type: boolean
            required:
            - id
            - title
            - description
            - field_count
            - can_edit
        next_offset:
          type: integer
          minimum: 0
      required:
      - items
  function_id: kickside.docscout:list_extractors
- name: configure_extractor
  kind: registry.entry
  meta:
    type: tool
    public: false
    title: Configure extractor
    llm_alias: configure_extractor
    llm_description: Configure extractor
    input_schema:
      type: object
      additionalProperties: false
      properties:
        extractor_id: *id001
        expected_revision:
          type: integer
          minimum: 0
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        config: &id003
          type: object
          additionalProperties: false
          properties: *id002
          required:
          - fields
          - workflow
          - retrieval
          - tools
      required:
      - extractor_id
      - expected_revision
      - title
      - config
    output_schema:
      type: object
      additionalProperties: false
      properties:
        context_revision:
          type: integer
          minimum: 0
      required:
      - context_revision
  function_id: kickside.docscout:configure_extractor
- name: evaluate_extractor
  kind: registry.entry
  meta:
    type: tool
    public: false
    title: Evaluate extractor
    llm_alias: evaluate_extractor
    llm_description: Evaluate extractor
    input_schema:
      type: object
      additionalProperties: false
      properties:
        extractor_id: *id001
        revisions:
          type: array
          items:
            type: integer
            minimum: 0
          minItems: 1
          maxItems: 2
      required:
      - extractor_id
    output_schema:
      type: object
      additionalProperties: false
      properties:
        eval_id: *id001
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              revision:
                type: integer
              cases:
                type: integer
              metrics:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    field:
                      type: string
                    accuracy:
                      type: number
                      minimum: 0
                      maximum: 1
                    cost:
                      type: number
                      minimum: 0
                    duration_ms:
                      type: number
                      minimum: 0
                  required:
                  - field
                  - accuracy
                  - cost
                  - duration_ms
              cost:
                type: number
                minimum: 0
              duration_ms:
                type: number
                minimum: 0
            required:
            - revision
            - cases
            - metrics
            - cost
            - duration_ms
      required:
      - eval_id
      - results
  function_id: kickside.docscout:evaluate_extractor
- name: tune_extractor
  kind: registry.entry
  meta:
    type: tool
    public: false
    title: Propose configuration changes
    llm_alias: tune_extractor
    llm_description: Propose configuration changes
    input_schema:
      type: object
      additionalProperties: false
      properties:
        extractor_id: *id001
        eval_id: *id001
        expected_revision:
          type: integer
          minimum: 0
      required:
      - extractor_id
      - eval_id
      - expected_revision
    output_schema:
      type: object
      additionalProperties: false
      properties:
        proposals:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id001
              title:
                type: string
              changes:
                type: array
                items:
                  type: string
              base_revision:
                type: integer
                minimum: 0
              config: *id003
              accuracy_delta:
                type: number
              cost_delta:
                type: number
              duration_delta_ms:
                type: number
            required:
            - id
            - title
            - changes
            - base_revision
            - config
            - accuracy_delta
            - cost_delta
            - duration_delta_ms
      required:
      - proposals
  function_id: kickside.docscout:tune_extractor
- name: reader
  kind: registry.entry
  meta:
    type: agent.trait
    public: false
    title: Document extraction
    icon: tabler:file-search
  prompt: Select an accessible extractor, then run extraction against an upload. Report field evidence and uncertainty.
  tools:
  - kickside.docscout.traits:run_extraction
  - kickside.docscout.traits:list_extractors
- name: configurator
  kind: registry.entry
  meta:
    type: agent.trait
    public: false
    title: Configure and evaluate Docscout
    icon: tabler:file-search
  prompt: Configure fields and reading steps under WRITE access. Evaluate revisions against cases. Propose changes
    with measured deltas; an owner applies or discards proposals.
  tools:
  - kickside.docscout.traits:list_extractors
  - kickside.docscout.traits:configure_extractor
  - kickside.docscout.traits:evaluate_extractor
  - kickside.docscout.traits:tune_extractor
