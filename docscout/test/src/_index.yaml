    user_groups_repo: kickside.users.persist:user_groups_repo
    upload_records: kickside.uploads.persist:upload_record_repo
- name: fixture_llm_refuse
  kind: function.lua
  meta:
    comment: Fixture model driver method that refuses every call.
  source: file://fixture_llm.lua
  method: refuse
- name: fixture_llm_driver
  kind: contract.binding
  meta:
    comment: Fixture model driver for tests of the checks the llm module makes before a call.
  contracts:
  - contract: wippy.llm:generator
    methods:
      generate: app:fixture_llm_refuse
  - contract: wippy.llm:structured_output
    methods:
      structured_output: app:fixture_llm_refuse
  - contract: wippy.llm:embedder
    methods:
      embed: app:fixture_llm_refuse
  - contract: wippy.llm:provider
    methods:
      status: app:fixture_llm_refuse
- name: fixture_llm_provider
  kind: registry.entry
  meta:
    type: llm.provider
    name: docscout-fixture
    title: Docscout fixture provider
  driver:
    id: app:fixture_llm_driver
    options: {}
- name: fixture_small_model
  kind: registry.entry
  meta:
    type: llm.model
    name: docscout-small
    title: Docscout small-window fixture model
    capabilities: [generate, structured_output]
    class: [docscout-small]
    priority: 100
  max_tokens: 400
  output_tokens: 100
  providers:
  - id: app:fixture_llm_provider
    provider_model: docscout-small
- name: fixture_refusal_model
  kind: registry.entry
  meta:
    type: llm.model
    name: docscout-refusal
    title: Refusing fixture model
    capabilities: [structured_output]
    class: [docscout-refusal]
    priority: 100
  max_tokens: 16000
  output_tokens: 4096
  providers:
  - id: app:fixture_llm_provider
    provider_model: docscout-refusal
- name: security_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_security
    group: Docscout
  source: file://security_test.lua
  method: run
  modules:
  - contract
  - funcs
  - uuid
  - json
  - registry
  - security
  imports:
    test: wippy.test:test

- name: error_boundaries_test
  kind: function.lua
  modules: [sql, uuid]
  meta:
