  - name: kickside.models:target_db
    value: app:db
  - name: kickside.models:api_router
    value: app:api
  - name: kickside.models:ui_server
    value: app:gateway
  - name: kickside.widgets:ui_server
    value: app:gateway
  - name: kickside.uploads:database_resource
    value: app:db
  - name: kickside.uploads:storage_resource
    value: app:uploads
  - name: kickside.uploads:api_router
    value: app:api
  - name: kickside.uploads:ui_server
    value: app:gateway
  - name: wippy.migration:app_db
    value: app:db
  - &id001
    name: wippy.bootloader:application_host
    value: app:processes
  - &id002
    name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
  - name: kickside.users:public_router
    value: app:api_public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app:user
  - name: kickside.users:admin_security_scope
    value: app:admin
  - name: kickside.users:login_role_resource
    value: app:*
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.dropzone.security:user_security_scope
    value: app:user
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.retention:user_security_scope
    value: app:user
  - name: kickside.core.threads:user_security_scope
    value: app:user
  - name: kickside.core.threads.hydration:user_security_scope
    value: app:user
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.threads.hydration:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: kickside.uploads:env_storage
    value: app:env_storage
  - name: kickside.uploads:storage_id
    value: app:uploads
  - name: kickside.uploads.security:user_security_scope
    value: app:user
  - name: userspace.dataflow:target_db
    value: app:db
  - name: userspace.dataflow:user_security_scope
    value: app:user
  - name: wippy.llm:process_host
    value: app:processes
  - name: wippy.llm:env_storage
    value: app:env_storage
  - name: wippy.relay:user_security_scope
    value: app:user
  - name: wippy.relay:env_storage
    value: app:env_storage
  - name: wippy.relay:application_host
    value: app:processes
  - name: wippy.session:api_router
    value: app:api
  - name: wippy.session:database_resource
    value: app:db
  - name: wippy.session:default_host
    value: app:processes
  - name: wippy.session:env_storage
    value: app:env_storage
  - name: wippy.session:delegation_func_id
    value: userspace.dataflow.session:delegate
  - name: wippy.views:api_router
    value: app:api_public
  - name: wippy.views:env_storage
    value: app:env_storage
  - name: kickside.connection:api_router
    value: app:api
  - name: kickside.connection:ui_server
    value: app:gateway
  - name: kickside.models:process_host
    value: app:processes
  - name: kickside.widgets:api_router
    value: app:api
- name: dep.bootloader
  kind: ns.dependency
  component: wippy/bootloader
  version: '*'
  parameters:
  - *id001
  - *id002
- name: probe
  kind: function.lua
  source: file://probe.lua
  method: run
  modules: [contract, security, json, funcs]
  imports:
    processing: kickside.docscout.engine:process
    retention: kickside.docscout:retention
    execution_identity: kickside.execution:execution_identity
    jobs: kickside.core.jobs:jobs
    extractors: kickside.docscout:extractors
    evals: kickside.docscout.evals:evals
    repository: kickside.docscout.persist:repository
- name: fixture_settings_get
  kind: function.lua
  source: file://fixture_settings.lua
  method: get
  modules: [security]
- name: retention_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_retention
    group: Docscout
  source: file://retention_test.lua
  method: run
  modules: [registry, security]
  imports:
    test: wippy.test:test
    data: app:fixture_data
- name: expiry_test
