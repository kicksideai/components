version: '1.0'
namespace: app
entries:
- name: dep.kickside.realtime
  kind: ns.dependency
  component: kickside/realtime
  version: '*'
- name: dep.kickside.security
  kind: ns.dependency
  version: '*'
  component: kickside/security
  parameters:
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: Database for Drop zone lifecycle tests.
  file: ':memory:'
- name: uploads
  kind: fs.directory
  meta:
    comment: Default uploads storage so the artifact content repository can write
      artifact blobs.
  directory: ./.wippy
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
  middleware:
  - token_auth
  options:
    token_store: kickside.users.security:tokens
- name: api_public
  kind: http.router
  meta:
    comment: Separate router for wippy/views to avoid colliding views' /components/by-tag/{tag}
      with the component module's /components/{id}/access on /api.
    server: gateway
  prefix: /public
- name: user
  kind: security.policy
  meta:
    comment: Test member scope.
  groups:
  - kb_test
  - app:user
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: admin
  kind: security.policy
  meta:
    comment: Permissive administrator scope used by structured lifecycle grants.
  groups:
  - kb_test_admin
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: dep.kickside.users
  kind: ns.dependency
  component: kickside/users
  version: '*'
  parameters:
  - name: kickside.users:public_router
    value: app:api_public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app:user
  - name: kickside.users:admin_security_scope
    value: app:admin
  - name: kickside.users:login_role_resource
    value: app:*
  - name: kickside.users:ui_server
    value: app:gateway
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: dep.module
  kind: ns.dependency
  component: kickside/docscout
  version: '*'
  parameters:
  - name: kickside.docscout:target_db
    value: app:db
  - name: kickside.docscout:api_router
    value: app:api
  - name: kickside.docscout:ui_server
    value: app:gateway
  - name: kickside.docscout.security:user_security_scope
    value: app:user
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.agents:target_db
    value: app:db
  - name: kickside.agents:api_router
    value: app:api
  - name: kickside.agents:ui_server
    value: app:gateway
  - name: kickside.blocks:target_db
    value: app:db
  - name: kickside.blocks:api_router
    value: app:api
  - name: kickside.models:target_db
    value: app:db
  - name: kickside.models:api_router
    value: app:api
  - name: kickside.models:ui_server
    value: app:gateway
  - name: kickside.widgets:ui_server
    value: app:gateway
  - name: kickside.uploads:database_resource
    value: app:db
  - name: kickside.uploads:storage_resource
    value: app:uploads
  - name: kickside.uploads:api_router
    value: app:api
  - name: kickside.uploads:ui_server
    value: app:gateway
  - name: wippy.migration:app_db
    value: app:db
  - &id001
    name: wippy.bootloader:application_host
    value: app:processes
  - &id002
    name: wippy.bootloader:env_storage
    value: app:env_storage
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
  - name: kickside.users:public_router
    value: app:api_public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app:user
  - name: kickside.users:admin_security_scope
    value: app:admin
  - name: kickside.users:login_role_resource
    value: app:*
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.dropzone.security:user_security_scope
    value: app:user
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.retention:user_security_scope
    value: app:user
  - name: kickside.core.threads:user_security_scope
    value: app:user
  - name: kickside.core.threads.hydration:user_security_scope
    value: app:user
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.threads.hydration:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: kickside.uploads:env_storage
    value: app:env_storage
  - name: kickside.uploads:storage_id
    value: app:uploads
  - name: kickside.uploads.security:user_security_scope
    value: app:user
  - name: userspace.dataflow:target_db
    value: app:db
  - name: userspace.dataflow:user_security_scope
    value: app:user
  - name: wippy.llm:process_host
    value: app:processes
  - name: wippy.llm:env_storage
    value: app:env_storage
  - name: wippy.relay:user_security_scope
    value: app:user
  - name: wippy.relay:env_storage
    value: app:env_storage
  - name: wippy.relay:application_host
    value: app:processes
  - name: wippy.session:api_router
    value: app:api
  - name: wippy.session:database_resource
    value: app:db
  - name: wippy.session:default_host
    value: app:processes
  - name: wippy.session:env_storage
    value: app:env_storage
  - name: wippy.session:delegation_func_id
    value: userspace.dataflow.session:delegate
  - name: wippy.views:api_router
    value: app:api_public
  - name: wippy.views:env_storage
    value: app:env_storage
  - name: kickside.connection:api_router
    value: app:api
  - name: kickside.connection:ui_server
    value: app:gateway
  - name: kickside.models:process_host
    value: app:processes
  - name: kickside.widgets:api_router
    value: app:api
- name: dep.bootloader
  kind: ns.dependency
  component: wippy/bootloader
  version: '*'
  parameters:
  - *id001
  - *id002
- name: probe
  kind: function.lua
  source: file://probe.lua
  method: run
  imports:
    extractors: kickside.docscout:extractors
    evals: kickside.docscout.evals:evals
    repository: kickside.docscout:repository
- name: lifecycle_test
  kind: function.lua
  meta:
    type: test
    suite: docscout
    group: Docscout
  source: file://lifecycle_test.lua
  method: run
  modules:
  - funcs
  - security
  - contract
  - json
  - registry
  - sql
  - uuid
  imports:
    test: wippy.test:test
- name: engine_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_engine
    group: Docscout
  source: file://engine_test.lua
  method: run
  modules:
  - json
  - uuid
  - sql
  - funcs
  imports:
    test: wippy.test:test
    process: kickside.docscout.engine:process
    store: kickside.docscout.engine:store
    stages: kickside.docscout.engine:stages
- name: shapes_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_shapes
    group: Docscout
  source: file://shapes_test.lua
  method: run
  modules:
  - json
  imports:
    test: wippy.test:test
    shapes: kickside.docscout.engine:shapes
- name: callers_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_callers
    group: Docscout
  source: file://callers_test.lua
  method: run
  modules:
  - funcs
  - security
  - registry
  - json
  - uuid
  imports:
    test: wippy.test:test
- name: scoring_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_scoring
    group: Docscout
  source: file://scoring_test.lua
  method: run
  imports:
    test: wippy.test:test
    scoring: kickside.docscout.evals:scoring
    evals: kickside.docscout.evals:evals
- name: evals_test
  kind: function.lua
  meta:
    type: test
    suite: docscout_evals
    group: Docscout
  source: file://evals_test.lua
  method: run
  modules:
  - funcs
  - security
  - registry
  - json
  - uuid
  - time
  imports:
    test: wippy.test:test
    user_repo: kickside.users.persist:user_repo
    user_groups_repo: kickside.users.persist:user_groups_repo
