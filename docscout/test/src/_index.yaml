- name: docscout_tools
  kind: security.scope
  meta:
    title: Docscout test tool users
- name: docscout_tools_composition
  kind: registry.entry
  meta:
    type: kickside.security.group_composition
  group_id: app:docscout_tools
  select:
    meta.surface: kickside.docscout
    meta.intent: tool_access
- name: runtime_data
  kind: security.policy
  meta:
    private: true
    comment: Host runtime primitives for tests under composed member scopes.
  groups: [app:runtime_members]
  policy:
    resources: [app:db, app:uploads]
    actions: [db.get, fs.get, store.get, store.info, store.key.get, store.key.list, store.key.set, store.key.delete, store.key.has]
    effect: allow

- name: migration_db
  kind: db.sql.sqlite
  file: ':memory:'
- name: runtime_contracts
  kind: security.policy
  meta:
    private: true
    comment: Host capabilities for binding the caller frame through native contracts and functions.
  groups: [app:runtime_members]
  policy:
    resources: [security, 'wippy.llm:*', 'wippy.llm.*']
    actions: [contract.get, contract.open, contract.call, contract.implementations, contract.security, funcs.call, funcs.security]
    effect: allow

- name: runtime_content_context
  kind: security.policy
  meta:
    private: true
    comment: Binds upload identifiers to the content-provider contract context.
  groups: [app:runtime_members]
  policy:
    resources: [context]
    actions: [contract.context]
    effect: allow

- name: fixture_data
  kind: library.lua
  source: file://fixture_data.lua
  modules: [funcs, security, registry, json, uuid, sql, fs, contract]
  imports:
    uploads: kickside.uploads.persist:upload_record_repo
    artifacts: kickside.uploads.persist:artifact_content_repo
    upload_types: kickside.uploads:types
    jobs: kickside.core.jobs:jobs
