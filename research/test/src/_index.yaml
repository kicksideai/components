version: "1.0"
namespace: app

# Research harness: boots kickside/research from source (workspace replacement) with
# every transitive requirement bound to harness-owned resources, so the deliver
# terminals, the compiled Dataflow graph, and the Research Block ABI are exercised
# against the real modules they compose.

entries:
  - name: access_probe
    kind: function.lua
    source: file://access_probe.lua
    method: read
    imports:
      state: kickside.research:state

  - name: member
    kind: security.policy
    groups: [app:member]
    policy:
      resources: '*'
      actions: [access, contract.get, contract.open, contract.call, contract.security, db.get, registry.get, process.send, funcs.call, funcs.security, security.policy_group.get, security.policy.get, security.actor.get, security.scope.get]
      effect: allow

  - name: component_writer_test
    kind: function.lua
    meta: { type: test, suite: kickside_research }
    source: file://component_writer_test.lua
    method: run
    modules: [security, funcs, crypto, registry]
    imports:
      test: wippy.test:test
      repo: kickside.research:repo

  - name: research_request_stub
    kind: function.lua
    meta:
      comment: Test implementation of the kickside.research:request contract that records a completed run.
    source: file://research_request_stub.lua
    method: request
    modules: [crypto, funcs, security]
    imports:
      repo: kickside.research:repo

  - name: research_request_stub_lib
    kind: library.lua
    source: file://research_request_stub.lua
    modules: [crypto, funcs, security]
    imports:
      repo: kickside.research:repo

  - name: deep_research_report_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_research
      group: Research
      comment: DeepResearch returns the whole completed report in its envelope and report_progress records progress as given.
    source: file://deep_research_report_test.lua
    method: run
    modules: [crypto, funcs, security, registry, json]
    imports:
      test: wippy.test:test
      repo: kickside.research:repo
      request_stub: app:research_request_stub_lib

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory DB for the research harness.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    addr: :19177

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: api_public
    kind: http.router
    meta:
      comment: Isolated router for transitive Session and Views endpoints not exercised here.
      server: gateway
    prefix: /public

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope the research suite runs under.
    groups:
      - research_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: uploads
    kind: fs.directory
    directory: ./.wippy/uploads
    auto_init: true

  - name: dep.kickside.research
    kind: ns.dependency
    version: "*"
    meta:
      comment: Research package under test, wired only to harness-owned resources.
    component: "kickside/research"
    parameters:
      - { name: kickside.research:target_db, value: app:db }
      - { name: kickside.research:api_router, value: app:api }
      - { name: kickside.research:ui_server, value: app:gateway }
      - { name: kickside.research.security:user_security_scope, value: app:user }

  - name: dep.kickside.blocks
    kind: ns.dependency
    version: "*"
    component: kickside/blocks
    parameters:
      - { name: kickside.blocks:process_host, value: app:processes }

  - name: dep.kickside.contract
    kind: ns.dependency
    version: '*'
    component: kickside/contract
    parameters:
    - name: kickside.contract.http:user_security_scope
      value: app:user

  - name: dep.kickside.webscout
    kind: ns.dependency
    version: "*"
    component: kickside/webscout

  - name: dep.kickside.core
    kind: ns.dependency
    version: '*'
    component: kickside/core
    parameters:
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.threads.hydration:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.threads.hydration:user_security_scope
      value: app:user

  - name: dep.kickside.component
    kind: ns.dependency
    version: '*'
    component: kickside/component
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl

  - name: dep.kickside.settings
    kind: ns.dependency
    version: "*"
    component: kickside/settings
    parameters:
      - { name: kickside.settings:target_db, value: app:db }
      - { name: kickside.settings:api_router, value: app:api }
      - { name: kickside.settings:ui_server, value: app:gateway }

  - name: dep.kickside.jobs
    kind: ns.dependency
    version: '*'
    component: kickside/jobs
    parameters:
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:temp_fs
      value: app:uploads
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.jobs:api_router
      value: app:api
    - name: kickside.core.scheduler:process_host
      value: app:processes
    - name: kickside.core.scheduler:env_storage
      value: app:env_storage

  - name: dep.kickside.agents
    kind: ns.dependency
    version: '*'
    component: kickside/agents
    parameters:
    - name: kickside.agents:api_router
      value: app:api
    - name: kickside.agents:ui_server
      value: app:gateway

  - name: dep.kickside.models
    kind: ns.dependency
    version: '*'
    component: kickside/models
    parameters:
    - name: kickside.models:target_db
      value: app:db
    - name: kickside.models:api_router
      value: app:api
    - name: kickside.models:ui_server
      value: app:gateway
    - name: kickside.models:process_host
      value: app:processes

  - name: dep.kickside.connection
    kind: ns.dependency
    version: '*'
    component: kickside/connection
    parameters:
    - name: kickside.connection:api_router
      value: app:api
    - name: kickside.connection:ui_server
      value: app:gateway

  - name: dep.kickside.transform
    kind: ns.dependency
    version: "*"
    component: kickside/transform
    parameters:
      - { name: kickside.transform:api_router, value: app:api }
      - { name: kickside.transform:ui_server, value: app:gateway }
      - { name: kickside.transform:env_storage, value: app:env_storage }
      - { name: kickside.transform.security:user_security_scope, value: app:user }

  - name: dep.kickside.uploads
    kind: ns.dependency
    version: "*"
    component: kickside/uploads
    parameters:
      - { name: kickside.uploads:api_router, value: app:api }
      - { name: kickside.uploads:ui_server, value: app:gateway }
      - { name: kickside.uploads:database_resource, value: app:db }
      - { name: kickside.uploads:env_storage, value: app:env_storage }
      - { name: kickside.uploads:storage_id, value: app:uploads }
      - { name: kickside.uploads.security:user_security_scope, value: app:user }

  - name: dep.kickside.users
    kind: ns.dependency
    version: "*"
    component: kickside/users
    parameters:
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:public_router, value: app:api_public }
      - { name: kickside.users:ui_server, value: app:gateway }
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:env_storage, value: app:env_storage }
      - { name: kickside.users:user_security_scope, value: app:user }
      - { name: kickside.users:admin_security_scope, value: app:user }
      - { name: kickside.users:login_role_resource, value: 'app:*' }

  - name: dep.wippy.relay
    kind: ns.dependency
    version: "*"
    component: wippy/relay
    parameters:
      - { name: application_host, value: app:processes }
      - { name: env_storage, value: app:env_storage }
      - { name: user_security_scope, value: app:user }

  - name: dep.wippy.llm
    kind: ns.dependency
    version: "*"
    component: wippy/llm
    parameters:
      - { name: env_storage, value: app:env_storage }
      - { name: process_host, value: app:processes }

  - name: dep.wippy.migration
    kind: ns.dependency
    version: "*"
    component: "wippy/migration"
    parameters:
      - name: app_db
        value: app:db

  - name: dep.wippy.bootloader
    kind: ns.dependency
    version: "*"
    meta:
      comment: Provides env storage/process host so bootloader entries decode in this harness.
    component: "wippy/bootloader"
    parameters:
      - name: application_host
        value: app:processes
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.views
    kind: ns.dependency
    version: "*"
    meta:
      comment: Views dependency required by session/dataflow module entries.
    component: "wippy/views"
    parameters:
      - name: api_router
        value: app:api_public
      - name: env_storage
        value: app:env_storage

  - name: dep.wippy.session
    kind: ns.dependency
    version: "*"
    meta:
      comment: Session dependency required by wippy/dataflow entries loaded with research.
    component: "wippy/session"
    parameters:
      - name: api_router
        value: app:api_public
      - name: database_resource
        value: app:db
      - name: default_host
        value: app:processes
      - name: env_storage
        value: app:env_storage
      - name: delegation_func_id
        value: userspace.dataflow.session:delegate

  - name: dep.wippy.dataflow
    kind: ns.dependency
    version: '*'
    component: wippy/dataflow
    parameters:
      - name: target_db
        value: app:db
      - name: process_host
        value: app:processes
      - name: api_router
        value: app:api

  - name: deliver_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_research
      group: Research
      comment: deliver terminals -- report normalization, fail-closed blank report, RESULT / FAILED thread-append payloads.
    source: file://deliver_test_proxy.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      deliver: kickside.research:deliver
      research_consts: kickside.research:consts

  - name: request_graph_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_research
      group: Research
      comment: compiled research Dataflow graph -- agent and deliver error edges both reach deliver_error; meta reaches both terminals.
    source: file://request_graph_test_proxy.lua
    method: run
    imports:
      test: wippy.test:test
      research_request: kickside.research:request_func
      flow: userspace.dataflow.flow:flow
      compiler: userspace.dataflow.flow:compiler

  - name: block_signal_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_research
      group: Research
      comment: Research Block arm/resume -- canonical ABI shaping, idempotency, reference-only payloads, and duplicate-terminal-event guard.
    source: file://block_signal_test_proxy.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      block_signal: kickside.research:arm_research_block

  - name: block_contract_test
    kind: function.lua
    meta:
      type: test
      suite: kickside_research
      group: Research
      comment: Research publishes one strict kickside.block/v1 wait Block.
    source: file://block_contract_test_proxy.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      worker: kickside.core.projections.persist:worker

  - name: user_endpoint_policy_test
    kind: function.lua
    meta:
      type: test
      suite: member_endpoint_policy
    source: file://user_endpoint_policy_test.lua
    method: run
    modules:
    - registry
    - security
    imports:
      test: wippy.test:test

  - name: dep.kickside.security
    kind: ns.dependency
    component: kickside/security
    version: '*'
    parameters:
    - {name: api_router, value: app:api}
    - {name: ui_server, value: app:gateway}
    - {name: target_db, value: app:db}
    - {name: process_host, value: app:processes}

  - name: structured_report_test
    kind: function.lua
    meta: {type: test, suite: kickside_research}
    source: file://structured_report_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      deliver: kickside.research:deliver
      deep_research: kickside.research.traits:deep_research
