    meta: { type: projection.worker }
    source: file://plugin_projection_worker.lua
    method: run
    modules: [sql, security, contract]

  - name: folding_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:plugin_attachment
      config_schema: { type: object, properties: { fail: { type: boolean }, marker: { type: string } }, additionalProperties: false }
      projections:
        - kind: app:product_fold
          worker_ref: func://app:plugin_projection_worker
          input: events
          events: [kickside.pim.events:product.created, kickside.pim.events:product.changed]

  - name: missing_worker_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      projections:
        - { kind: app:missing_fold, worker_ref: 'func://app:absent_worker', input: events, events: [] }

  - name: wrong_worker_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      projections:
        - { kind: app:wrong_fold, worker_ref: 'func://app:pim_call', input: events, events: [] }

  - name: plugin_attachment
    kind: contract.binding
    meta:
      class: [pim_test_plugin]
      placement: { parents: [root], fixed: true }
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: app:plugin_attachment_delete

  - name: plugin_attachment_delete
    kind: function.lua
    source: file://plugin_attachment_delete.lua
    method: delete
    modules: [ctx, sql]
    imports:
      component: kickside.component:component

  - name: agent_conformance
    kind: library.lua
    source: file://agent_conformance.lua
    modules: [registry, json, security]
    imports:
      test: wippy.test:test
      consts: kickside.pim:consts
      requests: kickside.pim:requests

  - name: compile_agent
    kind: function.lua
    source: file://compile_agent.lua
    method: run
    imports:
      compiler: wippy.agent.compiler:compiler

  - name: unknown_tool_plugin
    kind: registry.entry
    meta: {type: kickside.pim.plugin, attachment: 'app:empty_plugin_attachment', tools: ['app:absent_tool']}
  - name: wrong_tool_plugin
    kind: registry.entry
    meta: {type: kickside.pim.plugin, attachment: 'app:empty_plugin_attachment', tools: ['app:pim_call']}


  - name: plugin_rebuild
    kind: function.lua
    source: file://plugin_rebuild.lua
    method: run
    security:
      policies: [kickside.pim.security:schema_output_publish]
    imports: { writer: 'kickside.pim.command:writer' }

  - name: malformed_answer
    kind: function.lua
    source: file://type_function_probes.lua
    method: malformed
    imports: {common: 'app:type_value_fixture'}

  - name: audit_regressions_test
    kind: function.lua
    meta: {type: test, suite: kickside_pim, timeout: 300s}
    source: file://audit_regressions_test.lua
    method: run
    modules: [json, funcs, registry]
    imports:
      clock: kickside.pim:clock
      plugins: kickside.pim.extensions:plugins
      retention_rows: kickside.pim.persist:retention_rows
      component: kickside.component:component
      create: kickside.pim.command:create
      attachments: kickside.pim.extensions:plugin_attachments
      threads: kickside.pim.command:threads
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      values: kickside.pim.domain:values
      checks: kickside.pim.extensions:checks
      type_functions: kickside.pim.extensions:type_functions
      types: kickside.pim:types
      data_error: kickside.pim:data_error
      store: kickside.pim.persist:store

  - name: ownership_probe
    kind: function.lua
    source: file://ownership_probe.lua
    modules: [time, json]
    method: run
    imports:
      create: kickside.pim.command:create
      threads: kickside.pim.command:threads
      attachments: kickside.pim.extensions:plugin_attachments
      component: kickside.component:component

  - name: incomplete_tool
    kind: function.lua
    source: file://empty_plugin_delete.lua
    method: delete
    meta: {type: tool, title: Incomplete}
  - name: incomplete_tool_plugin
    kind: registry.entry
    meta: {type: kickside.pim.plugin, attachment: 'app:empty_plugin_attachment', tools: ['app:incomplete_tool']}

  - name: dep.agents
    kind: ns.dependency
    version: "*"
    component: kickside/agents
    parameters:
      - {name: 'kickside.agents:api_router', value: 'app:api'}
      - {name: 'kickside.agents:ui_server', value: 'app:gateway'}
      - {name: 'kickside.connection:api_router', value: 'app:api'}
      - {name: 'kickside.connection:ui_server', value: 'app:gateway'}
      - {name: 'kickside.uploads:database_resource', value: 'app:db'}
      - {name: 'kickside.uploads:api_router', value: 'app:api'}
      - {name: 'kickside.uploads:ui_server', value: 'app:gateway'}
      - {name: 'kickside.uploads:env_storage', value: 'app:env_storage'}
      - {name: 'kickside.uploads:storage_id', value: 'app:exports'}
      - {name: 'wippy.relay:application_host', value: 'app:processes'}
      - {name: 'wippy.relay:env_storage', value: 'app:env_storage'}

  - name: trim_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim }
    source: file://trim_test.lua
    method: run
    imports:
      test: wippy.test:test
      trim_text: kickside.pim:text
