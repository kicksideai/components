# SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0
version: "1.0"
namespace: app

# Harness for kickside/pim on the real Core stack: components, threads,
# projections and jobs, on SQLite by default and PostgreSQL with --profile postgres.

entries:
  - name: clock_precision_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim }
    source: file://clock_precision_test.lua
    method: run
    modules: [time]
    imports:
      types: kickside.pim:types
      store: kickside.pim.persist:store
      retention_rows: kickside.pim.persist:retention_rows
      consts: kickside.pim:consts
      test: wippy.test:test
      clock: kickside.pim:clock

  - name: definition
    kind: ns.definition
    meta: { title: Kickside PIM Test Harness }

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: Test database; the postgres profile replaces it.
    file: ./.wippy/pim-test.sqlite

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    addr: :19319
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    middleware:
      - token_auth
    post_middleware:
      - endpoint_firewall
    options:
      token_store: kickside.users.security:tokens
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope for harness actors.
    groups:
      - app.security:pim_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: plugin_runtime
    kind: security.policy
    meta:
      comment: What a plugin module grants its users - reading its own declarations; stands for the plugin's module_runtime.
    groups:
      - kickside.security.groups:members
    policy:
      resources:
        - app:stock_scope
        - app:cost_scope
        - app:ghost_scope
        - app:weight_check
        - app:actor_check
        - app:location_target
        - app:offline_target
      actions: [registry.get, funcs.call]
      effect: allow

  - name: caller_only
    kind: security.policy
    meta:
      comment: Lets a session run the harness caller function and nothing else; the application baseline carries the session's own actor and scope into the call.
    policy:
      resources: ['app:pim_call', 'app:direct_call']
      actions: ['funcs.call']
      effect: allow

  - name: actors
    kind: library.lua
    meta:
    source: file://actors.lua
    modules: [sql, security]

  - name: fixture
    kind: library.lua
    meta:
    source: file://fixture.lua
    modules: [security, uuid, funcs, json]
    imports:
      types: kickside.pim:types
      store: kickside.pim.persist:store
      retention_rows: kickside.pim.persist:retention_rows
      actors: app:actors

  - name: schema_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, comment: Declaration compile, ids, ownership, layout and resolution. }
    source: file://schema_test.lua
    method: run
    modules: [json]
    imports:
      types: kickside.pim:types
      schema_fixture: app:schema_fixture
      test: wippy.test:test
      schema: kickside.pim.schema:compile
      changes: kickside.pim.schema:classify
      declaration: kickside.pim.schema:merge

  - name: catalog_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Command path, projection, replay, uniqueness and queries on the real thread stack. }
    source: file://catalog_test.lua
    method: run
    modules: [json, time, channel]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      materializer: kickside.pim.persist:materializer
      types: kickside.pim:types

  - name: history_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Change history rows and the audit policy across settings, catalog policy and sources. }
    source: file://history_test.lua
    method: run
    modules: [funcs, registry]
    imports:
      steps: app:steps
      test: wippy.test:test
      fixture: app:fixture
      types: kickside.pim:types

  - name: trash_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Trash, restore, purge, tombstones and change-history retention. }
    source: file://trash_test.lua
    method: run
    imports:
      trash_fixture: app:trash_fixture
      steps: app:steps
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      types: kickside.pim:types

  - name: projection_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Fold budget, catalog counters, descendant stamping and the rebuild slot. }
    source: file://projection_test.lua
    method: run
    modules: [funcs, uuid, time, json]
    imports:
      catalog_fixture: app:catalog_fixture
      narrow: kickside.pim:narrow
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      materializer: kickside.pim.persist:materializer
      types: kickside.pim:types
      jobs: kickside.core.jobs:jobs

  - name: feeds_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Changes and publications feeds, release, schema, link, hierarchy and explain reads. }
    source: file://feeds_test.lua
    method: run
    modules: [time]
    imports:
      steps: app:steps
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      types: kickside.pim:types

  - name: location_target
    kind: contract.binding
    meta:
      comment: Harness link target - locations a plugin owns, answered from its own table.
      kind: app.location
      title: Location
    contracts:
      - contract: kickside.pim:link_target
        methods:
          resolve: app:location_resolve
          describe: app:location_describe

  - name: offline_target
    kind: contract.binding
    meta:
      comment: Harness link target whose owner is offline.
      kind: app.offline
      title: Offline
    contracts:
      - contract: kickside.pim:link_target
        methods:
          resolve: app:location_offline
          describe: app:location_offline

  - name: location_resolve
    kind: function.lua
    meta: { comment: Harness link target resolve. }
    source: file://link_targets.lua
    method: resolve
    modules: [sql, security]

  - name: location_describe
    kind: function.lua
    meta: { comment: Harness link target describe. }
    source: file://link_targets.lua
    method: describe
    modules: [sql, security]

  - name: location_offline
    kind: function.lua
    meta: { comment: Harness link target that fails. }
    source: file://link_targets.lua
    method: offline
    modules: [sql, security]

  - name: merge_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Term merge - inline rewrite, refusals, and the job beyond 500 products. }
    source: file://merge_test.lua
    method: run
    modules: [sql, json, time, funcs]
    imports:
      merge_rows: kickside.pim.persist:merge_rows
      clock: kickside.pim:clock
      test: wippy.test:test
      fixture: app:fixture
      scoped: app:scoped
      steps: app:steps
      types: kickside.pim:types
      store: kickside.pim.persist:store

  - name: enforce_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Enforced checks - compile rule, rejection before state changes, level ownership, exemptions, proposals. }
    source: file://enforce_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: links_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Link kinds - bound targets, one resolve per kind per command, index, release labels, degradation. }
    source: file://links_test.lua
    method: run
    modules: [sql, json]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: realtime_notify
    kind: function.lua
    meta: { comment: Harness realtime notify recording each delivery. }
    source: file://realtime_fake.lua
    method: notify
    modules: [sql]

  - name: realtime_broadcast
    kind: function.lua
    meta: { comment: Harness realtime broadcast; catalogs only notify their readers. }
    source: file://realtime_fake.lua
    method: broadcast
    modules: [sql]

  - name: realtime_binding
    kind: contract.binding
    meta:
      comment: Harness realtime implementation recording catalog notifications.
    contracts:
      - contract: kickside.contract:realtime
        default: true
        methods:
          notify: app:realtime_notify
          broadcast: app:realtime_broadcast

  - name: steps
    kind: library.lua
    meta: { comment: Typed shortcuts for one-item commands and product reads in tests. }
    source: file://steps.lua
    modules: [time]
    imports:
      types: kickside.pim:types
      fixture: app:fixture

  - name: context_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Contexts and fallback chains through writes, reads, explain, snapshots and indexes. }
    source: file://context_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: ownership_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Ownership levels, variation axes, hierarchy, moves and the descendant limit. }
    source: file://ownership_test.lua
    method: run
    modules: [time]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: unique_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: "SKU and unique values - case, length, in-command claims, keys and reuse." }
    source: file://unique_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: version_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: "Expect versions, ordered sources, source rules, statuses and command modes." }
    source: file://version_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: idempotency_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: "Idempotency keys - replay, conflicts, namespaces and stored results." }
    source: file://idempotency_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      types: kickside.pim:types

  - name: terms_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: "Vocabulary terms - codes, labels, hierarchy, retirement and use in values." }
    source: file://terms_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types
      store: kickside.pim.persist:store

  - name: dep.test
    kind: ns.dependency
    version: "*"
    component: wippy/test

  - name: dep.migration
    kind: ns.dependency
    version: "*"
    component: wippy/migration
    parameters:
      - { name: wippy.migration:app_db, value: app:db }

  - name: dep.users
    kind: ns.dependency
    version: "*"
    component: kickside/users
    parameters:
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:env_storage, value: app:env_storage }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:public_router, value: app:api }
      - { name: kickside.users:ui_server, value: app:gateway }
      - { name: kickside.users:user_security_scope, value: app.security:pim_test }
      - { name: kickside.users:admin_security_scope, value: app.security:pim_test }
      - { name: kickside.users:login_role_resource, value: app:user }

  - name: dep.settings
    kind: ns.dependency
    version: "*"
    component: kickside/settings
    parameters:
      - { name: kickside.settings:target_db, value: app:db }
      - { name: kickside.settings:api_router, value: app:api }
      - { name: kickside.settings:ui_server, value: app:gateway }

  - name: dep.component
    kind: ns.dependency
    version: "*"
    component: kickside/component
    parameters:
      - { name: kickside.component:target_db, value: app:db }
      - { name: kickside.component:api_router, value: app:api }
      - { name: kickside.component:lifecycle_impl, value: kickside.core.lifecycle:component_lifecycle_impl }

  - name: dep.jobs
    kind: ns.dependency
    version: "*"
    component: kickside/jobs
    parameters:
      - { name: kickside.core.jobs:target_db, value: app:db }
      - { name: kickside.core.jobs:process_host, value: app:processes }

  - name: dep.core
    kind: ns.dependency
    version: "*"
    component: kickside/core
    parameters:
      - { name: kickside.core:target_db, value: app:db }
      - { name: kickside.core.lifecycle:process_host, value: app:processes }
      - { name: kickside.core.threads:api_router, value: app:api }
      - { name: kickside.core.threads:process_host, value: app:processes }
      - { name: kickside.core.projections:api_router, value: app:api }
      - { name: kickside.core.retention:api_router, value: app:api }
      - { name: kickside.core.retention:process_host, value: app:processes }
      - name: kickside.core.lifecycle:user_lifecycle_grant
        value: { subject_id: app:user, subject_type: group, access_mask: 2 }
      - name: kickside.core.lifecycle:admin_lifecycle_grant
        value: { subject_id: app.security:pim_test, subject_type: group, access_mask: 11 }

  - name: dep.contract
    kind: ns.dependency
    version: "*"
    component: kickside/contract

  - name: dep.security
    kind: ns.dependency
    version: "*"
    component: kickside/security
    parameters:
      - { name: kickside.security:target_db, value: app:db }
      - { name: kickside.security:api_router, value: app:api }
      - { name: kickside.security:ui_server, value: app:gateway }
      - { name: kickside.security:process_host, value: app:processes }

  - name: dep.module
    kind: ns.dependency
    version: "*"
    component: kickside/pim
    parameters:
      - { name: kickside.pim:target_db, value: app:db }
      - { name: kickside.pim:api_router, value: app:api }

  - name: pim_call
    kind: function.lua
    meta:
    source: file://pim_call.lua
    method: run
    modules: [contract, security, funcs]
    imports:
      conflict_fixture: app:conflict_fixture
      conflict_writer: app:conflict_writer_probe
      merge_fixture: app:merge_fixture
      component: kickside.component:component

  - name: dep.blocks
    kind: ns.dependency
    version: "*"
    component: kickside/blocks
    parameters:
      - { name: kickside.blocks:process_host, value: app:processes }
      - { name: wippy.session:api_router, value: app:api }
      - { name: wippy.session:env_storage, value: app:env_storage }
      - { name: wippy.session:delegation_func_id, value: userspace.dataflow.session:delegate }

  - name: dep.bootloader
    kind: ns.dependency
    version: "*"
    component: wippy/bootloader
    parameters:
      - { name: wippy.bootloader:application_host, value: app:processes }
      - { name: wippy.bootloader:env_storage, value: app:env_storage }

  - name: dep.views
    kind: ns.dependency
    version: "*"
    component: wippy/views
    parameters:
      - { name: wippy.views:api_router, value: app:api }
      - { name: wippy.views:env_storage, value: app:env_storage }

  - name: schema_change_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Schema evolution - merge, rename, removal, refusal, rebuild and migration. }
    source: file://schema_change_test.lua
    method: run
    modules: [json]
    imports:
      catalog_fixture: app:catalog_fixture
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      steps: app:steps

  - name: release_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Readiness, release, publication state and the publications feed. }
    source: file://release_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store

  - name: stock_scope
    kind: registry.entry
    meta:
      type: kickside.pim.scope
      comment: Harness scope - stock rows per location.
      table: pim_test_stock
      catalog_column: catalog_id
      product_column: product_id
      access: read
      filters:
        location: { column: location_id, type: text, ops: [eq, in] }
        available: { column: available, type: integer, ops: [gt, gte, eq] }

  - name: cost_scope
    kind: registry.entry
    meta:
      type: kickside.pim.scope
      comment: Harness scope - restricted to catalog admins.
      table: pim_test_stock
      catalog_column: catalog_id
      product_column: product_id
      access: admin
      filters:
        available: { column: available, type: integer, ops: [gt] }

  - name: ghost_scope
    kind: registry.entry
    meta:
      type: kickside.pim.scope
      comment: Harness scope - names a table that does not exist.
      table: pim_test_missing
      catalog_column: catalog_id
      product_column: product_id
      filters:
        available: { column: available, type: integer, ops: [gt] }

  - name: hostile_scope
    kind: registry.entry
    meta:
      type: kickside.pim.scope
      comment: Harness scope - a table name that is not an identifier.
      table: "pim_test_stock; DROP TABLE kickside_pim_product"
      catalog_column: catalog_id
      product_column: product_id
      filters:
        available: { column: available, type: integer, ops: [gt] }

  - name: scopes_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Declarative scopes - plugin-table filters, validation, access and missing tables. }
    source: file://scopes_test.lua
    method: run
    imports:
      test: wippy.test:test
      fixture: app:fixture
      store: kickside.pim.persist:store
      types: kickside.pim:types

  - name: actor_check
    kind: function.lua
    meta: { type: kickside.pim.check, comment: Harness check that reports the actor it ran under. }
    source: file://actor_check.lua
    method: run
    modules: [security]
    imports:
      types: kickside.pim:types

  - name: weight_check
    kind: function.lua
    meta: { type: kickside.pim.check, comment: Harness check - net weight at most config.max kg. }
    source: file://weight_check.lua
    method: run
    imports:
      types: kickside.pim:types

  - name: checks_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Requirement sets, the authored rule, channel coverage and readiness reads. }
    source: file://checks_test.lua
    method: run
    imports:
      store: kickside.pim.persist:store
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: query_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Item-table filters, keyset paging, text search and the get, explain and links views. }
    source: file://query_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app:fixture
      steps: app:steps
      types: kickside.pim:types

  - name: shelf_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      comment: Harness plugin for PIM - shelf location per catalog.
      title: Shelf
      settings: app.shelf
      config_schema:
        type: object
        properties:
          location: { type: string, minLength: 2 }
          reorder_days: { type: integer, minimum: 1 }
        required: [location]
        additionalProperties: false
      schema:
        template:
          aspects: [ { namespace: shelf, attributes: [ { code: bin, type: kickside.pim.types:identifier, index: key } ] } ]

  - name: zones_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      comment: Harness plugin whose template contributes a vocabulary and a select attribute over it.
      title: Zones
      schema:
        template:
          vocabularies: [ { code: zones } ]
          aspects: [ { namespace: placement, attributes: [ { code: zone, type: kickside.pim.types:select, vocabulary: zones, index: key } ] } ]

  - name: dynamic_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      comment: Harness plugin whose fields an admin declares in the plugin's own store; a provider resolves them per catalog.
      title: Dynamic fields
      config_schema:
        type: object
        properties:
          namespace: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        required: [namespace]
        additionalProperties: false
      settings: app.dynamic
      schema:
        provider: app:dynamic_provider

  - name: dynamic_namespace
    kind: registry.entry
    meta: { type: kickside.settings:definition, comment: Harness plugin app default aspect namespace. }
    namespace: app.dynamic
    key: namespace
    value_type: string
    default: dynamic
    title: Dynamic fields namespace
    scope: global
    editable: true
    visible: true

  - name: dynamic_provider
    kind: contract.binding
    meta:
      comment: Harness schema provider - the dynamic plugin's declared fields per catalog.
    contracts:
      - contract: kickside.pim:schema_provider
        methods:
          resolve: app:dynamic_resolve

  - name: dynamic_resolve
    kind: function.lua
    meta: { comment: Resolves the dynamic plugin's fields from its own table under the caller. }
    source: file://dynamic_fields.lua
    method: resolve
    modules: [sql, security]

  - name: offline_plugin
    kind: registry.entry
    meta:
      type: kickside.pim.plugin
      attachment: app:empty_plugin_attachment
      comment: Harness plugin whose provider is offline.
      schema:
        provider: app:offline_provider

  - name: offline_provider
    kind: contract.binding
    meta:
      comment: Harness schema provider that fails.
    contracts:
      - contract: kickside.pim:schema_provider
        methods:
          resolve: app:offline_resolve

  - name: offline_resolve
    kind: function.lua
    meta: { comment: Fails every resolve. }
    source: file://dynamic_fields.lua
    method: offline
    modules: [sql, security]

  - name: shelf_location
    kind: registry.entry
    meta: { type: kickside.settings:definition, comment: Harness plugin app default location. }
    namespace: app.shelf
    key: location
    value_type: string
    default: WH0
    title: Default shelf location
    scope: global
    editable: true
    visible: true

  - name: shelf_reorder
    kind: registry.entry
    meta: { type: kickside.settings:definition, comment: Harness plugin app default reorder period. }
    namespace: app.shelf
    key: reorder_days
    value_type: int
    default: 14
    title: Reorder days
    scope: global
    editable: true
    visible: true

  - name: other_seam_plugin
    kind: registry.entry
    meta:
      type: app.elsewhere.plugin
      comment: Harness manifest of another seam; PIM never lists it.

  - name: traits_test
    kind: function.lua
    meta: { type: test, suite: kickside_pim, timeout: 300s, comment: Agent tools over the catalog contract. }
    source: file://traits_test.lua
    method: run
    modules: [registry, json]
