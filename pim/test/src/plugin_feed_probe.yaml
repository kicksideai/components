version: "1.0"
namespace: app
entries:
  - name: feed_threads_fixture
    kind: library.lua
    modules: [json]
    source: file://feed_threads_fixture.lua
    imports:
      threads: kickside.pim.command:threads

  - name: plugin_feed_probe
    kind: library.lua
    source: file://plugin_feed_probe.lua
    modules: [json]
    imports:
      failure: kickside.pim:failure
      values: kickside.pim.domain:values
      access: kickside.pim.read:access
      feeds: kickside.pim.read:feeds
      store: app:snapshot_store_fixture
      plugins: kickside.pim.extensions:plugins
      threads: app:feed_threads_fixture
      types: kickside.pim:types

  - name: feed_head_probe
    kind: function.lua
    source: file://feed_head_probe.lua
    method: run
    imports:
      feed: app:plugin_feed_probe
      store: app:snapshot_store_fixture
      threads: app:feed_threads_fixture

  - name: snapshot_store_fixture
    kind: library.lua
    source: file://snapshot_store_fixture.lua
    modules: [funcs]
    imports:
      store: kickside.pim.persist:store
      types: kickside.pim:types
  - name: schema_snapshot_probe
    kind: function.lua
    source: file://schema_snapshot_probe.lua
    method: run
    imports:
      reader: app:snapshot_reader
      store: app:snapshot_store_fixture

  - name: snapshot_reader
    kind: library.lua
    modules: [registry]
    meta:
      comment: Product reads and item queries; every answer reports as_of.
    source: file://snapshot_reader.lua
    imports:
      failure: kickside.pim:failure
      layout: kickside.pim.persist:layout
      plugins: kickside.pim.extensions:plugins
      plugin_projections: kickside.pim.extensions:plugin_projection_state
      history: kickside.pim.persist:history
      consts: kickside.pim:consts
      store: app:snapshot_store_fixture
      access: app:snapshot_access
      select: kickside.pim.persist:select
      scopes: kickside.pim.extensions:scopes
      seams: kickside.pim.extensions:seams
      links: kickside.pim.extensions:links
      schema: kickside.pim.schema:compile
      resolve: kickside.pim.domain:resolve
      types: kickside.pim:types
      proposal_rows: kickside.pim.persist:proposal_rows
      defaults: kickside.pim.settings:defaults
      read_model: kickside.pim.persist:read_model

  - name: snapshot_access
    kind: library.lua
    meta:
      comment: Shared read discipline - READ access, the min_seq check, one stamped read snapshot.
    source: file://snapshot_access.lua
    modules: [security]
    imports:
      failure: kickside.pim:failure
      component: kickside.component:component
      store: app:snapshot_store_fixture
      types: kickside.pim:types
