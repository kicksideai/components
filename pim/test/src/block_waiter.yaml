version: '1.0'
namespace: app
entries:
  - name: block_cursor_wait
    kind: function.lua
    source: file://block_cursor_wait.lua
    method: run
    modules: [funcs]
    imports:
      probe: app:block_wait_probe
      types: kickside.pim:types
      waiter: app:block_waiter_fixture

  - name: block_wait_probe
    kind: library.lua
    source: file://block_wait_probe.lua
    modules: [time]
    imports:
      access: kickside.pim.read:access
      clock: kickside.pim:clock
      consts: kickside.pim:consts
      evaluate: kickside.pim.domain:evaluate
      limits: kickside.pim:catalog_limits
      projection_reader: kickside.core.projections.persist:reader
      read_model: kickside.pim.persist:read_model
      reader: kickside.pim.read:reader
      store: kickside.pim.persist:store
      types: kickside.pim:types
      waiters: app:block_waiter_fixture

  - name: block_waiter_fixture
    kind: library.lua
    source: file://block_waiter_fixture.lua
    imports:
      waiters: kickside.core.threads:cursor_waiters
