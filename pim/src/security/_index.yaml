  # kickside.pim.security:pim_endpoint_access
  - name: pim_endpoint_access
    kind: security.policy
    meta:
      comment: Members load the PIM view and bundle and call the catalog endpoints; the catalog ACL decides each call.
    groups: []
    policy:
      resources:
        - kickside.pim.api:list.endpoint
        - kickside.pim.api:get_catalog.endpoint
        - kickside.pim.api:create.endpoint
        - kickside.pim.api:update.endpoint
        - kickside.pim.api:get_schema.endpoint
        - kickside.pim.api:plan_schema.endpoint
        - kickside.pim.api:configure_plugin.endpoint
        - kickside.pim.api:apply_schema.endpoint
        - kickside.pim.api:get.endpoint
        - kickside.pim.api:query.endpoint
        - kickside.pim.api:list_history.endpoint
        - kickside.pim.api:apply.endpoint
        - kickside.pim.api:propose.endpoint
        - kickside.pim.api:decide.endpoint
        - kickside.pim.api:list_proposals.endpoint
        - kickside.pim.api:release.endpoint
        - kickside.pim.api:withdraw.endpoint
        - kickside.pim.api:rebuild.endpoint
        - kickside.pim.api:list_links.endpoint
        - kickside.pim.api:explain.endpoint
        - kickside.pim.api:list_changes.endpoint
        - kickside.pim.api:list_publications.endpoint
        - kickside.pim.api:get_release.endpoint
        - kickside.pim.api:list_releases.endpoint
        - kickside.pim.api:list_terms.endpoint
        - kickside.pim.api:schema_options.endpoint
      actions: access
      effect: allow

  # kickside.pim.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    default: kickside.security.groups:members
    meta:
      value_kind: security.scope
      comment: Application security group that receives the pim module policies.
    targets:
      - entry: kickside.pim.security:module_access
        path: ".groups +="
      - entry: kickside.pim.security:module_runtime
        path: ".groups +="
      - entry: kickside.pim.security:job_declarations
        path: ".groups +="
      - entry: kickside.pim.security:pim_endpoint_access
        path: ".groups +="

  # kickside.pim.security:catalog_public_meta
  - name: catalog_public_meta
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Lets PIM services write public meta on catalog components only.
    policy:
      resources: '*'
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.impl_id
          operator: eq
          value: kickside.pim.binding:catalog

  # kickside.pim.security:catalog_delete_report
  - name: catalog_delete_report
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Catalog teardown reports the deletion so the lifecycle reaper removes what the catalog owns.
    policy:
      resources: kickside.core.lifecycle:report
      actions: lifecycle.report.publish
      effect: allow

  # kickside.pim.security:rebuild_defer
  - name: rebuild_defer
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Lets the rebuild job run its batches as the catalog's execution identity.
    policy:
      resources: [kickside.pim.jobs:rebuild]
      actions: kickside.execution.defer
      effect: allow

  # kickside.pim.security:merge_defer
  - name: merge_defer
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Lets the term merge job issue merge commands as the actor who asked.
    policy:
      resources:
        - kickside.pim.jobs:term_merge
      actions: kickside.execution.defer
      effect: allow

  # kickside.pim.security:retention_db_access
  - name: retention_db_access
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Lets the PIM retention owner open the PIM database.
    groups: []
    policy:
      resources: []
      actions: [db.get]
      effect: allow

  - name: release_defer
    kind: security.policy
    meta: { private: true, service_only: true, comment: The model release job runs batches as its requesting actor. }
    policy:
      resources: kickside.pim.jobs:release_model
      actions: kickside.execution.defer
      effect: allow

  - name: tool_access
    kind: security.policy
    meta: {title: PIM tools, surface: kickside.pim, intent: tool_access}
    groups: []
    policy:
      resources: &tool_ids
      - kickside.pim.traits:pim_readonly
      - kickside.pim.traits:pim_trait
      - kickside.pim.traits:pim_admin
      - kickside.pim.traits:build
      - kickside.pim.traits:build_reads
      - kickside.pim.traits:list_catalogs
      - kickside.pim.traits:get_schema
      - kickside.pim.traits:schema_options
      - kickside.pim.traits:list_terms
      - kickside.pim.traits:query
      - kickside.pim.traits:get
      - kickside.pim.traits:explain
      - kickside.pim.traits:list_history
      - kickside.pim.traits:list_links
      - kickside.pim.traits:list_proposals
      - kickside.pim.traits:list_releases
      - kickside.pim.traits:get_release
      - kickside.pim.traits:list_publications
      - kickside.pim.traits:list_changes
      - kickside.pim.traits:apply
      - kickside.pim.traits:propose
      - kickside.pim.traits:decide
      - kickside.pim.traits:release
      - kickside.pim.traits:withdraw
      - kickside.pim.traits:create_catalog
      - kickside.pim.traits:update
      - kickside.pim.traits:plan_schema
      - kickside.pim.traits:apply_schema
      - kickside.pim.traits:configure_plugin
      - kickside.pim.traits:policy_defaults
      - kickside.pim.traits:rebuild
      actions: [registry.get, registry.find, funcs.call]
      effect: allow

  - name: platform_callbacks
    kind: security.policy
    meta: { private: true }
    groups: [wippy.security:process]
    policy:
      resources:
        - kickside.pim.persist:projection
        - kickside.pim.persist:projection_committed
        - kickside.pim.binding:delete_func
        - kickside.pim.migrations:01_catalog
        - kickside.pim.jobs:rebuild
        - kickside.pim.jobs:import
        - kickside.pim.jobs:import_batch
        - kickside.pim.jobs:plugins
        - kickside.pim.jobs:release_model
        - kickside.pim.jobs:term_merge
        - kickside.pim.extensions:plugin_batch
        - kickside.pim.jobs:rebuild_batch
        - kickside.pim.jobs:term_merge_batch
        - kickside.pim.jobs:release_model_batch
        - kickside.pim.retention:owner
      actions: [registry.get, funcs.call]
      effect: allow

  - name: job_declarations
    kind: security.policy
    meta: { private: true }
    groups: []
    policy:
      resources: [kickside.pim.jobs:import, kickside.pim.jobs:plugins, kickside.pim.jobs:rebuild, kickside.pim.jobs:term_merge, kickside.pim.jobs:release_model]
      actions: [registry.get]
      effect: allow

  - name: manifest_reader
    kind: security.scope
    meta:
      private: true
      comment: Function-local lookup of tool declarations during plugin validation.
    policies: []

  - name: manifest_metadata
    kind: security.policy
    meta: { private: true }
    groups: [kickside.pim.security:manifest_reader]
    policy:
      resources: *tool_ids
      actions: [registry.get, registry.find]
      effect: allow

  - name: plugin_defer
    kind: security.policy
    policy:
      resources: [kickside.pim.jobs:plugins]
      actions: [kickside.execution.defer]
      effect: allow

  - name: import_defer
    kind: security.policy
    meta: {private: true,service_only: true}
    policy:
      resources: [kickside.pim.jobs:import]
      actions: [kickside.execution.defer]
      effect: allow

  - name: tools_catalog
    kind: security.policy
    meta: {private: true}
    groups: [kickside.pim.security:manifest_reader]
    policy:
      resources: [kickside.agents:tools, kickside.agents.registry:tools_registry, kickside.agents.registry:t_find]
      actions: [registry.get, registry.find, contract.get, contract.open, contract.call, contract.implementations, contract.security, funcs.call, funcs.security]
      effect: allow

  - name: subject_retirement
    kind: security.policy
    meta:
      private: true
      service_only: true
      comment: Only the retention owner ends permanently purged product subject lifetimes.
    policy:
      resources: pim.catalog
      actions: threads.subjects.retire
      effect: allow
