version: "1.0"
namespace: kickside.pim.security

# Module access. Administrators select the public module_access policy for a
# group in System -> Security; the platform Members group composes it by
# default. Policies list exact entry IDs; endpoint names grant nothing. The
# user_security_scope requirement binds the host group at install time.

entries:
  # kickside.pim.security:module_access
  - name: module_access
    kind: security.policy
    meta:
      title: Kickside PIM
      surface: kickside.pim
      intent: module_access
      includes:
        - kickside.pim.security:module_runtime
        - kickside.pim.security:job_declarations
        - kickside.pim.security:pim_endpoint_access
    groups: []
    policy:
      resources:
        - kickside.pim:catalog
        - kickside.pim:family_check
