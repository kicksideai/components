version: "1.0"
namespace: kickside.pim.traits
entries:
  - name: list_catalogs
    kind: function.lua
    meta:
      type: tool
      title: PIMCatalogs
      llm_alias: PIMCatalogs
      llm_description: 'List catalogs readable by the authenticated caller; requires catalog READ for each returned catalog. Returns catalog ids, titles and independent access grants.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type":"object","properties":{"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum catalogs returned, from 1 to 100; omit for 50."},"after":{"type":"integer","minimum":0,"description":"Discovery offset returned by PIMCatalogs; reuse it with the same filters or omit for the first page."},"text":{"type":"string","description":"Case-insensitive substring of the catalog id, implementation id, or public metadata such as the title."},"admin_only":{"type":"boolean","description":"True to require both READ and ADMIN on each returned catalog."}},"additionalProperties":false}'
      output_schema: '{"type": "object", "required": ["catalogs", "success"], "properties": {"catalogs": {"type": "array", "items": {"type": "object", "required": ["catalog_id", "title", "access"], "properties": {"catalog_id": {"type": "string"}, "title": {"type": "string"}, "product_count": {"type": "integer"}, "item_count": {"type": "integer"}, "generation": {"type": "integer"}, "status": {"type": "string"}, "access": {"type": "object", "required": ["read", "write", "admin"], "properties": {"read": {"type": "boolean"}, "write": {"type": "boolean"}, "admin": {"type": "boolean"}}, "additionalProperties": false}}}, "description": "Caller-readable catalogs with ids, titles and independent access grants."}, "after": {"type": "integer", "description": "Next discovery offset; omitted at the end."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: list_catalogs
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: get_schema
    kind: function.lua
    meta:
      type: tool
      title: PIMSchemaGet
      llm_alias: PIMSchemaGet
      llm_description: 'Read a current or historical catalog schema with compiled attributes, families, channels and plugin declarations; requires catalog READ and returns the schema generation and declaration. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "generation": {"type": "integer", "description": "Historical schema generation to read; omit for the current schema."}}, "additionalProperties": false}'
      output_schema: '{"type":"object","required":["schema_generation","declaration","attributes","families","access","success"],"properties":{"schema_generation":{"type":"integer","description":"Requested schema generation represented by the declaration and compiled fields."},"declaration":{"type":"object","description":"Effective schema declaration stored for this generation."},"attributes":{"type":"object","description":"Compiled attribute definitions keyed by attribute code."},"families":{"type":"object","description":"Compiled family definitions keyed by family code."},"channels":{"type":"object","description":"Compiled publication channels keyed by channel code."},"dimensions":{"type":"array","items":{"type":"object"},"description":"Declared dimensions and their valid members and resolution chains."},"vocabularies":{"type":"object","description":"Vocabulary definitions keyed by vocabulary code."},"sources":{"type":"object","description":"Source definitions keyed by source id, including write and ordering rules."},"scopes":{"type":"object","description":"Available query scope definitions."},"plugins":{"type":"array","description":"Installed and active plugins with configuration, lifecycle and projection progress.","items":{"type":"object","required":["plugin","installed","active","requires","tools","lifecycle","projections"],"properties":{"plugin":{"type":"string"},"interface_version":{"type":"integer","minimum":1,"description":"Host interface version accepted for this plugin."},"title":{"type":"string"},"description":{"type":"string"},"icon":{"type":"string"},"installed":{"type":"boolean"},"active":{"type":"boolean"},"attachment_id":{"type":"string"},"config":{"type":"object"},"requires":{"type":"array","items":{"type":"string"}},"tools":{"type":"array","items":{"type":"string"}},"lifecycle":{"type":"object"},"projections":{"type":"object"},"problem":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string"},"field":{"type":"string"}}}}}},"as_of":{"type":"integer","description":"Applied catalog sequence represented by this answer."},"generation":{"type":"integer","description":"Schema generation associated with this result."},"rebuilding":{"type":"boolean","description":"Whether the catalog has a materialized view rebuild pending."},"access":{"type":"object","required":["read","write","admin"],"properties":{"read":{"type":"boolean"},"write":{"type":"boolean"},"admin":{"type":"boolean"}},"additionalProperties":false,"description":"Independent read, write and admin grants of the caller."},"success":{"type":"boolean","const":true,"description":"True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: get_schema
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: schema_options
    kind: function.lua
    meta:
      type: tool
      title: PIMSchemaOptions
      llm_alias: PIMSchemaOptions
      llm_description: 'List installed attribute types, scopes, plugins with their declared tools, and readable link kinds before planning a schema; requires catalog READ and returns configuration schemas and available options. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}}, "additionalProperties": false}'
      output_schema: '{"type":"object","required":["types","scopes","plugins","link_kinds","success"],"properties":{"types":{"type":"array","items":{"type":"object","required":["id","form","indexes"],"properties":{"id":{"type":"string"},"title":{"type":"string"},"form":{"type":"string"},"indexes":{"type":"array","items":{"type":"string"}},"target":{"type":"string"},"config_schema":{"type":"object"},"problem":{"type":"string"}}},"description":"Installed attribute types and their configuration schemas."},"scopes":{"type":"array","items":{"type":"object","required":["id","access","filters"],"properties":{"id":{"type":"string"},"title":{"type":"string"},"access":{"type":"string"},"filters":{"type":"object"},"problem":{"type":"string"}}},"description":"Available query scope definitions."},"plugins":{"type":"array","description":"Installed and active plugins with configuration, lifecycle and projection progress.","items":{"type":"object","required":["plugin","installed","active","requires","tools","lifecycle","projections","config_schema"],"properties":{"plugin":{"type":"string"},"interface_version":{"type":"integer","minimum":1,"description":"Host interface version accepted for this plugin."},"title":{"type":"string"},"description":{"type":"string"},"icon":{"type":"string"},"installed":{"type":"boolean"},"active":{"type":"boolean"},"attachment_id":{"type":"string"},"config":{"type":"object"},"requires":{"type":"array","items":{"type":"string"}},"tools":{"type":"array","items":{"type":"string"}},"lifecycle":{"type":"object"},"projections":{"type":"object"},"problem":{"type":"object","required":["code","message"],"properties":{"code":{"type":"string"},"message":{"type":"string"},"field":{"type":"string"}}},"config_schema":{"type":"object"}}}},"link_kinds":{"type":"array","items":{"type":"object","required":["kind","binding"],"properties":{"kind":{"type":"string"},"binding":{"type":"string"},"title":{"type":"string"}}},"description":"Installed readable link kinds and their identity descriptions."},"success":{"type":"boolean","const":true,"description":"True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: schema_options
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: list_terms
    kind: function.lua
    meta:
      type: tool
      title: PIMTerms
      llm_alias: PIMTerms
      llm_description: 'List vocabulary terms by code with optional parent, retirement and paging filters; requires catalog READ and returns terms and the continuation cursor. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "required": ["vocabulary"], "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "vocabulary": {"type": "string", "description": "Vocabulary code declared by PIMSchemaGet; list its term codes with PIMTerms."}, "parent": {"type": "string", "description": "Parent term code in this vocabulary from PIMTerms; omit to preserve it, or use an empty string for no parent."}, "retired": {"type": "boolean", "description": "True for retired terms or false for live terms; omit to include both."}, "limit": {"type": "integer", "description": "Maximum rows returned, from 1 to 200; omit for 200."}, "after": {"type": "string", "description": "Continuation returned by the same listing tool; pass it unchanged with the same filters, or omit for the first page."}}, "additionalProperties": false}'
      output_schema: '{"type": "object", "required": ["terms", "success"], "properties": {"terms": {"type": "array", "items": {"type": "object", "required": ["code", "labels", "retired"], "properties": {"code": {"type": "string"}, "labels": {"type": "object"}, "parent": {"type": "string"}, "retired": {"type": "boolean"}}}, "description": "Vocabulary terms with codes, labels, parent and retirement state."}, "next": {"type": "string", "description": "Continuation to pass unchanged to this tool for the next page."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: list_terms
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: query
    kind: function.lua
    meta:
      type: tool
      title: PIMQuery
      llm_alias: PIMQuery
      llm_description: 'Find products using text, fields and scopes declared by PIMSchemaGet; requires catalog READ and returns a page of items, optional resolved columns and count information. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type":"object","properties":{"catalog_id":{"type":"string","description":"Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."},"where":{"$ref":"#filterNode","description":"Filter tree of and, or, not or {field, ctx, op, value}; omit to match all, with at most 6 levels, 64 leaves and 500 values."},"text":{"type":"string","description":"Text matching a sku prefix or searchable attribute words; omit or use an empty string to skip text filtering."},"family":{"type":"string","description":"Family code declared by PIMSchemaGet; omit on creation for generic or the parent family."},"status":{"type":"string","enum":["active","draft","archived"],"description":"Product lifecycle status to match; omit to include every status."},"ready":{"type":"object","required":["set","value"],"properties":{"set":{"type":"string","description":"Requirement set id declared by PIMSchemaGet for the family being queried."},"value":{"type":"boolean","description":"True to match ready products or false to match products with unmet requirements."}},"additionalProperties":false,"description":"Requirement set and readiness boolean to filter by; omit to include both ready and unready items."},"sort":{"type":"object","required":["field"],"additionalProperties":false,"properties":{"field":{"type":"string","description":"Indexed attribute code from PIMSchemaGet; use ctx for a contextual field."},"ctx":{"type":"object","additionalProperties":{"type":"string"},"description":"Dimension-to-member map from PIMSchemaGet for every dimension in the attribute scope; omit only for attributes without dimensions."},"dir":{"type":"string","enum":["asc","desc"],"description":"Ascending or descending field order with product id as the tie breaker; omit for asc."}},"description":"Indexed single-valued field and direction; omit to order by product id."},"count":{"type":"boolean","description":"Return a count capped at 10000 matches within 200000 scanned rows, with estimated when capped; omit to skip counting."},"limit":{"type":"integer","description":"Maximum rows returned, from 1 to 200; omit for 50."},"after":{"type":"object","required":["id"],"additionalProperties":false,"properties":{"id":{"type":"string","description":"Product id copied unchanged from the previous PIMQuery.after cursor."},"v":{"type":["string","integer"],"description":"Stored sort value copied unchanged from PIMQuery.after; omit only when the returned cursor omits it."}},"description":"Continuation returned by the same listing tool; pass it unchanged with the same filters, or omit for the first page."},"published":{"type":"object","properties":{"channel":{"type":"string","description":"Active publication channel from the current schema. Omit to match any published channel."}},"additionalProperties":false,"description":"Filter to products published in channel, or in any channel if channel is omitted; omit to include unpublished products."},"parent":{"type":"object","properties":{"id":{"type":"string","description":"Product id returned by PIMGet or PIMQuery; takes precedence over sku."},"sku":{"type":"string","description":"Live product sku, at most 128 bytes for creation; ignored when id is supplied."}},"additionalProperties":false,"description":"Product reference {id} or {sku}; id takes precedence, and PIMGet resolves a sku to its product_id.","anyOf":[{"required":["id"]},{"required":["sku"]}]},"root":{"type":"object","properties":{"id":{"type":"string","description":"Product id returned by PIMGet or PIMQuery; takes precedence over sku."},"sku":{"type":"string","description":"Live product sku, at most 128 bytes for creation; ignored when id is supplied."}},"additionalProperties":false,"description":"Product reference {id} or {sku}; id takes precedence, and PIMGet resolves a sku to its product_id. Must name a root product; omit to include every root.","anyOf":[{"required":["id"]},{"required":["sku"]}]},"scopes":{"type":"array","description":"Plugin scope filters listed by PIMSchemaOptions and adopted in PIMSchemaGet; omit for no plugin filters.","items":{"type":"object","required":["id"],"properties":{"id":{"type":"string","description":"Scope registry id listed by PIMSchemaOptions and adopted by this catalog in PIMSchemaGet."},"where":{"type":"object","description":"Filter names and {operator: value} objects declared by this scope in PIMSchemaOptions; omit for scope membership only."}},"additionalProperties":false}},"min_seq":{"type":"integer","description":"Minimum applied catalog sequence required for this read; omit for the current projection, or receive projection_behind if it lags."},"columns":{"type":"array","items":{"type":"string"},"description":"Attribute codes from PIMSchemaGet to resolve per item, at most 12; omit to return product summaries only."},"context":{"type":"object","additionalProperties":{"type":"string"},"description":"Dimension-to-member map from PIMSchemaGet, such as {\"locale\":\"en\"}; omit dimensions to resolve their wildcard values."}},"additionalProperties":false,"definitions":{"filterNode":{"$anchor":"filterNode","oneOf":[{"type":"object","properties":{"field":{"type":"string","description":"Indexed attribute code from PIMSchemaGet; use ctx for a contextual field."},"ctx":{"type":"object","additionalProperties":{"type":"string"},"description":"Dimension-to-member map from PIMSchemaGet for every dimension in the attribute scope; omit only for attributes without dimensions."},"op":{"type":"string","enum":["eq","neq","in","nin","is_null","lt","lte","gt","gte","between","contains","starts_with","has"],"description":"Comparison supported by the indexed field; has is for sets, ranges for ordered fields, and text operators for single text fields."},"value":{"description":"Operand matching the field type; in and nin take lists, between takes [low, high], is_null takes a boolean, and other operators take one value."}},"required":["field","op","value"],"additionalProperties":false},{"type":"object","properties":{"and":{"type":"array","minItems":1,"items":{"$ref":"#filterNode"},"description":"Non-empty list of filter nodes that must all match, within the tree limits."}},"required":["and"],"additionalProperties":false},{"type":"object","properties":{"or":{"type":"array","minItems":1,"items":{"$ref":"#filterNode"},"description":"Non-empty list of filter nodes of which at least one must match, within the tree limits."}},"required":["or"],"additionalProperties":false},{"type":"object","properties":{"not":{"$ref":"#filterNode","description":"Filter node whose match is inverted, including empty values, within the tree limits."}},"required":["not"],"additionalProperties":false}]}}}'
      output_schema: '{"type": "object", "required": ["items", "success"], "properties": {"items": {"type": "array", "items": {"type": "object", "required": ["product_id", "sku", "version", "status", "family"], "properties": {"product_id": {"type": "string"}, "sku": {"type": "string"}, "version": {"type": "integer"}, "status": {"type": "string"}, "family": {"type": "string"}, "values": {"type": "object"}}}, "description": "Page of matching items."}, "after": {"type": "object", "description": "Continuation to pass unchanged to this tool for the next page."}, "total": {"type": "integer", "description": "Matching row count; read estimated to determine whether it is capped."}, "estimated": {"type": "boolean", "description": "Whether the returned total is capped by counting or scan limits."}, "incomplete": {"type": "boolean", "description": "Whether the scan limit prevents this page from covering all matches."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: query
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: get
    kind: function.lua
    meta:
      type: tool
      title: PIMGet
      llm_alias: PIMGet
      llm_description: 'Read a product by sku or id from PIMQuery with contextual values, readiness and publications; requires catalog READ and returns the product and its caller-visible attribute values. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "product": {"type": "object", "properties": {"id": {"type": "string", "description": "Product id returned by PIMGet or PIMQuery; takes precedence over sku."}, "sku": {"type": "string", "description": "Live product sku, at most 128 bytes for creation; ignored when id is supplied."}}, "additionalProperties": false, "description": "Product reference {id} or {sku}; id takes precedence, and PIMGet resolves a sku to its product_id.", "anyOf": [{"required": ["id"]}, {"required": ["sku"]}]}, "context": {"type": "object", "additionalProperties": {"type": "string"}, "description": "Dimension-to-member map from PIMSchemaGet, such as {\"locale\":\"en\"}; omit dimensions to resolve their wildcard values."}, "min_seq": {"type": "integer", "description": "Minimum applied catalog sequence required for this read; omit for the current projection, or receive projection_behind if it lags."}}, "required": ["product"], "additionalProperties": false}'
      output_schema: '{"type": "object", "required": ["product", "values", "publications", "success"], "properties": {"product": {"type": "object", "required": ["product_id", "sku", "family", "root_id", "level", "is_item", "version", "status"], "properties": {"product_id": {"type": "string"}, "sku": {"type": "string"}, "family": {"type": "string"}, "parent_id": {"type": "string"}, "root_id": {"type": "string"}, "level": {"type": "integer"}, "is_item": {"type": "boolean"}, "version": {"type": "integer"}, "status": {"type": "string"}}, "description": "Product identity, hierarchy, status and current version."}, "values": {"type": "object", "description": "Resolved caller-visible attribute values keyed by attribute code."}, "readiness": {"type": "object", "description": "Requirement and channel readiness findings."}, "release_id": {"type": "string", "description": "Most recent release id for this product; consult publications for current channel states."}, "publications": {"type": "array", "items": {"type": "object"}, "description": "Publication channel, release id and state for this product."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: get
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: explain
    kind: function.lua
    meta:
      type: tool
      title: PIMExplain
      llm_alias: PIMExplain
      llm_description: 'Explain a product from PIMGet and an attribute from PIMSchemaGet, including resolution candidates and readiness findings; requires catalog READ and returns the caller-visible explanation. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "product": {"type": "object", "properties": {"id": {"type": "string", "description": "Product id returned by PIMGet or PIMQuery; takes precedence over sku."}, "sku": {"type": "string", "description": "Live product sku, at most 128 bytes for creation; ignored when id is supplied."}}, "additionalProperties": false, "description": "Product reference {id} or {sku}; id takes precedence, and PIMGet resolves a sku to its product_id.", "anyOf": [{"required": ["id"]}, {"required": ["sku"]}]}, "attr": {"type": "string", "description": "Attribute code declared by PIMSchemaGet, such as core.name."}, "context": {"type": "object", "additionalProperties": {"type": "string"}, "description": "Dimension-to-member map from PIMSchemaGet, such as {\"locale\":\"en\"}; omit dimensions to resolve their wildcard values."}}, "required": ["product", "attr"], "additionalProperties": false}'
      output_schema: '{"type": "object", "required": ["attribute", "candidates", "resolution", "success"], "properties": {"attribute": {"type": "string", "description": "Public definition of the explained attribute."}, "candidates": {"type": "array", "items": {"type": "string"}, "description": "Caller-visible candidate values considered during resolution."}, "resolution": {"type": "object", "description": "Resolved value, state, source, context and owning product."}, "findings": {"type": "object", "description": "Readiness findings for the explained attribute."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: explain
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: list_history
    kind: function.lua
    meta:
      type: tool
      title: PIMHistory
      llm_alias: PIMHistory
      llm_description: 'Read catalog change history newest first, optionally for a product from PIMGet; requires catalog READ and returns caller-visible entries and a continuation cursor. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "product": {"type": "object", "properties": {"id": {"type": "string", "description": "Product id returned by PIMGet or PIMQuery; takes precedence over sku."}, "sku": {"type": "string", "description": "Live product sku, at most 128 bytes for creation; ignored when id is supplied."}}, "additionalProperties": false, "description": "Product reference {id} or {sku}; id takes precedence, and PIMGet resolves a sku to its product_id.", "anyOf": [{"required": ["id"]}, {"required": ["sku"]}]}, "before": {"type": "string", "description": "Continuation returned by the same listing tool; pass it unchanged with the same filters, or omit for the first page."}, "limit": {"type": "integer", "description": "Maximum rows returned, from 1 to 200; omit for 50."}, "min_seq": {"type": "integer", "description": "Minimum applied catalog sequence required for this read; omit for the current projection, or receive projection_behind if it lags."}}, "additionalProperties": false}'
      output_schema: '{"type": "object", "required": ["entries", "success"], "properties": {"entries": {"type": "array", "items": {"type": "object", "required": ["seq", "n", "subject", "kind", "actor", "at"], "properties": {"seq": {"type": "integer"}, "n": {"type": "integer"}, "subject": {"type": "string"}, "sku": {"type": "string"}, "kind": {"type": "string"}, "attribute_id": {"type": "integer"}, "attribute": {"type": "string"}, "ctx": {"type": "string"}, "actor": {"type": "string"}, "source": {"type": "string"}, "at": {"type": "string"}}}, "description": "Caller-visible change history entries, newest first."}, "next": {"type": "string", "description": "Continuation to pass unchanged to this tool for the next page."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: list_history
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: list_links
    kind: function.lua
    meta:
      type: tool
      title: PIMLinks
      llm_alias: PIMLinks
      llm_description: 'Find live products referencing a target in a link kind from PIMSchemaOptions; requires catalog READ and returns references and a continuation cursor. Catalog id comes from the call, then trait context when omitted.'
      mcp: { required_scopes: [state.read] }
      input_schema: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "kind": {"type": "string", "description": "Link kind id listed by PIMSchemaOptions; use the kind that owns the target."}, "target": {"type": "string", "description": "Target id in the identity format defined by the link kind from PIMSchemaOptions."}, "after": {"type": "object", "required": ["product_id", "attribute_id", "ctx", "path"], "additionalProperties": false, "properties": {"product_id": {"type": "string", "description": "Product id copied unchanged from the previous page continuation."}, "attribute_id": {"type": "integer", "description": "Internal attribute number copied unchanged from the previous page continuation."}, "ctx": {"type": "string", "description": "Canonical context string copied unchanged from the previous page continuation."}, "path": {"type": "string", "description": "Reference path copied unchanged from the previous page continuation."}}, "description": "Continuation returned by the same listing tool; pass it unchanged with the same filters, or omit for the first page."}, "limit": {"type": "integer", "description": "Maximum rows returned, from 1 to 200; omit for 50."}}, "required": ["kind", "target"], "additionalProperties": false}'
      output_schema: '{"type": "object", "required": ["items", "success"], "properties": {"items": {"type": "array", "items": {"type": "object", "required": ["product_id", "sku", "attribute_id", "ctx", "path"], "properties": {"product_id": {"type": "string"}, "sku": {"type": "string"}, "attribute": {"type": "string"}, "attribute_id": {"type": "integer"}, "ctx": {"type": "string"}, "path": {"type": "string"}}}, "description": "Page of matching items."}, "next": {"type": "object", "description": "Continuation to pass unchanged to this tool for the next page."}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "success": {"type": "boolean", "const": true, "description": "True when the contract call completes successfully."}}}'
    source: file://pim_tool.lua
    method: list_links
    modules: [ctx]
    imports: { catalog_client: kickside.pim:client }

  - name: list_proposals
    kind: function.lua
    meta:
      type: tool
      title: PIMProposals
      llm_alias: PIMProposals
