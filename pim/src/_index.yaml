te this aspect.","items":{"type":"string"}}},"additionalProperties":false},"attributes":{"type":"array","description":"Attribute declarations keyed by local code or existing id.","items":{"type":"object","description":"Attribute within an aspect; its full coordinate is namespace.code.","properties":{"code":{"type":"string","description":"Local attribute code, without the aspect namespace."},"id":{"type":"integer","description":"Existing attribute id from PIMSchemaGet; supply it to rename the attribute while retaining its identity."},"type":{"type":"string","description":"Installed attribute type id from PIMSchemaOptions; required for a new attribute."},"scope":{"type":"array","description":"Ordered dimension names for contextual values; omit for values without dimensions.","items":{"type":"string"}},"cardinality":{"type":"string","description":"one, set or list; omit for one."},"index":{"type":"string","description":"Index kind supported by the type from PIMSchemaOptions; omit for none."},"index_contexts":{"type":"array","description":"Exact dimension-to-member coordinates to index for contextual attributes.","items":{"type":"object","description":"One complete attribute context.","additionalProperties":{"type":"string"}}},"unique":{"type":"boolean","description":"Whether non-null values must be unique across products."},"vocabulary":{"type":"string","description":"Vocabulary code used by a select attribute."},"default":{"description":"Default value in the attribute type; the compiler validates its meaning."},"config":{"type":"object","description":"Type-specific configuration validated against the type config_schema from PIMSchemaOptions."},"width":{"type":"string","description":"Suggested field width: full, half, third or quarter."}},"additionalProperties":false,"required":["code"]}}},"additionalProperties":false,"required":["namespace"]}},"families":{"type":"array","description":"Product families keyed by code.","items":{"type":"object","description":"One family 