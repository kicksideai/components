version: "1.0"
namespace: kickside.pim

entries:
  # kickside.pim:definition
  - name: definition
    kind: ns.definition
    meta:
      title: Kickside PIM
      description: Product information management on Kickside threads - typed contextual product values, variants, schema evolution and releases.

  - name: dep.kickside.component
    version: "*"
    kind: ns.dependency
    meta:
      comment: Catalog components, ACL checks and deletion.
    component: kickside/component

  - name: dep.kickside.core
    version: ">=0.3.22"
    kind: ns.dependency
    meta:
      comment: Catalog threads, subjects, projections, retention and Unicode case folding.
    component: kickside/core

  - name: dep.kickside.jobs
    version: ">=0.1.83"
    kind: ns.dependency
    meta:
      comment: Rebuild jobs and projection cancellation notifications used by Core 0.3.22.
    component: kickside/jobs

  - name: dep.kickside.contract
    version: "*"
    kind: ns.dependency
    meta:
      comment: Shared component and deletable contracts.
    component: kickside/contract

  - name: dep.kickside.execution
    version: "*"
    kind: ns.dependency
    meta:
      comment: Resolves the catalog execution identity the rebuild job runs under.
    component: kickside/execution

  - name: dep.kickside.settings
    version: "*"
    kind: ns.dependency
    meta:
      comment: Deployment defaults for audit, trash and tombstone policy.
    component: kickside/settings

  - name: dep.wippy.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Migration framework for the fixed PIM tables.
    component: wippy/migration

  - name: dep.kickside.agents
    version: "*"
    kind: ns.dependency
    component: kickside/agents
    meta: {comment: Normalized tool descriptors for contributed plugin tools.}

  # ─── Dependency interface (ns.requirement) ───────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      value_kind: db.sql
      comment: Database for PIM tables; must be the Core database so projection folds and jobs share transactions.
    targets:
      - entry: kickside.pim.migrations:01_catalog
        path: .meta.target_db
      - entry: kickside.pim.persist:config
        path: .meta.db_id
      - entry: kickside.pim.security:retention_db_access
        path: .policy.resources

  - name: api_router
    kind: ns.requirement
    meta:
      value_kind: http.router
      comment: Authenticated HTTP router the PIM endpoints attach to. Must run token_auth and endpoint_firewall.
    targets:
      - entry: kickside.pim.api:list.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_catalog.endpoint
        path: .meta.router
      - entry: kickside.pim.api:create.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:plan_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:configure_plugin.endpoint
        path: .meta.router
      - entry: kickside.pim.api:apply_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get.endpoint
        path: .meta.router
      - entry: kickside.pim.api:query.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_history.endpoint
        path: .meta.router
      - entry: kickside.pim.api:apply.endpoint
        path: .meta.router
      - entry: kickside.pim.api:propose.endpoint
        path: .meta.router
      - entry: kickside.pim.api:decide.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_proposals.endpoint
        path: .meta.router
      - entry: kickside.pim.api:release.endpoint
        path: .meta.router
      - entry: kickside.pim.api:withdraw.endpoint
        path: .meta.router
      - entry: kickside.pim.api:rebuild.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_links.endpoint
        path: .meta.router
      - entry: kickside.pim.api:explain.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_changes.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_publications.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_release.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_releases.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_terms.endpoint
        path: .meta.router
      - entry: kickside.pim.api:schema_options.endpoint
        path: .meta.router

  - name: catalog_event_retention_days
    kind: ns.requirement
    default: 90
    meta:
      comment: Catalog event retention window in days; change history and projected state outlive it.
    targets:
      - entry: kickside.pim.binding:catalog
        path: .meta.retention.event_days

  - name: requests
    kind: library.lua
    meta:
      comment: Parses catalog requests against their contract method's input schema before the method acts.
    source: file://requests.lua
    modules: [contract, json, registry]
    imports:
      trim_text: kickside.pim:text
      shape: kickside.pim:shape
      types: kickside.pim:types

  - name: types
    kind: library.lua
    meta:
      comment: Shared PIM types - values, declarations, compiled model, rows, events and requests.
    source: file://types.lua
    modules: [sql]
    imports:

  - name: consts
    kind: library.lua
    meta:
      comment: Stable PIM identifiers, event types and limits.
    source: file://consts.lua

  - name: term_line
    kind: library.lua
    source: file://term_line.lua
    modules: [json]
    imports:
      failure: kickside.pim:failure
      types: kickside.pim:types

  - name: data_error
    kind: library.lua
    source: file://data_error.lua
    imports:
      failure: kickside.pim:failure

  - name: client
    kind: library.lua
    source: file://client.lua
    modules: [contract, security]
    imports:
      failure: kickside.pim:failure

  - name: failure
    kind: library.lua
    meta:
      comment: The native error PIM raises most.
    source: file://failure.lua
    imports:
      error_envelope: kickside.contract:error_envelope

  - name: clock
    kind: library.lua
    meta:
      comment: Deadlines and canonical RFC3339 UTC timestamps.
    source: file://clock.lua
    modules: [time]

  - name: narrow
    kind: library.lua
    meta:
      comment: Narrowing of values read from SQL rows and contract results.
    source: file://narrow.lua

  - name: shape
    kind: library.lua
    meta:
      comment: Tolerant JSON schemas - validate decoded Lua values where an empty table stands for an empty list.
    source: file://shape.lua
    modules: [json]
    imports:
      consts: kickside.pim:consts
      types: kickside.pim:types

  # ─── Plugin schema provider contract ─────────────────────────────────
  - name: schema_provider
    kind: contract.definition
    meta:
      title: Plugin schema provider
      comment: Answers the schema fragment a plugin contributes to one catalog. PIM calls it as the caller when a catalog's admin names the plugin, stores the answer as the catalog's own data and never calls it while folding events.
    methods:
      - name: resolve
        description: "Resolve the plugin's schema fragment for one catalog: the fragment in the declaration vocabulary and an optional version the provider uses to describe it. current is the copy the catalog holds, when it holds one."
        input_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["catalog_id", "plugin", "config"], "properties": {"catalog_id": {"type": "string"}, "plugin": {"type": "string"}, "config": {"type": "object"}, "current": {"type": "object", "required": ["fragment", "digest"], "properties": {"fragment": {"type": "object"}, "version": {"type": "string"}, "digest": {"type": "string"}}}}, "additionalProperties": false}
        output_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["fragment"], "properties": {"fragment": {"type": "object"}, "version": {"type": "string"}}, "additionalProperties": false}

  # ─── Catalog service contract ───────────────────────────────────────
  - name: catalog
    kind: contract.definition
    meta:
      title: PIM catalog
      comment: The catalog service - schema, products, reads, proposals and releases. Every method runs under the caller's identity.
    methods:
      - name: create
        description: "Create a catalog for the caller. Idempotent per caller and key; establishes the first schema generation, empty when declaration is omitted."
        input_schemas:
          - format: application/schema+json
            definition: '{"type":"object","properties":{"idempotency_key":{"type":"string","description":"Caller-scoped non-empty request key, trimmed to at most 255 bytes; reuse only for the same catalog creation."},"title":{"type":"string","description":"Catalog display title; omit or use a blank title for Catalog."},"parent_id":{"type":"string","description":"Parent component id for the new catalog; omit to create a catalog without a parent."},"declaration":{"type":"object","description":"Schema declaration using PIMSchemaOptions; named entries replace, omissions stay and remove destroys. Runtime compilation validates meaning.","properties":{"dimensions":{"type":"array","description":"Context dimensions keyed by name.","items":{"type":"object","description":"One dimension and its members.","properties":{"name":{"type":"string","description":"Dimension name used in attribute scopes and context maps."},"members":{"type":"array","description":"Allowed member names.","items":{"type":"string"}},"fallback":{"type":"object","description":"Fallback member chains keyed by member.","additionalProperties":{"type":"array","description":"Ordered fallback members.","items":{"type":"string"}}}},"additionalProperties":false,"required":["name","members"]}},"vocabularies":{"type":"array","description":"Term vocabularies keyed by code; edit terms with PIMApply.","items":{"type":"object","description":"One vocabulary.","properties":{"code":{"type":"string","description":"Vocabulary code referenced by select attributes."},"hierarchical":{"type":"boolean","description":"Whether terms may have parents."},"semantic":{"type":"boolean","description":"Whether terms carry semantic identity."}},"additionalProperties":false,"required":["code"]}},"aspects":{"type":"array","description":"Attribute groups keyed by namespace; repeated aspects merge their named attributes.","items":{"type":"object","description":"One attribute namespace.","properties":{"namespace":{"type":"string","description":"Aspect namespace; combine with local code as namespace.code."},"write":{"type":"object","description":"Restrict source writes for this aspect.","properties":{"sources":{"type":"array","description":"Source ids allowed to write this aspect.","items":{"type":"string"}}},"additionalProperties":false},"attributes":{"type":"array","description":"Attribute declarations keyed by local code or existing id.","items":{"type":"object","description":"Attribute within an aspect; its full coordinate is namespace.code.","properties":{"code":{"type":"string","description":"Local attribute code, without the aspect namespace."},"id":{"type":"integer","description":"Existing attribute id from PIMSchemaGet; supply it to rename the attribute while retaining its identity."},"type":{"type":"string","description":"Installed attribute type id from PIMSchemaOptions; required for a new attribute."},"scope":{"type":"array","description":"Ordered dimension names for contextual values; omit for values without dimensions.","items":{"type":"string"}},"cardinality":{"type":"string","description":"one, set or list; omit for one."},"index":{"type":"string","description":"Index kind supported by the type from PIMSchemaOptions; omit for none."},"index_contexts":{"type":"array","description":"Exact dimension-to-member coordinates to index for contextual attributes.","items":{"type":"object","description":"One complete attribute context.","additionalProperties":{"type":"string"}}},"unique":{"type":"boolean","description":"Whether non-null values must be unique across products."},"vocabulary":{"type":"string","description":"Vocabulary code used by a select attribute."},"default":{"description":"Default value in the attribute type; the compiler validates its meaning."},"config":{"type":"object","description":"Type-specific configuration validated against the type config_schema from PIMSchemaOptions."},"width":{"type":"string","description":"Suggested field width: full, half, third or quarter."}},"additionalProperties":false,"required":["code"]}}},"additionalProperties":false,"required":["namespace"]}},"families":{"type":"array","description":"Product families keyed by code.","items":{"type":"object","description":"One family and its variant ownership and readiness rules.","properties":{"code":{"type":"string","description":"Family code selected by product creation."},"aspects":{"type":"array","description":"Aspect namespaces included in the family.","items":{"type":"string"}},"variation":{"type":"array","description":"Variant levels in parent-to-child order.","items":{"type":"object","description":"One variation level.","properties":{"axes":{"type":"array","description":"Full attribute codes that distinguish variants at this level.","items":{"type":"string"}},"own":{"type":"array","description":"Full attribute codes authored at this level.","items":{"type":"string"}}},"additionalProperties":false}},"requirements":{"type":"array","description":"Readiness sets keyed by id.","items":{"type":"object","description":"One readiness set.","properties":{"id":{"type":"string","description":"Requirement set id referenced by channels and readiness queries."},"context":{"type":"object","description":"Dimension-to-member coordinates used to resolve the required attributes.","additionalProperties":{"type":"string"}},"require":{"type":"array","description":"Full attribute codes that must resolve to values.","items":{"type":"string"}},"authored":{"type":"array","description":"Full attribute codes that must have explicitly authored values.","items":{"type":"string"}}},"additionalProperties":false,"required":["id"]}},"checks":{"type":"array","description":"Installed check functions used by this family.","items":{"type":"object","description":"One check declaration.","properties":{"check":{"type":"string","description":"Registry check function id."},"reads":{"type":"array","description":"Full attribute codes read by the check.","items":{"type":"string"}},"cost":{"type":"string","description":"Check cost, interactive or release; omit for interactive."},"config":{"type":"object","description":"Check-specific configuration validated by the check."},"enforce":{"type":"string","description":"Enforcement mode, none or write; omit for none."}},"additionalProperties":false,"required":["check"]}}},"additionalProperties":false,"required":["code"]}},"sources":{"type":"array","description":"External writer sources keyed by id.","items":{"type":"object","description":"One source and its write authority.","properties":{"id":{"type":"string","description":"Source id used by commands."},"ordering":{"type":"string","description":"Ordering discipline, none or sequence; omit for none."},"writes":{"type":"array","description":"Aspect namespaces this source may write.","items":{"type":"string"}},"principals":{"type":"array","description":"Principal ids allowed to act as this source.","items":{"type":"string"}},"audit":{"type":"boolean","description":"Whether source changes retain detailed history."}},"additionalProperties":false,"required":["id"]}},"channels":{"type":"array","description":"Publication channels keyed by id, such as {id: \"web\"}.","items":{"type":"object","description":"One publication channel.","properties":{"id":{"type":"string","description":"Channel id used by releases and publication feeds; use id, not code."},"requirements":{"type":"array","description":"Readiness set ids required for publication.","items":{"type":"string"}},"families":{"type":"array","description":"Family codes allowed in this channel.","items":{"type":"string"}}},"additionalProperties":false,"required":["id"]}},"policy":{"type":"object","description":"Catalog policy overrides; recognized keys and values are validated at runtime, and false restores the deployment default."},"scopes":{"type":"array","description":"Installed query scope ids from PIMSchemaOptions to adopt.","items":{"type":"string"}},"plugins":{"type":"array","description":"Plugin choices keyed by use; initial configuration belongs in the request plugin_configs field.","items":{"type":"object","description":"One installed plugin choice.","properties":{"use":{"type":"string","description":"Installed plugin registry id from PIMSchemaOptions.","minLength":1},"schema":{"type":"object","description":"Catalog-owned schema copy returned by PIMSchemaGet; omit for activation, and never author a replacement copy."}},"additionalProperties":false,"required":["use"]}},"remove":{"type":"object","description":"Remove only the named entries; omission preserves them.","properties":{"dimensions":{"type":"array","description":"Dimension names to remove.","items":{"type":"string"}},"vocabularies":{"type":"array","description":"Vocabulary codes to remove.","items":{"type":"string"}},"aspects":{"type":"array","description":"Aspect namespaces to remove.","items":{"type":"string"}},"families":{"type":"array","description":"Family codes to remove.","items":{"type":"string"}},"sources":{"type":"array","description":"Source ids to remove.","items":{"type":"string"}},"channels":{"type":"array","description":"Channel ids to remove.","items":{"type":"string"}},"attributes":{"type":"array","description":"Full namespace.code attribute coordinates to remove.","items":{"type":"string"}},"scopes":{"type":"array","description":"Scope registry ids to remove.","items":{"type":"string"}},"plugins":{"type":"array","description":"Plugin registry ids to deactivate.","items":{"type":"string"}}},"additionalProperties":false}},"additionalProperties":false,"$comment":"SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0"},"plugin_configs":{"type":"object","additionalProperties":{"type":"object"},"description":"Initial configuration keyed by plugin id for plugins activated by this command."}},"required":["idempotency_key"],"additionalProperties":false}'
        output_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["catalog_id", "title", "generation", "replayed"], "properties": {"catalog_id": {"type": "string", "description": "Created catalog component id for subsequent catalog calls."}, "title": {"type": "string", "description": "Catalog display title."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "replayed": {"type": "boolean", "description": "Whether this result reuses a previously completed command."}}}'
      - name: list
        description: "List the catalogs the caller can read."
        input_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "properties": {"limit": {"type": "integer", "minimum": 1, "maximum": 100, "description": "Maximum catalogs returned, from 1 to 100; omit for 50."}, "after": {"type": "integer", "minimum": 0, "description": "Discovery offset returned by PIMCatalogs; pass it unchanged or omit for the first page."}}, "additionalProperties": false}'
        output_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["catalogs"], "properties": {"catalogs": {"type": "array", "items": {"type": "object", "required": ["catalog_id", "title", "access"], "properties": {"catalog_id": {"type": "string"}, "title": {"type": "string"}, "product_count": {"type": "integer"}, "item_count": {"type": "integer"}, "generation": {"type": "integer"}, "status": {"type": "string"}, "access": {"type": "object", "required": ["read", "write", "admin"], "properties": {"read": {"type": "boolean"}, "write": {"type": "boolean"}, "admin": {"type": "boolean"}}, "additionalProperties": false}}}, "description": "Caller-readable catalogs with ids, titles and independent access grants."}, "after": {"type": "integer", "description": "Next discovery offset; omitted at the end."}}}'
      - name: get_catalog
        description: Exact caller-readable catalog summary.
        input_schemas:
          - format: application/schema+json
            definition: '{"type":"object","properties":{"catalog_id":{"type":"string","minLength":1}},"required":["catalog_id"],"additionalProperties":false}'
        output_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["catalog_id", "title", "access"], "properties": {"catalog_id": {"type": "string"}, "title": {"type": "string"}, "product_count": {"type": "integer"}, "item_count": {"type": "integer"}, "generation": {"type": "integer"}, "status": {"type": "string"}, "access": {"type": "object", "required": ["read", "write", "admin"], "properties": {"read": {"type": "boolean"}, "write": {"type": "boolean"}, "admin": {"type": "boolean"}}, "additionalProperties": false}}}'
      - name: get_schema
        description: "Active or past schema generation: declaration and compiled public parts."
        input_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "properties": {"catalog_id": {"type": "string", "description": "Catalog component id returned by PIMCatalogs; the contract resolves an omitted id only when exactly one catalog is readable."}, "generation": {"type": "integer", "description": "Historical schema generation to read; omit for the current schema."}}, "additionalProperties": false}'
        output_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["schema_generation", "declaration", "attributes", "families", "access"], "properties": {"schema_generation": {"type": "integer", "description": "Requested schema generation represented by the declaration and compiled fields."}, "declaration": {"type": "object", "description": "Effective schema declaration stored for this generation."}, "attributes": {"type": "object", "description": "Compiled attribute definitions keyed by attribute code."}, "families": {"type": "object", "description": "Compiled family definitions keyed by family code."}, "channels": {"type": "object", "description": "Compiled publication channels keyed by channel code."}, "dimensions": {"type": "array", "items": {"type": "object"}, "description": "Declared dimensions and their valid members and resolution chains."}, "vocabularies": {"type": "object", "description": "Vocabulary definitions keyed by vocabulary code."}, "sources": {"type": "object", "description": "Source definitions keyed by source id, including write and ordering rules."}, "scopes": {"type": "object", "description": "Available query scope definitions."}, "plugins": {"type": "array", "description": "Installed and active plugins with configuration, lifecycle and projection progress.", "items": {"type": "object", "required": ["plugin", "installed", "active", "requires", "tools", "lifecycle", "projections"], "properties": {"plugin": {"type": "string"}, "title": {"type": "string"}, "description": {"type": "string"}, "icon": {"type": "string"}, "installed": {"type": "boolean"}, "active": {"type": "boolean"}, "attachment_id": {"type": "string"}, "config": {"type": "object"}, "requires": {"type": "array", "items": {"type": "string"}}, "tools": {"type": "array", "items": {"type": "string"}}, "lifecycle": {"type": "object"}, "projections": {"type": "object"}, "problem": {"type": "object", "required": ["code", "message"], "properties": {"code": {"type": "string"}, "message": {"type": "string"}, "field": {"type": "string"}}}}}}, "as_of": {"type": "integer", "description": "Applied catalog sequence represented by this answer."}, "generation": {"type": "integer", "description": "Schema generation associated with this result."}, "rebuilding": {"type": "boolean", "description": "Whether the catalog has a materialized view rebuild pending."}, "access": {"type": "object", "required": ["read", "write", "admin"], "properties": {"read": {"type": "boolean"}, "write": {"type": "boolean"}, "admin": {"type": "boolean"}}, "additionalProperties": false, "description": "Independent read, write and admin grants of the caller."}}}'
