version: "1.0"
namespace: kickside.pim

entries:
  # kickside.pim:definition
  - name: definition
    kind: ns.definition
    meta:
      title: Kickside PIM
      description: Product information management on Kickside threads - typed contextual product values, variants, schema evolution and releases.

  - name: dep.kickside.component
    version: ">=0.3.28"
    kind: ns.dependency
    meta:
      comment: Catalog components, ACL checks and deletion.
    component: kickside/component

  - name: dep.kickside.core
    version: ">=0.3.36"
    kind: ns.dependency
    meta:
      comment: Catalog threads, sequence-targeted projection waits, retention and Unicode case folding.
    component: kickside/core

  - name: dep.kickside.jobs
    version: ">=0.1.99"
    kind: ns.dependency
    meta:
      comment: Rebuild jobs, projection cancellation notifications and iterative worker dispatch.
    component: kickside/jobs

  - name: dep.kickside.contract
    version: ">=0.3.13"
    kind: ns.dependency
    meta:
      comment: Shared lifecycle contracts and plugin schema resolution.
    component: kickside/contract

  - name: dep.kickside.execution
    version: "*"
    kind: ns.dependency
    meta:
      comment: Resolves the catalog execution identity the rebuild job runs under.
    component: kickside/execution

  - name: dep.kickside.settings
    version: "*"
    kind: ns.dependency
    meta:
      comment: Deployment defaults for audit, trash and tombstone policy.
    component: kickside/settings

  - name: dep.kickside.uploads
    version: ">=0.3.33"
    kind: ns.dependency
    meta: {comment: Component-owned media originals and their content provider.}
    component: kickside/uploads

  - name: dep.wippy.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Migration framework for the fixed PIM tables.
    component: wippy/migration

  - name: dep.kickside.agents
    version: "*"
    kind: ns.dependency
    component: kickside/agents
    meta: {comment: Normalized tool descriptors for contributed plugin tools.}

  # ─── Dependency interface (ns.requirement) ───────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      value_kind: db.sql
      comment: Database for PIM tables; must be the Core database so projection folds and jobs share transactions.
    targets:
      - entry: kickside.pim.migrations:01_catalog
        path: .meta.target_db
      - entry: kickside.pim.persist:config
        path: .meta.db_id
      - entry: kickside.pim.security:retention_db_access
        path: .policy.resources

  - name: api_router
    kind: ns.requirement
    meta:
      value_kind: http.router
      comment: Authenticated HTTP router the PIM endpoints attach to. Must run token_auth and endpoint_firewall.
    targets:
      - entry: kickside.pim.api:list.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_catalog.endpoint
        path: .meta.router
      - entry: kickside.pim.api:create.endpoint
        path: .meta.router
      - entry: kickside.pim.api:update.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:plan_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:configure_plugin.endpoint
        path: .meta.router
      - entry: kickside.pim.api:apply_schema.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get.endpoint
        path: .meta.router
      - entry: kickside.pim.api:query.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_history.endpoint
        path: .meta.router
      - entry: kickside.pim.api:apply.endpoint
        path: .meta.router
      - entry: kickside.pim.api:propose.endpoint
        path: .meta.router
      - entry: kickside.pim.api:decide.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_proposals.endpoint
        path: .meta.router
      - entry: kickside.pim.api:release.endpoint
        path: .meta.router
      - entry: kickside.pim.api:withdraw.endpoint
        path: .meta.router
      - entry: kickside.pim.api:rebuild.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_links.endpoint
        path: .meta.router
      - entry: kickside.pim.api:explain.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_changes.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_publications.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_release.endpoint
        path: .meta.router
      - entry: kickside.pim.api:get_model_release.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_releases.endpoint
        path: .meta.router
      - entry: kickside.pim.api:list_terms.endpoint
        path: .meta.router
      - entry: kickside.pim.api:schema_options.endpoint
        path: .meta.router

  - name: catalog_event_retention_days
    kind: ns.requirement
    default: 90
    meta:
      comment: Catalog event retention window in days; change history and projected state outlive it.
    targets:
      - entry: kickside.pim.binding:catalog
        path: .meta.retention.event_days

  - name: requests
    kind: library.lua
    meta:
      comment: Parses catalog requests against their contract method's input schema before the method acts.
    source: file://requests.lua
    modules: [contract, json, registry]
    imports:
      trim_text: kickside.pim:text
      shape: kickside.pim:shape
      types: kickside.pim:types

  - name: types
    kind: library.lua
    meta:
      comment: Shared PIM types - values, declarations, compiled model, rows, events and requests.
    source: file://types.lua
    modules: [sql]
    imports:

  - name: consts
    kind: library.lua
    meta:
      comment: Stable PIM identifiers, event types and limits.
    source: file://consts.lua
    imports:
      catalog_limits: kickside.pim:catalog_limits

  - name: catalog_limits
    kind: library.lua
    source: file://contracts/limits.lua

  - name: term_line
    kind: library.lua
    source: file://term_line.lua
    modules: [json]
    imports:
      failure: kickside.pim:failure
      types: kickside.pim:types

  - name: data_error
    kind: library.lua
    source: file://data_error.lua
    imports:
      failure: kickside.pim:failure

  - name: client
    kind: library.lua
    source: file://client.lua
    modules: [contract, security]
    imports:
      failure: kickside.pim:failure

  - name: failure
    kind: library.lua
    source: file://failure.lua
    imports:
      error_envelope: kickside.contract:error_envelope

  - name: clock
    kind: library.lua
    meta:
      comment: Deadlines and canonical RFC3339 UTC timestamps.
    source: file://clock.lua
    modules: [time]

  - name: narrow
    kind: library.lua
    meta:
      comment: Narrowing of values read from SQL rows and contract results.
    source: file://narrow.lua

  - name: shape
    kind: library.lua
    meta:
      comment: Tolerant JSON schemas - validate decoded Lua values where an empty table stands for an empty list.
    source: file://shape.lua
    modules: [json]
    imports:
      consts: kickside.pim:consts
      types: kickside.pim:types

  # ─── Plugin schema provider contract ─────────────────────────────────
  - name: schema_provider
    kind: contract.definition
    meta:
      title: Plugin schema provider
      comment: Answers the schema fragment a plugin contributes to one catalog. PIM calls it as the caller when a catalog's admin names the plugin, stores the answer as the catalog's own data and never calls it while folding events.
    methods:
      - name: resolve
        description: "Resolve the plugin's schema fragment for one catalog: the fragment in the declaration vocabulary and an optional version the provider uses to describe it. current is the copy the catalog holds, when it holds one."
        input_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["catalog_id", "plugin", "config"], "properties": {"catalog_id": {"type": "string"}, "plugin": {"type": "string"}, "config": {"type": "object"}, "current": {"type": "object", "required": ["fragment", "digest"], "properties": {"fragment": {"type": "object"}, "version": {"type": "string"}, "digest": {"type": "string"}}}}, "additionalProperties": false}
        output_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["fragment"], "properties": {"fragment": {"type": "object"}, "version": {"type": "string"}}, "additionalProperties": false}

  - name: family_check
    kind: contract.definition
    meta:
      title: PIM family check
      comment: Shape of a callback registered as a kickside.pim.check function.
    methods:
      - name: run
        description: "Return findings for a product's resolved values and, during write enforcement, its native status."
        input_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["config", "view", "product"], "additionalProperties": false, "properties": {"config": {"type": "object", "description": "Configuration declared for this family check."}, "view": {"type": "object", "additionalProperties": {"type": "object"}, "description": "Resolved values by attribute code and context."}, "product": {"type": "object", "required": ["product_id", "sku", "family", "level"], "additionalProperties": false, "properties": {"product_id": {"type": "string"}, "sku": {"type": "string"}, "family": {"type": "string"}, "level": {"type": "integer"}}}, "previous_status": {"type": "string", "enum": ["draft", "active", "archived"], "description": "Status before the write. Omitted on creation and outside write enforcement."}, "proposed_status": {"type": "string", "enum": ["draft", "active", "archived"], "description": "Candidate status on a write, including when unchanged. Omitted outside write enforcement."}}}'
        output_schemas:
          - format: application/schema+json
            definition: '{"type": "object", "required": ["findings"], "properties": {"findings": {"type": "array", "items": {"type": "object", "required": ["message"], "properties": {"message": {"type": "string"}, "code": {"type": "string"}, "attribute": {"type": "string"}, "context": {"type": "string"}, "holder": {"type": "string"}, "product_id": {"type": "string"}, "version": {"type": "integer"}, "set": {"type": "string"}, "check": {"type": "string"}, "channel": {"type": "string"}}}}}}'

  - name: link_target
    kind: contract.definition
    meta:
      title: Link target
      comment: Bound by a plugin that owns entities products point at (locations, suppliers, brands). The binding declares meta.kind, the ref kind link attributes target. Every method runs as the caller.
    methods:
      - name: resolve
        description: "Which of ids exist and are visible to the caller. An id left out makes the item that names it invalid."
        input_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["catalog_id", "ids"], "properties": {"catalog_id": {"type": "string"}, "ids": {"type": "array", "items": {"type": "string"}}}, "additionalProperties": false}
        output_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["ids"], "properties": {"ids": {"type": "array", "items": {"type": "string"}}}, "additionalProperties": false}
      - name: describe
        description: "Label and optional data per id, embedded into release snapshots so a release reads without the owner. An id left out is one the owner no longer knows."
        input_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["catalog_id", "ids"], "properties": {"catalog_id": {"type": "string"}, "ids": {"type": "array", "items": {"type": "string"}}}, "additionalProperties": false}
        output_schemas:
          - format: application/schema+json
            definition: |
              {"type": "object", "required": ["targets"], "properties": {"targets": {"type": "object", "additionalProperties": {"type": "object", "required": ["label"], "properties": {"label": {"type": "string"}, "data": {"type": "object"}}}}}, "additionalProperties": false}

  - name: text
    kind: library.lua
    source: file://text.lua
