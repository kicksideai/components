# SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0
version: "1.0"
namespace: kickside.pim.blocks

# Blocks of the catalog: one exact function Block per contract method a Flow
# composes - read one product, query products, apply changes, release items.
# A Flow fixes the catalog in the Block config and feeds the method's request
# as input; the function runs as the Flow's caller, so the catalog ACL decides.
entries:
  - name: get_product
    kind: registry.entry
    meta:
      type: kickside.block
      public: true
      title: PIM product
      description: One live product by id or sku with its values resolved for a context, its readiness and publications.
    data:
      block:
        api_version: kickside.block/v1
        input:
          type: object
          additionalProperties: false
          required: [product]
          properties:
            product:
              type: object
              title: Product
              additionalProperties: false
              properties:
                id: { type: string }
                sku: { type: string }
            context:
              type: object
              title: Context
              description: Dimension values the attributes resolve in, such as locale or channel.
              additionalProperties: { type: string }
            min_seq: { type: integer, title: Read after sequence }
        config: &catalog_config
          type: object
          additionalProperties: false
          required: [catalog_id]
          properties:
            catalog_id:
              type: string
              minLength: 1
              title: Catalog
              picker: wc-component-picker
              class: pim_catalog
              value_field: id
        output:
          type: object
          additionalProperties: true
          required: [product, values, publications]
          properties:
            product: &product
              type: object
              required: [product_id, sku, family, root_id, level, is_item, version, status]
              properties:
                product_id: { type: string }
                sku: { type: string }
                family: { type: string }
                parent_id: { type: string }
                root_id: { type: string }
                level: { type: integer }
                is_item: { type: boolean }
                version: { type: integer }
                status: { type: string }
            values: { type: object }
            readiness: { type: object }
            release_id: { type: string }
            publications: { type: array, items: { type: object } }
            as_of: { type: integer }
            generation: { type: integer }
            rebuilding: { type: boolean }
        error: &error
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        ports: &ports
          - { id: result, label: Result, direction: out }
          - { id: failed, label: Failed, direction: out }
        presentation:
          category: Products
          icon: tabler:package
          hue: blue
          blurb: Reads one product with its resolved values.
        execution:
          kind: function
          function_id: kickside.pim.blocks:get_product.run

