inuation."}},"required":["seq","product_id"],"additionalProperties":false,"description":"Resume position for this wait in the same catalog. Pass a returned cursor or a PIMChanges continuation. The sequence is a lower bound for matching current product state."},"min_seq":{"type":"integer","minimum":0,"description":"Only match at or after this applied catalog sequence."}},"required":["product","predicate"],"additionalProperties":false}
