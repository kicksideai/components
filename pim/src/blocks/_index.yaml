        output: {"type":"object","properties":{"status":{"type":"string","enum":["matched","timed_out"],"description":"Advance only when status is matched."},"cursor":{"type":"object","properties":{"seq":{"type":"integer","description":"Sequence copied unchanged from the previous page continuation.","minimum":0},"product_id":{"type":"string","description":"Product id copied unchanged from the previous page continuation."},"expiry_floor":{"type":"integer","minimum":0,"description":"Tombstone floor observed by the page that issued this continuation."}},"required":["seq","product_id"],"additionalProperties":false,"description":"Latest wait position. Reuse it in a later wait for the same product and catalog."},"product":{"type":"object","properties":{"product_id":{"type":"string","minLength":1},"sku":{"type":"string","minLength":1},"status":{"type":"string","enum":["active","draft","archived"]},"version":{"type":"integer","minimum":0}},"required":["product_id","sku","status","version"],"additionalProperties":false,"description":"Live product at the matched position. Present only when status is matched."}},"required":["status","cursor"],"additionalProperties":false,"oneOf":[{"properties":{"status":{"const":"matched"}},"required":["product"]},{"properties":{"status":{"const":"timed_out"}},"not":{"required":["product"]}}]}
