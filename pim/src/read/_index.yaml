version: "1.0"
namespace: kickside.pim.read

entries:
  - name: access
    kind: library.lua
    meta:
      comment: Shared read discipline - READ access, the min_seq check, one stamped read snapshot.
    source: file://access.lua
    modules: [security]
    imports:
      failure: kickside.pim:failure
      component: kickside.component:component
      store: kickside.pim.persist:store
      types: kickside.pim:types

  - name: reader
    kind: library.lua
    modules: [base64, json]
    meta:
      comment: Product reads and item queries; every answer reports as_of.
    source: file://reader.lua
    imports:
      defaults: kickside.pim.settings:defaults
      failure: kickside.pim:failure
      layout: kickside.pim.persist:layout
      plugin_reads: kickside.pim.read:plugins
      history: kickside.pim.persist:history
      consts: kickside.pim:consts
      store: kickside.pim.persist:store
      access: kickside.pim.read:access
      select: kickside.pim.persist:select
      scopes: kickside.pim.extensions:scopes
      seams: kickside.pim.extensions:seams
      links: kickside.pim.extensions:links
      schema: kickside.pim.schema:compile
      resolve: kickside.pim.domain:resolve
      types: kickside.pim:types
      proposal_rows: kickside.pim.persist:proposal_rows
      read_model: kickside.pim.persist:read_model

  - name: plugins
    kind: library.lua
    source: file://plugins.lua
    modules: [registry]
    imports:
      access: kickside.pim.read:access
      component: kickside.component:component
      failure: kickside.pim:failure
      plugins: kickside.pim.extensions:plugins
      plugin_projections: kickside.pim.extensions:plugin_projection_state
      store: kickside.pim.persist:store
      types: kickside.pim:types

  - name: feeds
    kind: library.lua
    meta:
      comment: Cursor-resumable feeds over durable state - product changes and channel publications.
    source: file://feeds.lua
    imports:
      consts: kickside.pim:consts
      narrow: kickside.pim:narrow
      store: kickside.pim.persist:store
      read_model: kickside.pim.persist:read_model
      snapshot: kickside.pim.domain:snapshot
      access: kickside.pim.read:access
      types: kickside.pim:types

  - name: wait
    kind: library.lua
    source: file://wait.lua
    modules: [time]
    imports:
      access: kickside.pim.read:access
      clock: kickside.pim:clock
      consts: kickside.pim:consts
      evaluate: kickside.pim.domain:evaluate
      limits: kickside.pim:catalog_limits
      projection_reader: kickside.core.projections.persist:reader
      read_model: kickside.pim.persist:read_model
      reader: kickside.pim.read:reader
      store: kickside.pim.persist:store
      types: kickside.pim:types
      waiters: kickside.core.threads:cursor_waiters

  - name: releases
    kind: library.lua
    modules: [sql]
    meta:
      comment: Release reads - one release by id, and a product's releases newest first.
    source: file://releases.lua
    imports:
      consts: kickside.pim:consts
      failure: kickside.pim:failure
      jobs: kickside.core.jobs:jobs
      store: kickside.pim.persist:store
      release_jobs: kickside.pim.persist:release_jobs
      read_model: kickside.pim.persist:read_model
      access: kickside.pim.read:access
      types: kickside.pim:types

  - name: locate
    kind: library.lua
    meta:
      comment: Readable catalogs and the explicit-or-only catalog selection rule.
    source: file://locate.lua
    imports:
      trim_text: kickside.pim:text
      store: kickside.pim.persist:store
      failure: kickside.pim:failure
      access: kickside.pim.read:access
      types: kickside.pim:types
      component: kickside.component:component
      consts: kickside.pim:consts
