    func: get_schema
    path: /pim/catalogs/{id}/schema

  - name: apply_schema
    kind: function.lua
    meta: { comment: "POST /pim/catalogs/{id}/schema - apply a schema change." }
    source: file://apply_schema.lua
    method: handler
    imports:
