version: "1.0"
namespace: kickside.pim.api

entries:
  - name: access
    kind: library.lua
    meta: { comment: Shared JSON response and contract call of the catalog endpoints. }
    source: file://access.lua
    modules: [http, json, security]
    imports:
      consts: kickside.pim:consts
      native_failure: kickside.pim:failure
      catalog_client: kickside.pim:client
      http_errors: kickside.contract:http_errors
      http_params: kickside.contract:http_params

  - name: list
    kind: function.lua
    meta: { comment: "GET /pim/catalogs - the catalogs the caller can read." }
    source: file://list.lua
    method: handler
    imports:
      access: kickside.pim.api:access

  - name: list.endpoint
    kind: http.endpoint
    meta:
      comment: Catalog endpoint behind the authenticated API router.
    method: GET
    func: list
    path: /pim/catalogs

  - name: get_catalog
    kind: function.lua
    meta: { comment: "GET /pim/catalogs/{id}/summary - exact actor-scoped catalog summary." }
    source: file://get_catalog.lua
    method: handler
    imports:
      access: kickside.pim.api:access

  - name: get_catalog.endpoint
    kind: http.endpoint
    meta:
      comment: Catalog endpoint behind the authenticated API router.
    method: GET
    func: get_catalog
    path: /pim/catalogs/{id}/summary

  - name: create
    kind: function.lua
    meta: { comment: "POST /pim/catalogs - create a catalog, idempotent per caller and key." }
    source: file://create.lua
    method: handler
    imports:
      access: kickside.pim.api:access

  - name: create.endpoint
    kind: http.endpoint
    meta:
      comment: Catalog endpoint behind the authenticated API router.
    method: POST
    func: create
    path: /pim/catalogs

  - name: get_schema
    kind: function.lua
    meta: { comment: "GET /pim/catalogs/{id}/schema - the declaration and compiled schema." }
