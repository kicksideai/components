version: '1.0'
namespace: kickside.agent_onboarding.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Agent Onboarding
    surface: kickside.agent_onboarding
    intent: module_access
    includes:
    - kickside.agent_onboarding.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.agent_onboarding:*
    - kickside.agent_onboarding.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.agent_onboarding:*
    - kickside.agent_onboarding.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
