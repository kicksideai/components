version: '1.0'
namespace: kickside.agent_onboarding.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Agent Onboarding
    surface: kickside.agent_onboarding
    intent: module_access
    includes:
    - kickside.agent_onboarding.security:module_runtime
    - kickside.agent_onboarding.security:member_endpoints
    - kickside.agent_onboarding.security:knowledge_contract
    - kickside.agent_onboarding.security:knowledge_binding
    - kickside.agent_onboarding.security:knowledge_create
    - kickside.agent_onboarding.security:knowledge_create_function
    - kickside.agent_onboarding.security:knowledge_store_contract
  groups: []
  policy:
    resources:
    - kickside.agent_onboarding:*
    - kickside.agent_onboarding.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.agent_onboarding:*
    - kickside.agent_onboarding.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow

- name: member_endpoints
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.agent_onboarding:create_agent.endpoint
    actions: access
    effect: allow

- name: knowledge_contract
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.knowledge:knowledge_bases
    actions: contract.get
    effect: allow

- name: knowledge_binding
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.knowledge.registry:knowledge_bases_registry
    actions: contract.open
    effect: allow

- name: knowledge_create
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - create
    actions: contract.call
    effect: allow

- name: knowledge_create_function
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.knowledge.registry:kb_create
    actions: funcs.call
    effect: allow

- name: knowledge_store_contract
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.knowledge:kb_store_lifecycle
    actions: contract.get
    effect: allow

- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
  targets:
  - entry: kickside.agent_onboarding.security:module_access
    path: .groups +=
  - entry: kickside.agent_onboarding.security:module_runtime
    path: .groups +=
  - entry: kickside.agent_onboarding.security:member_endpoints
    path: .groups +=
