version: '1.0'
namespace: kickside.work.planning
entries:
- name: definition
  kind: ns.definition
  meta:
    title: Work Planning
- name: dep.work
  kind: ns.dependency
  component: kickside/work
  version: '>=0.1.47'
- name: dep.migration
  kind: ns.dependency
  component: wippy/migration
  version: '>=0.3.26'
- name: target_db
  kind: ns.requirement
  meta:
    value_kind: db.sql
    comment: Bind to the same SQL database as kickside.work:target_db when it differs from the application migration database.
  default: app:db
  targets:
  - entry: kickside.work.planning.capacity:initial_storage
    path: .meta.target_db
- name: types
  kind: library.lua
  source: file://types.lua
  imports:
    reads: kickside.work.read:types
    work: kickside.work:types
- name: pack
  kind: registry.entry
  meta:
    type: kickside.work.pack
    title: Planning
    version: '1.0.0'
    icon: tabler:calendar
    description: Plan sprints and milestones and track issue membership.
  data:
    additive: true
    schema:
      fields:
      - {code: title, form: text}
      - {code: name, form: text, title: Name}
      - {code: planning_start, form: time, index: key, title: Start date}
      - {code: planning_end, form: time, index: key, title: End date}
      - {code: planning_goal, form: text, title: Goal}
      - {code: current_sprint, type: item, config: {item_type: sprint, item_states: [planned, active]}, index: key, track: true, title: Current sprint}
      - {code: milestone, type: item, config: {item_type: milestone}, index: key, track: true, title: Milestone}
      item_types:
      - {id: issue, title: Issue, process: planning_issue, fields: [title, current_sprint, milestone]}
      - {id: sprint, title: Sprint, process: planning_sprint, fields: [name, planning_start, planning_end, planning_goal]}
      - {id: milestone, title: Milestone, process: planning_period, fields: [name, planning_start, planning_end, planning_goal]}
    processes:
    - id: planning_period
      initial: planned
      states: &period_states
      - {id: planned, name: Planned, category: unstarted, require: [name]}
      - {id: active, name: Active, category: started, require: [name, planning_start, planning_end]}
      - {id: closed, name: Closed, category: completed, require: [name]}
      transitions:
      - &start_period {id: start, from: [planned], to: active, guards: ['kickside.work.planning:date_order']}
      - {id: close, from: [active], to: closed}
    - id: planning_sprint
      initial: planned
      states: *period_states
      transitions:
      - *start_period
      - {id: close, from: [active], to: closed, prepare_command: 'kickside.work.planning:prepare_close'}
    - id: planning_issue
      initial: open
      states:
      - {id: open, name: Open, category: backlog}
      - {id: done, name: Done, category: completed}
      - {id: canceled, name: Canceled, category: canceled}
      transitions:
      - {id: complete, from: [open], to: done}
      - {id: cancel, from: [open], to: canceled}
    requires: ['kickside.work.planning:plugin']
    views: []
    automations: []
    traits: []
    starter: {items: [], default: false}
- name: plugin
  kind: registry.entry
  meta:
    type: kickside.work.plugin
    interface_version: 1
    title: Work Planning
    description: Adds sprints and milestones so people can plan items into time-boxed cycles.
    icon: tabler:calendar
    category: Planning and tracking
    attachment: kickside.work.planning:attachment
    seams: ['kickside.work.planning:date_order']
    tools: ['kickside.work.planning:plan_close', 'kickside.work.planning:close']
    projections:
    - kind: kickside.work.planning:capacity_lifecycle
      worker_ref: func://kickside.work.planning.capacity:project
      input: state
    schema:
      provider: kickside.work.planning:schema_provider
    config_schema:
      type: object
      properties:
        issue_types:
          type: array
          title: Plan these item types
          description: Selected item types get Current sprint and Milestone fields.
          maxItems: 49
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,39}$'
            not: {enum: [issue, sprint, milestone]}
            x-choices: board_item_types
        epic_types:
          type: array
          description: Existing epic types to extend with the Planning start date.
          maxItems: 49
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}
        epic_due_field:
          type: string
          description: Existing indexed date field on configured epic types. Omit to use Planning end.
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        points_field:
          type: string
          description: Indexed numeric estimate field for points planning. Omit to use story_points where declared.
          pattern: '^[a-z][a-z0-9_]{0,39}$'
      additionalProperties: false
- name: date_order
  kind: function.lua
  meta:
    type: kickside.work.guard
    plugin: kickside.work.planning:plugin
    reads: [planning_start, planning_end]
    cost: interactive
    enforce: write
  source: file://pack.lua
  method: date_order
  imports: &pack_imports
    types: kickside.work.planning:types
    work: kickside.work:types
    mapping: kickside.work.planning.capacity:mapping
- name: schema_provider
  kind: contract.binding
  contracts:
  - contract: kickside.work:schema_provider
    methods: {resolve: 'kickside.work.planning:adopt_fields'}
- name: adopt_fields
  kind: function.lua
  source: file://pack.lua
  method: adopt_fields
  imports: *pack_imports
- name: attachment
  kind: contract.binding
  meta:
    title: Work Planning attachment
    placement:
      parents: [root]
      fixed: true
  contracts:
  - contract: kickside.contract:component
    methods: {get_status: 'kickside.core.threads:thread_status'}
  - contract: kickside.contract:deletable
    context_required: [component_id]
    methods: {delete: 'kickside.work.planning:delete'}
- name: delete
  kind: function.lua
  meta: {private: true}
  source: file://capacity/teardown.lua
  method: delete
  modules: [ctx]
  imports:
    component: kickside.component:component
    storage: kickside.work.planning.capacity:storage
