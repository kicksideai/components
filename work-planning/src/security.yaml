version: '1.0'
namespace: kickside.work.planning
entries:
- name: commit_sprint
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers: ['kickside.work.planning:close']
  policy:
    resources:
    - kickside.work.service:transition_command
    - kickside.work.planning:prepare_close
    actions: [funcs.call, registry.get]
    effect: allow
- name: module_access
  kind: security.policy
  meta:
    title: Work Planning
    surface: kickside.work.planning
    intent: module_access
    includes: ['kickside.work.planning:module_runtime', 'kickside.work.planning:member_endpoints']
  groups: []
  policy:
    resources:
    - kickside.work.planning:pack
    - kickside.work.planning:plugin
    - kickside.work.planning:date_order
    - kickside.work.planning:attachment
    - kickside.work.planning:schema_provider
    - kickside.work.planning:sprints
    - kickside.work.planning:plan_close
    - kickside.work.planning:close
    - kickside.work.planning:plan_adoption
    - kickside.work.planning:apply_adoption
    actions: [registry.get, registry.find]
    effect: allow
- name: module_runtime
  kind: security.policy
  meta: {private: true}
  groups: []
  policy:
    resources:
    - kickside.work.planning:date_order
    - kickside.work.planning:attachment
    - kickside.work.planning:delete
    - kickside.work.planning:schema_provider
    - kickside.work.planning:sprints
    - kickside.work.planning:plan_close
    - kickside.work.planning:close
    - kickside.work.planning:plan_adoption
    - kickside.work.planning:apply_adoption
    - kickside.work.planning:adopt_fields
    - kickside.work.planning:sprints_binding
    - kickside.work.api.sprints:plan_close
    - kickside.work.api.sprints:close
    - kickside.work.api.sprints:plan_adoption
    - kickside.work.api.sprints:apply_adoption
    actions: [contract.get, contract.open, contract.call, contract.security, funcs.call, funcs.security]
    effect: allow
- name: member_endpoints
  kind: security.policy
  meta: {private: true}
  groups: []
  policy:
    resources:
    - kickside.work.api.sprints:plan_close.endpoint
    - kickside.work.api.sprints:close.endpoint
    - kickside.work.api.sprints:plan_adoption.endpoint
    - kickside.work.api.sprints:apply_adoption.endpoint
    actions: access
    effect: allow
- name: adopt_sprint_close
  kind: security.policy
  meta:
    private: true
    service_only: true
    producers: ['kickside.work.planning:plan_adoption', 'kickside.work.planning:apply_adoption']
  policy:
    resources:
    - kickside.work.service:plan_transition_adoption
    - kickside.work.service:apply_transition_adoption
    - kickside.work.planning:legacy_sprint_close_adoption
    - kickside.work.planning:prepare_close
    actions: [funcs.call, registry.get]
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  meta: {value_kind: security.scope}
  default: kickside.security.groups:members
  targets:
  - {entry: 'kickside.work.planning:module_access', path: '.groups +='}
  - {entry: 'kickside.work.planning:module_runtime', path: '.groups +='}
  - {entry: 'kickside.work.planning:member_endpoints', path: '.groups +='}
