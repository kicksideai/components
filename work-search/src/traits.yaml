version: '1.0'
namespace: kickside.work_search
entries:
- name: search
  kind: registry.entry
  meta:
    type: agent.trait
    public: true
    title: Work Search
    context_schema:
      type: object
      properties: { board_id: { type: string } }
      additionalProperties: false
  prompt: Use WorkFindItems on a board with Work Search. Put the search text in where.match and include any other Work filters in the same predicate. Search verifies up to 2,000 lexical candidates per board and allows up to 1,000 visible matches. Results follow ordinary Work order. Preserve the returned cursor when paging.
  tools:
  - kickside.work.traits:list_boards
  - kickside.work.traits:find_items
- name: admin
  kind: registry.entry
  meta:
    type: agent.trait
    public: true
    title: Work Search administration
    context_schema:
      type: object
      properties: { board_id: { type: string } }
      additionalProperties: false
  prompt: Use WorkSchemaOptions to inspect the Work Search projection. Activate kickside.work_search:plugin and adopt the text or key scope with WorkPlanSchema and WorkApplySchema. Use the key scope if title or description is absent or subject to a read restriction.
  tools:
  - kickside.work.traits:schema_options
  - kickside.work.traits:plan_schema
  - kickside.work.traits:apply_schema
  - kickside.work.traits:list_packs
  - kickside.work.traits:pack_plan
  - kickside.work.traits:pack_apply
