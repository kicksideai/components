version: '1.0'
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
  enable_history: true
  history_type: memory
override:
  kickside.work.settings:read_deadline_ms:default: 10000
  kickside.work.settings:command_deadline_ms:default: 10000
  kickside.work.settings:plugin_discovery_batch:default: 2
  kickside.core.retention.service:sweeper.service:lifecycle.auto_start: false
workspace:
  replacements:
    kickside/work-search: ..
    kickside/work: ../../work
    kickside/agent-onboarding: ../../agent-onboarding
    kickside/sso: ../../sso
    kickside/dashboard: ../../dashboard
vars:
  pg_host: localhost
  pg_port: 5434
  pg_database: kickside_test_work_search
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
