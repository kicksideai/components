version: "1.0"
namespace: kickside.mail.harness
entries:
  - name: admitted_open
    kind: security.policy
    groups: [kickside.mail.security:transports]
    policy:
      resources: [kickside.mail.harness:admitted, kickside.mail.harness:second, kickside.mail.harness:capture]
      actions: [contract.open]
      effect: allow
  - name: admitted
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.harness:send_first, status: kickside.mail.harness:status_first}
  - name: second
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.harness:send_second, status: kickside.mail.harness:status_second}
  - name: capture
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.harness:send_capture, status: kickside.mail.harness:status_capture}
  - name: refused
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.harness:send_first, status: kickside.mail.harness:status_first}
  - name: send_first
    kind: function.lua
    source: file://transport.lua
    method: first
    modules: &transport_modules [json, sql, channel, base64]
    imports: &transport_imports
      delivery: kickside.mail.driver:http
      types: kickside.mail:types
  - name: send_second
    kind: function.lua
    source: file://transport.lua
    method: second
    modules: *transport_modules
    imports: *transport_imports
  - name: send_capture
    kind: function.lua
    source: file://transport.lua
    method: capture
    modules: *transport_modules
    imports: *transport_imports
    security:
      policies: [kickside.mail.harness:fixture_db]
  - name: status_first
    kind: function.lua
    source: file://transport.lua
    method: status_first
    modules: *transport_modules
    imports: *transport_imports
  - name: status_second
    kind: function.lua
    source: file://transport.lua
    method: status_second
    modules: *transport_modules
    imports: *transport_imports
  - name: status_capture
    kind: function.lua
    source: file://transport.lua
    method: status_capture
    modules: *transport_modules
    imports: *transport_imports
  - name: http_client
    kind: library.lua
    source: file://http_client.lua
    modules: [json]
  - name: transport_probe_call
    kind: security.policy
    policy:
      resources: [kickside.mail.harness:transport_probe]
      actions: [funcs.call]
      effect: allow
  - name: transport_probe_contract
    kind: security.policy
    policy:
      resources: [kickside.mail:transport]
      actions: [contract.get, contract.implementations]
      effect: allow
  - name: transport_probe
    kind: function.lua
    source: file://transports_test.lua
    method: probe
    modules: [contract, funcs, registry, security]
    imports:
      test: wippy.test:test
    security:
      policies: [kickside.mail.harness:transport_probe_contract]
  - name: transports_test
    kind: function.lua
    meta: {type: test, suite: mail_transports}
    source: file://transports_test.lua
    method: run
    modules: [contract, funcs, registry, security]
    imports:
      test: wippy.test:test
  - name: probe
    kind: function.lua
    source: file://mailer_test.lua
    method: probe
    modules: [contract, funcs, security, registry, json, sql, time, uuid]
    imports:
      library_fixtures: app.mail_library:fixtures
      test: wippy.test:test
      blocks: kickside.blocks:blocks
      compiler: kickside.workflows.compiler:compiler
      canonical_json: kickside.contract:canonical_json
      jobs: kickside.core.jobs:jobs
      policy: kickside.mail.domain:policy
      database: kickside.mail.persist:db
      jobs_cancel: kickside.core.jobs.persist:lifecycle_cancel
  - name: fixture_db
    kind: security.policy
    policy:
      resources: [app:db]
      actions: [db.get]
      effect: allow
  - name: caller
    kind: security.policy
    policy:
      resources: [kickside.mail.harness:probe]
      actions: [funcs.call]
      effect: allow
  - name: external_template
    kind: security.policy
    policy:
      resources: [app.templates:reminder_template]
      actions: [registry.get, registry.find]
      effect: allow
  - name: principal_reader
    kind: security.policy
    policy:
      resources:
        - get_user
        - kickside.users:user_provisioning
        - kickside.users:provisioning_binding
        - kickside.users.provisioning:provisioning_get_user
      actions: [registry.get, contract.get, contract.open, contract.call, contract.security, funcs.call, funcs.security]
      effect: allow
  - name: admin
    kind: security.policy
    policy:
      resources:
        - kickside.settings:*
        - kickside.settings.api:put_settings.endpoint
        - kickside.settings.persist:*
        - kickside.mail.settings:setting_driver
        - kickside.mail.settings:setting_from_address
        - kickside.mail.settings:setting_from_name
        - kickside.mail.settings:setting_reply_to
        - kickside.mail.settings:setting_log_retention_days
        - kickside.mail.settings:validate_driver
        - kickside.mail.settings:validate_address
        - kickside.mail.settings:validate_from_name
        - kickside.mail.settings:validate_retention
        - app:db
        - set
        - unset
      actions: [access, registry.find, registry.get, contract.get, contract.open, contract.call, contract.security, funcs.call, funcs.security, db.get]
      effect: allow
  - name: test
    kind: function.lua
    meta: { type: test, suite: mailer }
    source: file://mailer_test.lua
    method: run
    modules: [funcs, security, contract, registry, json, sql, time, uuid]
    imports:
      library_fixtures: app.mail_library:fixtures
      test: wippy.test:test
      blocks: kickside.blocks:blocks
      compiler: kickside.workflows.compiler:compiler
      canonical_json: kickside.contract:canonical_json
      jobs: kickside.core.jobs:jobs
      policy: kickside.mail.domain:policy
      database: kickside.mail.persist:db
      jobs_cancel: kickside.core.jobs.persist:lifecycle_cancel
  - name: port_declaration_test
    kind: function.lua
    meta: { type: test, suite: mailer }
    source: file://port_declaration_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      binding_validation: kickside.automation:binding_validation
  - name: owner_clock
    kind: library.lua
    source: file://owner_clock.lua
    modules: [ctx, time]
  - name: lease_hint
    kind: library.lua
    source: file://lease_hint.lua
    modules: [sql]
    imports:
      release: kickside.core.jobs:lease_release
