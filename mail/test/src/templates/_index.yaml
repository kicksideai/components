version: "1.0"
namespace: app.templates
entries:
  - name: reminder
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: message/reminder }
    source: &reminder_html |
      {{ extends "/base/standard" }}{{ block body() }}<p>Please finish {{ task }}.</p>{{ end }}
  - name: reminder.title
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: message/reminder.subject }
    source: &reminder_subject |-
      Reminder: {{ task }}
  - name: reminder.plain
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: message/reminder }
    source: &reminder_text |
      {{ extends "/base/standard" }}{{ block body() }}Please finish {{ task }}.{{ end }}
  - name: reminder_template
    kind: registry.entry
    meta: { type: "kickside.mail:template" }
    template:
      kind: message
      name: reminder
      title: Reminder
      description: Remind the recipient about a task.
      base: standard
      html: *reminder_html
      text: *reminder_text
      subject: *reminder_subject
      entries: { html: "app.templates:reminder", text: "app.templates:reminder.plain", subject: "app.templates:reminder.title" }
      variable_schema:
        type: object
        additionalProperties: false
        required: [task]
        properties:
          task: { type: string, description: Task to complete. }
      sample: { task: Send the report }
  - name: undeclared
    kind: template.jet
    set: kickside.mail.views:templates
    source: <p>Undeclared</p>
  - name: undeclared.subject
    kind: template.jet
    set: kickside.mail.views:templates
    source: Undeclared
  - name: undeclared.text
    kind: template.jet
    set: kickside.mail.views:templates
    source: Undeclared
  - name: standalone_part
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: test/standalone-part }
    source: &standalone_part '{{ include part_path inputs }}'
  - name: standalone_part.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: test/standalone-part }
    source: *standalone_part

  - name: deny_app_definition
    kind: security.policy
    policy:
      resources: [app:definition]
      actions: [registry.get]
      effect: deny
  - name: preview_without_app_definition
    kind: function.lua
    source: file://globals_test.lua
    method: preview
    modules: [security]
    imports:
      test: wippy.test:test
      preview: kickside.mail.read:preview
    security:
      policies:
        - app.templates:deny_app_definition
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:mail_db
        - kickside.mail.security:mail_config
  - name: globals_test
    kind: function.lua
    meta: {type: test, suite: mail_templates}
    source: file://globals_test.lua
    method: run
    modules: [funcs]
    imports:
      test: wippy.test:test
