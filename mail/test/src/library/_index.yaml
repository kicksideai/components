version: "1.0"
namespace: app.mail_library
entries:
  - name: teardown_test
    kind: function.lua
    meta: {type: test, suite: mail_library_teardown}
    source: file://teardown_test.lua
    method: run
    modules: [contract, fs, funcs, registry, security, sql, time]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      content: kickside.mail.read:content
      lookup: kickside.uploads.persist:upload_query_repo
      api_fixtures: app.mail_api:fixtures
      component: kickside.component:component
      jobs: kickside.core.jobs:jobs
  - name: site_url_storage
    kind: env.storage.static
    values: {PUBLIC_API_URL: "https://example.org"}
  - name: upload_fixture
    kind: function.lua
    source: file://upload_fixture.lua
    method: run
    modules: [contract, security]
    imports:
      uploads: kickside.uploads:uploads
      upload_types: kickside.uploads:types
    security:
      policies:
        - app.mail_library:store_component
        - app.mail_library:store_component_config
        - kickside.uploads.security:module_access
        - kickside.core.retention:notify_access
        - kickside.core.jobs.security:module_access
        - kickside.core.jobs.persist:pool_nudge_access
        - app.mail_harness:fixture_db
        - app:uploads_storage_access
  - name: store_component
    kind: security.policy
    policy:
      resources: [kickside.component:component_service, kickside.component.binding:component_service_impl,
        query, register]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
  - name: store_component_config
    kind: security.policy
    policy:
      resources: [kickside.component:db_config, kickside.component:policy, kickside.uploads:uploads_component,
        kickside.core:policy]
      actions: [registry.get]
      effect: allow
  - name: store_upload_calls
    kind: security.policy
    groups: [app.mail_api:upload_editor_sender, app.mail_api:upload_editor, app.mail_api:upload_sender]
    policy:
      resources: [app.mail_library:upload_fixture]
      actions: [funcs.call]
      effect: allow
  - name: site_url
    kind: env.variable
    variable: PUBLIC_API_URL
    storage: app.mail_library:site_url_storage
  - name: site_title
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.ui
    key: title
    title: Site title
    scope: global
    value_type: string
    default: KickSide
  - name: fixtures
    kind: library.lua
    source: &fixtures_source file://fixtures.lua
    modules: &fixtures_modules [contract, funcs, registry, time, json]
    imports: &fixtures_imports
      database: kickside.mail.persist:db
      client: kickside.mail:client
      api_fixtures: app.mail_api:fixtures
  - name: invoke
    kind: function.lua
    source: *fixtures_source
    method: invoke
    modules: *fixtures_modules
    imports: *fixtures_imports
  - name: foreign_list
    kind: function.lua
    source: *fixtures_source
    method: foreign_list
    modules: *fixtures_modules
    imports: *fixtures_imports
  - name: invoke_mailer
    kind: function.lua
    source: *fixtures_source
    method: invoke_mailer
    modules: *fixtures_modules
    imports: *fixtures_imports
  - name: invoke_access
    kind: security.policy
    groups: [app.mail_api:editor, app.mail_api:editor_sender, app.mail_api:sender, app.mail_api:upload_sender,
      app.mail_api:library_capability_only, app.mail_api:driver_only, app.mail_api:delivery_sender, app.mail_api:log_reader]
    policy:
      resources: [app.mail_library:invoke, app.mail_library:foreign_list, app.mail_library:invoke_mailer]
      actions: [funcs.call]
      effect: allow
  - name: library_test
    kind: function.lua
    meta: { type: test, suite: mail_library }
    source: file://library_test.lua
    method: run
    modules: [registry, templates]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      jet: kickside.mail.domain:jet
      api_fixtures: app.mail_api:fixtures
      autoinit: kickside.component:autoinit
      publication_cases: app.mail_library:publication_cases
      resource_cases: app.mail_library:resource_cases
      history_cases: app.mail_library:history_cases
  - name: publication_cases
    kind: library.lua
    source: file://publication_cases.lua
    modules: [contract, funcs, registry, security, uuid]
    imports:
      fixtures: app.mail_library:fixtures
      api_fixtures: app.mail_api:fixtures
      autoinit: kickside.component:autoinit
      database: kickside.mail.persist:db
      reader: kickside.mail.persist:library_reader
      live: kickside.mail.render:live
      originals: kickside.mail.render:originals
  - name: deny_marker_read
    kind: security.policy
    policy:
      resources: [kickside.mail.projection:marker]
      actions: [registry.get]
      effect: deny
  - name: deny_library_wait
    kind: security.policy
    policy:
      resources: [kickside.mail.command:catch_up]
      actions: [funcs.call]
      effect: deny
  - name: deny_library_append
    kind: security.policy
    policy:
      resources: [append_events]
      actions: [contract.call]
      effect: deny
  - name: resource_cases
    kind: library.lua
    source: file://resource_cases.lua
    modules: [funcs, registry, security]
    imports:
      fixtures: app.mail_library:fixtures
      jet: kickside.mail.domain:jet
      api_fixtures: app.mail_api:fixtures
  - name: history_cases
    kind: library.lua
    source: file://history_cases.lua
    modules: [contract, funcs, security, sql]
    imports:
      fixtures: app.mail_library:fixtures
      prune: kickside.core.retention:prune
      api_fixtures: app.mail_api:fixtures
  - name: draft_workspace_test
    kind: function.lua
    meta: { type: test, suite: mail_draft_workspace }
    source: file://draft_workspace_test.lua
    method: run
    modules: [funcs, registry, security, time, uuid]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      api_fixtures: app.mail_api:fixtures
      database: kickside.mail.persist:db
      jet: kickside.mail.domain:jet
      previews: kickside.mail.persist:preview_repo
  - name: assets_test
    kind: function.lua
    meta: { type: test, suite: mail_assets }
    source: &assets_source file://assets_test.lua
    method: run
    modules: &assets_modules [contract, fs, funcs, security, sql, uuid, base64, time, json]
    imports: &assets_imports
      delivery_wait: app.mail_harness:delivery_wait
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      upload_types: kickside.uploads:types
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      asset_file_repo: kickside.mail.persist:asset_file_repo
      attachments: kickside.mail.command:attachments
      content: kickside.mail.read:content
      prune: kickside.core.retention:prune
      asset_interleave: app.mail_library:asset_interleave
      asset_lifetime_cases: app.mail_library:asset_lifetime_cases
      asset_content_cases: app.mail_library:asset_content_cases
      asset_delivery_cases: app.mail_library:asset_delivery_cases
  - name: asset_lifetime_cases
    kind: library.lua
    source: file://asset_lifetime_cases.lua
    modules: [contract, funcs, security, sql, uuid, base64, time]
    imports:
      fixtures: app.mail_library:fixtures
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      attachments: kickside.mail.command:attachments
      content: kickside.mail.read:content
      database: kickside.mail.persist:db
      ledger: kickside.mail.persist:asset_file_repo
      asset_interleave: app.mail_library:asset_interleave
  - name: asset_content_cases
    kind: library.lua
    source: file://asset_content_cases.lua
    modules: [contract, fs, funcs, security, sql, uuid, base64, time, json]
    imports:
      fixtures: app.mail_library:fixtures
      upload_types: kickside.uploads:types
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      attachments: kickside.mail.command:attachments
      content: kickside.mail.read:content
  - name: asset_delivery_cases
    kind: library.lua
    source: file://asset_delivery_cases.lua
    modules: [contract, funcs, security, sql, uuid]
    imports:
      fixtures: app.mail_library:fixtures
      upload_types: kickside.uploads:types
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      attachments: kickside.mail.command:attachments
  - name: asset_expiry_test
    kind: function.lua
    meta: { type: test, suite: mail_asset_expiry }
    source: *assets_source
    method: expiry
    modules: *assets_modules
    imports: *assets_imports
  - name: asset_interleave
    kind: library.lua
    source: file://asset_interleave.lua
    modules: [sql]
    imports:
      fixtures: app.mail_library:fixtures
  - name: upload_storage
    kind: library.lua
    source: file://upload_storage.lua
    imports:
      storage: kickside.uploads.binding:storage_adapter_default
      asset_interleave: app.mail_library:asset_interleave
  - name: acl_test
    kind: function.lua
    meta: { type: test, suite: mail_library_acl }
    source: file://acl_test.lua
    method: run
    modules: [funcs, security, uuid]
    imports:
      autoinit: kickside.component:autoinit
      fixtures: app.mail_library:fixtures
      api_fixtures: app.mail_api:fixtures
      test: wippy.test:test
  - name: projection_test
    kind: function.lua
    meta: {type: test, suite: mail_library_projection}
    source: file://projection_test.lua
    method: run
    modules: [contract, funcs, json, security, sql, time, uuid]
    imports:
      events: kickside.mail.domain:events
      resource: kickside.mail.domain:resource
      originals: kickside.mail.render:originals
      autoinit: kickside.component:autoinit
      test: wippy.test:test
  - name: projection_fixture
    kind: security.scope
  - name: projection_fixture_composition
    kind: registry.entry
    meta: {type: kickside.security.group_composition}
    group_id: app.mail_library:projection_fixture
    policies:
      - kickside.core.security:module_access
      - kickside.core.jobs.security:module_access
      - kickside.component.security:module_access
      - app.mail_library:fixture_threads
      - app.mail_harness:fixture_db
      - app.mail_library:fixture_projection_context
  - name: fixture_projection_context
    kind: security.policy
    policy:
      resources: [security]
      actions: [contract.security, funcs.security]
      effect: allow
  - name: fixture_threads
    kind: security.policy
    policy:
      resources: [kickside.core:threads, kickside.core:threads_binding, find, append_events, catch_up_projection,
        pause_projection, resume_projection, find_event_by_external, list_events, get_access_context]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
  - name: binding_declaration_test
    kind: function.lua
    meta: {type: test, suite: mail_library_projection_wiring}
    source: file://binding_declaration_test.lua
    method: run
    modules: [registry]
    imports: {test: wippy.test:test, resource: kickside.mail.domain:resource}
