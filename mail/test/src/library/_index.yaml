version: "1.0"
namespace: app.mail_library
entries:
  - name: teardown_test
    kind: function.lua
    meta: {type: test, suite: zz_mail_teardown}
    source: file://teardown_test.lua
    method: run
    modules: [contract, fs, funcs, registry, security, sql, time, uuid]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      content: kickside.mail.read:content
      records: kickside.uploads.persist:upload_record_repo
      lookup: kickside.uploads.persist:upload_query_repo
      upload_types: kickside.uploads:types
      api_fixtures: app.mail_api:fixtures
      component: kickside.component:component
  - name: site_url_storage
    kind: env.storage.static
    values: {PUBLIC_API_URL: "https://example.org"}
  - name: site_url
    kind: env.variable
    variable: PUBLIC_API_URL
    storage: app.mail_library:site_url_storage
  - name: site_title
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.ui
    key: title
    title: Site title
    scope: global
    value_type: string
    default: KickSide
  - name: fixtures
    kind: library.lua
    source: &fixtures_source file://fixtures.lua
    modules: &fixtures_modules [contract, funcs, registry, time, json]
    imports: &fixtures_imports
      database: kickside.mail.persist:db
      client: kickside.mail:client
      api_fixtures: app.mail_api:fixtures
  - name: invoke
    kind: function.lua
    source: *fixtures_source
    method: invoke
    modules: *fixtures_modules
    imports: *fixtures_imports
  - name: foreign_list
    kind: function.lua
    source: *fixtures_source
    method: foreign_list
    modules: *fixtures_modules
    imports: *fixtures_imports
  - name: invoke_mailer
    kind: function.lua
    source: *fixtures_source
    method: invoke_mailer
    modules: *fixtures_modules
    imports: *fixtures_imports
    security:
      policies: [kickside.mail.security:module_runtime]
  - name: invoke_access
    kind: security.policy
    groups: [app.mail_api:editor, app.mail_api:editor_sender, app.mail_api:sender]
    policy:
      resources: [app.mail_library:invoke, app.mail_library:foreign_list, app.mail_library:invoke_mailer]
      actions: [funcs.call]
      effect: allow
  - name: publication_failure
    kind: registry.entry
    enabled: false
  - name: publication_fault_read
    kind: security.policy
    policy:
      resources: [app.mail_library:publication_failure]
      actions: [registry.get]
      effect: allow
  - name: library_test
    kind: function.lua
    meta: { type: test, suite: mail_library }
    source: file://library_test.lua
    method: run
    modules: [contract, funcs, registry, templates, security, sql, uuid]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      jet: kickside.mail.domain:jet
      api_fixtures: app.mail_api:fixtures
      prune: kickside.core.retention:prune
      autoinit: kickside.component:autoinit
  - name: draft_render
    kind: library.lua
    source: file://draft_render.lua
    modules: [ctx, registry]
    imports:
      render: kickside.mail.render:render
      types: kickside.mail:types
  - name: draft_workspace_test
    kind: function.lua
    meta: { type: test, suite: mail_draft_workspace }
    source: file://draft_workspace_test.lua
    method: run
    modules: [funcs, registry, security, time]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
  - name: assets_test
    kind: function.lua
    meta: { type: test, suite: mail_assets }
    source: &assets_source file://assets_test.lua
    method: run
    modules: &assets_modules [contract, fs, funcs, security, sql, uuid, base64, time, json]
    imports: &assets_imports
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      records: kickside.uploads.persist:upload_record_repo
      upload_types: kickside.uploads:types
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      asset_file_repo: kickside.mail.persist:asset_file_repo
      attachments: kickside.mail.command:attachments
      content: kickside.mail.read:content
      prune: kickside.core.retention:prune
      asset_interleave: app.mail_library:asset_interleave
  - name: asset_expiry_test
    kind: function.lua
    meta: { type: test, suite: mail_asset_expiry }
    source: *assets_source
    method: expiry
    modules: *assets_modules
    imports: *assets_imports
  - name: append_fault
    kind: library.lua
    source: file://append_fault.lua
    modules: [ctx]
    imports:
      threads: kickside.mail.command:threads
      asset_interleave: app.mail_library:asset_interleave
  - name: asset_interleave
    kind: library.lua
    source: file://asset_interleave.lua
    modules: [ctx]
    imports:
      database: kickside.mail.persist:db
      fixtures: app.mail_library:fixtures
  - name: source_fault
    kind: library.lua
    source: file://source_fault.lua
    imports:
      thread_events: kickside.mail.read:thread_events
      asset_interleave: app.mail_library:asset_interleave
  - name: reap_fault
    kind: library.lua
    source: file://reap_fault.lua
    imports:
      uploads: kickside.mail.command:uploads
      asset_interleave: app.mail_library:asset_interleave
  - name: projection_fault
    kind: library.lua
    source: file://projection_fault.lua
    modules: [registry, time]
    imports:
      live: kickside.mail.render:live
      database: kickside.mail.persist:db
  - name: service_content
    kind: function.lua
    source: *assets_source
    method: service_content
    modules: *assets_modules
    imports: *assets_imports
    security:
      actor: {id: "system:kickside.mail.retention"}
      groups: [kickside.mail.security:asset_service]
      policies:
        - kickside.mail.security:asset_provider_calls
        - kickside.mail.security:mail_db
  - name: service_content_call
    kind: security.policy
    groups: [app.mail_api:editor]
    policy:
      resources: [app.mail_library:service_content]
      actions: [funcs.call]
      effect: allow
  - name: acl_test
    kind: function.lua
    meta: { type: test, suite: mail_library_acl }
    source: file://acl_test.lua
    method: run
    modules: [funcs, security, sql, uuid]
    imports:
      autoinit: kickside.component:autoinit
      fixtures: app.mail_library:fixtures
      test: wippy.test:test
  - name: projection_test
    kind: function.lua
    meta: {type: test, suite: mail_library_projection}
    source: file://projection_test.lua
    method: run
    modules: [contract, fs, funcs, json, security, sql, time, uuid]
    imports:
      events: kickside.mail.domain:events
      resource: kickside.mail.domain:resource
      originals: kickside.mail.render:originals
      autoinit: kickside.component:autoinit
      test: wippy.test:test
  - name: projection_editor_context
    kind: security.policy
    policy:
      resources: "*"
      actions: [contract.security, funcs.security]
      effect: allow
  - name: projection_editor_notifications
    kind: security.policy
    policy:
      resources: [kickside.core.retention:notify, kickside.core.threads:emit_update, kickside.core.threads:cursor_waiter_signal, kickside.core.jobs.persist:pool_nudge]
      actions: [funcs.call]
      effect: allow
  - name: binding_declaration_test
    kind: function.lua
    meta: {type: test, suite: mail_library_projection_wiring}
    source: file://binding_declaration_test.lua
    method: run
    modules: [registry]
    imports: {test: wippy.test:test, resource: kickside.mail.domain:resource}
