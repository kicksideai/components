version: "1.0"
namespace: app.mail_library
entries:
  - name: site_url_storage
    kind: env.storage.static
    values: {PUBLIC_API_URL: "https://example.org"}
  - name: site_url
    kind: env.variable
    variable: PUBLIC_API_URL
    storage: app.mail_library:site_url_storage
  - name: fixtures
    kind: library.lua
    source: file://fixtures.lua
    modules: [funcs]
    imports:
      database: kickside.mail.outbox:database
      store: kickside.mail.library:store
  - name: library_test
    kind: function.lua
    meta: { type: test, suite: mail_library }
    source: file://library_test.lua
    method: run
    modules: [funcs, registry, templates, security]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      jet: kickside.mail.library:jet
  - name: draft_render
    kind: library.lua
    source: file://draft_render.lua
    modules: [ctx]
    imports:
      render: kickside.mail.views:render
      types: kickside.mail:types
  - name: draft_workspace_test
    kind: function.lua
    meta: { type: test, suite: mail_draft_workspace }
    source: file://draft_workspace_test.lua
    method: run
    modules: [funcs, registry, security, time]
    imports:
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
  - name: assets_test
    kind: function.lua
    meta: { type: test, suite: mail_assets }
    source: &assets_source file://assets_test.lua
    method: run
    modules: &assets_modules [fs, funcs, security, sql, uuid, base64, time, json]
    imports: &assets_imports
      test: wippy.test:test
      fixtures: app.mail_library:fixtures
      records: kickside.uploads.persist:upload_record_repo
      upload_types: kickside.uploads:types
      lookup: kickside.uploads.persist:upload_query_repo
      settings: app.mail_api:fixtures
      asset_store: kickside.mail.library:asset_store
      attachments: kickside.mail.service:attachments
  - name: asset_expiry_test
    kind: function.lua
    meta: { type: test, suite: mail_asset_expiry }
    source: *assets_source
    method: expiry
    modules: *assets_modules
    imports: *assets_imports
