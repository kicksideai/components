version: "1.0"
namespace: app.mail_api
entries:
  - name: fixtures
    kind: library.lua
    source: file://fixtures.lua
    modules: [contract, funcs, security, sql, uuid]
  - name: api_test
    kind: function.lua
    meta: { type: test, suite: mail_api }
    source: file://api_test.lua
    method: run
    modules: [contract, funcs, http_client, json, registry, security, sql, system, time, uuid]
    imports:
      test: wippy.test:test
      library_fixtures: app.mail_library:fixtures
      autoinit: kickside.component:autoinit
      fixtures: app.mail_api:fixtures
  - name: sender
    kind: security.scope
  - name: module_only
    kind: security.scope
  - name: module_only_composition
    kind: registry.entry
    meta: {type: kickside.security.group_composition}
    group_id: app.mail_api:module_only
    policies: [kickside.mail.security:module_access]
  - name: outside
    kind: security.scope
  - name: outside_policy
    kind: security.policy
    groups: [app.mail_api:outside]
    policy:
      resources: [app.mail_api:outside]
      actions: [registry.get]
      effect: allow
  - name: sender_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:sender
    policies:
      - kickside.mail.security:send_access
      - kickside.mail.security:module_runtime
      - kickside.mail.security:member_endpoints
  - name: bundled_template_catalog
    kind: security.policy
    policy:
      resources: [app.templates:reminder_template]
      actions: [registry.get, registry.find]
      effect: allow
  - name: editor
    kind: security.scope
  - name: editor_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:editor
    policies:
      - app.mail_api:bundled_template_catalog
      - kickside.mail.security:library_access
      - kickside.mail.security:library_runtime
      - kickside.mail.security:library_endpoints
      - kickside.mail.security:module_runtime
      - kickside.mail.security:member_endpoints
  - name: editor_sender
    kind: security.scope
  - name: editor_sender_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:editor_sender
    policies:
      - kickside.mail.security:library_access
      - kickside.mail.security:library_runtime
      - kickside.mail.security:library_endpoints
      - kickside.mail.security:module_runtime
      - kickside.mail.security:member_endpoints
      - kickside.mail.security:send_access
  - name: log_reader
    kind: security.scope
  - name: log_reader_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:log_reader
    policies: [kickside.mail.security:log_admin]
  - name: library_capability_only
    kind: security.scope
  - name: library_capability_only_composition
    kind: registry.entry
    meta: {type: kickside.security.group_composition}
    group_id: app.mail_api:library_capability_only
    policies: [kickside.mail.security:library_access]
  - name: driver_only
    kind: security.scope
  - name: driver_only_composition
    kind: registry.entry
    meta: {type: kickside.security.group_composition}
    group_id: app.mail_api:driver_only
    policies: [kickside.mail.security:driver_admin]
  - name: delivery
    kind: security.scope
  - name: delivery_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:delivery
    policies:
      - kickside.mail.security:driver_admin
      - kickside.mail.security:log_admin
      - kickside.mail.security:delivery_endpoints
      - kickside.mail.security:module_runtime
      - kickside.mail.security:member_endpoints
  - name: delivery_sender
    kind: security.scope
  - name: delivery_sender_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:delivery_sender
    policies:
      - kickside.mail.security:driver_admin
      - kickside.mail.security:log_admin
      - kickside.mail.security:delivery_endpoints
      - kickside.mail.security:module_runtime
      - kickside.mail.security:member_endpoints
      - kickside.mail.security:send_access
  - name: settings_admin
    kind: security.scope
  - name: settings_admin_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: app.mail_api:settings_admin
    policies:
      - app.mail_api:settings_admin_access
      - app.mail_api:settings_list_call
      - kickside.settings.security:module_runtime
  - name: settings_list_call
    kind: security.policy
    policy:
      resources: [list]
      actions: [contract.call]
      effect: allow
  - name: settings_admin_access
    kind: security.policy
    policy:
      resources: [kickside.settings.api:list_blocks.endpoint, kickside.settings.api:list_settings.endpoint]
      actions: [access]
      effect: allow
