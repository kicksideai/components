version: "1.0"
workspace:
  replacements:
    kickside/mail: ..
    kickside/automation: ../../../kickside/platform/automation
    kickside/workflows: ../../../kickside/platform/workflows
    kickside/blocks: ../../../kickside/platform/blocks
    kickside/component: ../../../kickside/core/component
    kickside/contract: ../../../kickside/core/contract
    kickside/core: ../../../kickside/core/core
    kickside/execution: ../../../kickside/core/execution
    kickside/jobs: ../../../kickside/core/jobs
    kickside/realtime-dispatch: ../../../kickside/core/realtime-dispatch
    kickside/security: ../../../kickside/platform/security
    kickside/settings: ../../../kickside/platform/settings
    kickside/uploads: ../../../kickside/platform/uploads
    kickside/users: ../../../kickside/platform/users
    kickside/doc2md: ../../../converters/doc2md
override:
  kickside.mail.binding:library:meta.provision.grants:
    - {subject_id: "system:kickside.mail.retention", subject_type: user, access_mask: 1}
    - {subject_id: "wippy.test:runner", subject_type: user, access_mask: 3}
    - {subject_id: "app:mail_editors", subject_type: group, access_mask: 3}
  kickside.mail.command:library:modules: [security]
  kickside.mail.command:library:imports.time: kickside.mail.harness:owner_clock
  kickside.mail.command:library:imports.live: app.mail_library:projection_fault
  kickside.mail.command:library:imports.database: app.mail_library:projection_database
  kickside.mail.command:preview:modules: [security, uuid]
  kickside.mail.command:preview:imports.time: kickside.mail.harness:owner_clock
  kickside.mail.render:scratch:imports.render: app.mail_library:draft_render
  kickside.mail.security:send_access:groups: [app:mail_senders]
  kickside.core.jobs:policy:meta.proc.max_execution: 3s
  kickside.core.jobs:lease_release_signal:imports.hint: kickside.mail.harness:lease_hint
  kickside.core.jobs:lease_release_signal:source: 'return require("hint")'
  kickside.mail.jobs:owner:modules: []
  kickside.mail.jobs:owner:imports.time: kickside.mail.harness:owner_clock
  kickside.mail.service:delivery:modules: [json, base64, time]
  kickside.mail.service:delivery:imports.http_client: kickside.mail.harness:http_client
vars:
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_mail
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
registry:
  dispatch_internal_kinds:
    - registry.entry
    - ns.requirement
    - ns.dependency
    - ns.definition
    - security.scope
