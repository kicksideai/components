version: "1.0"
namespace: kickside.mail.library
entries:
  - name: asset_store
    kind: library.lua
    source: file://asset_store.lua
    modules: [time, funcs]
    imports:
      types: kickside.mail:types
      database: kickside.mail.persist:db
      content: kickside.mail.read:content
      asset_file_repo: kickside.mail.persist:asset_file_repo
  - name: store
    kind: library.lua
    source: file://store.lua
    imports:
      types: kickside.mail:types
      library_reader: kickside.mail.persist:library_reader
      library_repo: kickside.mail.persist:library_repo
      reference_repo: kickside.mail.persist:reference_repo
      references: kickside.mail.domain:references
      library: kickside.mail.read:library
      asset_store: kickside.mail.library:asset_store
  - name: resources
    kind: library.lua
    source: file://resources.lua
    imports:
      types: kickside.mail:types
      resource: kickside.mail.domain:resource
      library: kickside.mail.read:library
  - name: preview_id
    kind: library.lua
    source: file://preview_id.lua
    modules: [crypto, env]
    imports:
      types: kickside.mail:types
      canonical_json: kickside.contract:canonical_json
      secret_cipher: kickside.contract:secret_cipher
      resources: kickside.mail.library:resources
  - name: edits
    kind: library.lua
    source: file://edits.lua
    imports:
      types: kickside.mail:types
      resources: kickside.mail.library:resources
      store: kickside.mail.library:store
      live: kickside.mail.render:live
  - name: list
    kind: function.lua
    method: list
    source: &read_source file://queries.lua
    imports: &read_imports
      library: kickside.mail.read:library
    security: &read_security
      policies:
        - kickside.mail.security:library_component_read
        - kickside.mail.security:library_component_registry
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
  - name: get
    kind: function.lua
    method: get
    source: *read_source
    imports: *read_imports
    security:
      policies:
        - kickside.mail.security:library_component_read
        - kickside.mail.security:library_component_registry
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:settings_read
        - kickside.mail.security:settings_admin_read
  - name: asset_content
    kind: function.lua
    method: asset_content
    source: *read_source
    imports: *read_imports
    security:
      policies:
        - kickside.mail.security:library_component_read
        - kickside.mail.security:library_component_registry
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:asset_bytes
  - name: list_page
    kind: function.lua
    method: list_page
    source: *read_source
    imports: *read_imports
    security:
      policies:
        - kickside.mail.security:library_component_read
        - kickside.mail.security:library_component_registry
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:settings_read
        - kickside.mail.security:settings_admin_read
  - name: create
    kind: function.lua
    method: create
    source: &service_source file://service.lua
    modules: &service_modules [security, time, uuid, funcs, logger]
    imports: &service_imports
      types: kickside.mail:types
      client: kickside.mail:client
      database: kickside.mail.persist:db
      resources: kickside.mail.library:resources
      store: kickside.mail.library:store
      edits: kickside.mail.library:edits
      live: kickside.mail.render:live
      originals: kickside.mail.render:originals
      scratch: kickside.mail.render:scratch
      globals: kickside.mail.render:globals
      settings: kickside.mail.read:settings
      realtime: kickside.mail:realtime
      preview_id: kickside.mail.library:preview_id
      content: kickside.mail.read:content
      asset_refs: kickside.mail.domain:assets
      asset_store: kickside.mail.library:asset_store
      notifier: kickside.core.retention:notifier
      error_envelope: kickside.contract:error_envelope
    security: &bound_write_security
      policies:
        - &realtime_calls kickside.mail.security:realtime_calls
        - &realtime_topics kickside.mail.security:realtime_topics
        - &outbox_db kickside.mail.security:outbox_db
        - &outbox_config kickside.mail.security:outbox_config
        - &template_access kickside.mail.security:template_access
        - &site_url kickside.mail.security:site_url
        - &settings_read kickside.mail.security:settings_read
        - &overlay_owner kickside.mail.security:overlay_owner
        - &overlay_projection kickside.mail.security:overlay_projection
        - &overlay_originals kickside.mail.security:overlay_originals
        - &overlay_drafts kickside.mail.security:overlay_drafts
        - kickside.settings:reader_secrets
        - &asset_adopt kickside.mail.security:asset_adoption
        - &asset_adopt_action kickside.mail.security:asset_adoption_action
        - &asset_notify kickside.core.retention:notify_access
  - name: history
    kind: function.lua
    method: history
    source: *read_source
    imports: *read_imports
    security: *read_security
  - name: restore
    kind: function.lua
    method: restore
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: &write_security
      policies:
        - *realtime_calls
        - *realtime_topics
        - *outbox_db
        - *outbox_config
        - *template_access
        - *site_url
        - *settings_read
        - *overlay_owner
        - *overlay_projection
        - *overlay_originals
        - *overlay_drafts
        - *asset_adopt
        - *asset_adopt_action
        - *asset_notify
  - name: asset_add
    kind: function.lua
    method: asset_add
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: save
    kind: function.lua
    method: save
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *bound_write_security
  - name: update
    kind: function.lua
    method: update
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: set_base
    kind: function.lua
    method: set_base
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: reset
    kind: function.lua
    method: reset
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: delete
    kind: function.lua
    method: delete
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: render_draft
    kind: function.lua
    method: render_draft
    source: &draft_preview_source file://draft_preview.lua
    modules: &draft_preview_modules [security, time]
    imports: &draft_preview_imports
      types: kickside.mail:types
      client: kickside.mail:client
      database: kickside.mail.persist:db
      resources: kickside.mail.library:resources
      store: kickside.mail.library:store
      edits: kickside.mail.library:edits
      scratch: kickside.mail.render:scratch
      render: kickside.mail.render:render
      live_preview: kickside.mail.read:preview
      vars: kickside.mail.domain:vars
      globals: kickside.mail.render:globals
      settings: kickside.mail.read:settings
      preview_id: kickside.mail.library:preview_id
      message: kickside.mail.domain:message
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
        - kickside.mail.security:asset_bytes
  - name: preview_edits
    kind: function.lua
    method: preview_edits
    source: *draft_preview_source
    modules: *draft_preview_modules
    imports: *draft_preview_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
        - kickside.settings:reader_secrets
        - kickside.mail.security:asset_bytes
  - name: render
    kind: function.lua
    method: render
    source: *draft_preview_source
    modules: *draft_preview_modules
    imports: *draft_preview_imports
    security:
      policies:
        - kickside.mail.security:library_component_read
        - kickside.mail.security:library_component_registry
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:asset_bytes
  - name: reconcile
    kind: function.lua
    meta:
      private: true
      type: bootloader
      requires: [wippy.migration:migration_bootloader]
      order: 35
    source: *service_source
    method: boot
    modules: *service_modules
    imports: *service_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_projection
        - kickside.mail.security:overlay_originals
        - kickside.mail.security:overlay_drafts
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
