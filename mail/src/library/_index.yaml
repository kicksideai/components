version: "1.0"
namespace: kickside.mail.library
entries:
  - name: asset_refs
    kind: library.lua
    source: file://asset_refs.lua
    imports: { types: kickside.mail:types }
  - name: read_asset_file
    kind: function.lua
    meta: { private: true }
    source: file://asset_file.lua
    method: read
    modules: [registry, fs]
    imports:
      types: kickside.mail:types
      asset_refs: kickside.mail.library:asset_refs
      asset_store: kickside.mail.library:asset_store
      attachments: kickside.mail.service:attachments
    security:
      actor: { id: system:kickside.mail.retention }
      policies:
        - kickside.mail.security:packaged_assets
        - kickside.mail.security:adopted_asset_content
        - kickside.uploads.security:uploads_resource_access
        - kickside.mail.security:outbox_db
  - name: jet
    kind: library.lua
    source: file://jet.lua
    imports: { types: kickside.mail:types }
  - name: asset_store
    kind: library.lua
    source: file://asset_store.lua
    modules: [sql, time, funcs]
    imports:
      types: kickside.mail:types
      database: kickside.mail.outbox:database
      autoinit: kickside.component:autoinit
  - name: store
    kind: library.lua
    source: file://store.lua
    modules: [json, sql]
    imports:
      types: kickside.mail:types
      database: kickside.mail.outbox:database
      canonical_json: kickside.contract:canonical_json
      asset_store: kickside.mail.library:asset_store
  - name: resources
    kind: library.lua
    source: file://resources.lua
    modules: [registry, sql]
    imports:
      types: kickside.mail:types
      database: kickside.mail.outbox:database
      canonical_json: kickside.contract:canonical_json
      store: kickside.mail.library:store
      jet: kickside.mail.library:jet
  - name: projection
    kind: library.lua
    source: &projection_source file://projection.lua
    modules: &projection_modules [registry, security, sql]
    imports: &projection_imports
      types: kickside.mail:types
      database: kickside.mail.outbox:database
      store: kickside.mail.library:store
      resources: kickside.mail.library:resources
      jet: kickside.mail.library:jet
  - name: reconcile
    kind: function.lua
    meta:
      private: true
      type: bootloader
      requires: [wippy.migration:migration_bootloader]
      order: 35
    source: *projection_source
    method: boot
    modules: *projection_modules
    imports: *projection_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_projection
        - kickside.mail.security:overlay_originals
        - kickside.mail.security:overlay_drafts
  - name: draft
    kind: library.lua
    source: file://draft.lua
    modules: [registry]
    imports:
      types: kickside.mail:types
      jet: kickside.mail.library:jet
      resources: kickside.mail.library:resources
      render: kickside.mail.views:render
      globals: kickside.mail.views:globals
      asset_refs: kickside.mail.library:asset_refs
      catalog: kickside.mail.views:catalog
      error_envelope: kickside.contract:error_envelope
  - name: preview_id
    kind: library.lua
    source: file://preview_id.lua
    modules: [crypto, env]
    imports:
      types: kickside.mail:types
      canonical_json: kickside.contract:canonical_json
      secret_cipher: kickside.contract:secret_cipher
      resources: kickside.mail.library:resources
  - name: list
    kind: function.lua
    method: list
    source: &service_source file://service.lua
    modules: &service_modules [security, sql, time, uuid, funcs, logger]
    imports: &service_imports
      types: kickside.mail:types
      client: kickside.mail:client
      database: kickside.mail.outbox:database
      resources: kickside.mail.library:resources
      store: kickside.mail.library:store
      projection: kickside.mail.library:projection
      draft: kickside.mail.library:draft
      render: kickside.mail.views:render
      globals: kickside.mail.views:globals
      outbox: kickside.mail.outbox:store
      settings: kickside.mail:settings
      policy: kickside.mail.outbox:policy
      realtime: kickside.mail:realtime
      keyset: kickside.contract:keyset
      preview_id: kickside.mail.library:preview_id
      attachments: kickside.mail.service:attachments
      message: kickside.mail:message
      asset_refs: kickside.mail.library:asset_refs
      asset_store: kickside.mail.library:asset_store
      notifier: kickside.core.retention:notifier
    security: &read_security
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
  - name: get
    kind: function.lua
    method: get
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: &usage_security
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:settings_admin_read
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
  - name: list_page
    kind: function.lua
    method: list_page
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *usage_security
  - name: render
    kind: function.lua
    method: render
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:asset_bytes
  - name: create
    kind: function.lua
    method: create
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: &bound_write_security
      policies:
        - &realtime_calls kickside.mail.security:realtime_calls
        - &realtime_topics kickside.mail.security:realtime_topics
        - &outbox_db kickside.mail.security:outbox_db
        - &outbox_config kickside.mail.security:outbox_config
        - &template_access kickside.mail.security:template_access
        - &site_url kickside.mail.security:site_url
        - &settings_read kickside.mail.security:settings_read
        - &overlay_owner kickside.mail.security:overlay_owner
        - &overlay_projection kickside.mail.security:overlay_projection
        - &overlay_originals kickside.mail.security:overlay_originals
        - &overlay_drafts kickside.mail.security:overlay_drafts
        - kickside.settings:reader_secrets
        - &asset_adopt kickside.mail.security:asset_adoption
        - &asset_adopt_action kickside.mail.security:asset_adoption_action
        - &asset_content kickside.mail.security:adopted_asset_content
        - &asset_notify kickside.core.retention:notify_access
  - name: history
    kind: function.lua
    method: history
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *read_security
  - name: restore
    kind: function.lua
    method: restore
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: &write_security
      policies:
        - *realtime_calls
        - *realtime_topics
        - *outbox_db
        - *outbox_config
        - *template_access
        - *site_url
        - *settings_read
        - *overlay_owner
        - *overlay_projection
        - *overlay_originals
        - *overlay_drafts
        - *asset_adopt
        - *asset_adopt_action
        - *asset_content
        - *asset_notify
  - name: asset_add
    kind: function.lua
    method: asset_add
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: save
    kind: function.lua
    method: save
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *bound_write_security
  - name: update
    kind: function.lua
    method: update
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: set_base
    kind: function.lua
    method: set_base
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: reset
    kind: function.lua
    method: reset
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: delete
    kind: function.lua
    method: delete
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security: *write_security
  - name: render_draft
    kind: function.lua
    method: render_draft
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
        - kickside.mail.security:asset_bytes
  - name: preview_edits
    kind: function.lua
    method: preview_edits
    source: *service_source
    modules: *service_modules
    imports: *service_imports
    security:
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
        - kickside.settings:reader_secrets
        - kickside.mail.security:asset_bytes
