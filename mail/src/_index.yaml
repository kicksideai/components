version: "1.0"
namespace: kickside.mail
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: Mail }
  - name: dep.component
    kind: ns.dependency
    version: "*"
    component: kickside/component
  - name: dep.core
    kind: ns.dependency
    version: "*"
    component: kickside/core
  - name: dep.views
    kind: ns.dependency
    version: "*"
    component: wippy/views
  - name: dep.settings
    kind: ns.dependency
    version: "*"
    component: kickside/settings
  - name: dep.contract
    kind: ns.dependency
    version: "*"
    component: kickside/contract
  - name: dep.uploads
    kind: ns.dependency
    version: "*"
    component: kickside/uploads
  - name: dep.jobs
    kind: ns.dependency
    version: "*"
    component: kickside/jobs
  - name: dep.execution
    kind: ns.dependency
    version: "*"
    component: kickside/execution
  - name: target_db
    kind: ns.requirement
    meta: { value_kind: db.sql, comment: The SQL database configured for Jobs. }
    targets:
      - { entry: kickside.mail:db_config, path: ".meta.db_id" }
      - { entry: kickside.mail.migrations:01_mail, path: ".meta.target_db" }
      - { entry: kickside.mail.security:outbox_db, path: ".policy.resources" }
  - name: library_editor_grant
    kind: ns.requirement
    meta:
      value_type: object
      comment: Structured component WRITE grant for the host's Mail library editors.
    targets:
      - {entry: kickside.mail.binding:library, path: ".meta.provision.grants +="}
  - name: api_router
    kind: ns.requirement
    meta: { value_kind: http.router, comment: Authenticated router for the Mail administration API. }
    targets:
      - { entry: kickside.mail.api:capabilities.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_list.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_get.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_asset_content.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_create.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_update.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_save.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_set_base.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_reset.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_delete.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_history.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_restore.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_preview.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:library_send_test.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:activity_list.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:activity_get.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:activity_resend.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:delivery_drivers.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:delivery_status.endpoint, path: ".meta.router" }
      - { entry: kickside.mail.api:delivery_send_test.endpoint, path: ".meta.router" }
  - name: db_config
    kind: registry.entry
    meta: { private: true, db_id: "" }
  - name: types
    kind: library.lua
    source: file://types.lua
    modules: [sql]
  - name: realtime
    kind: library.lua
    source: file://realtime.lua
    modules: [contract, logger]
    imports: { types: kickside.mail:types }
  - name: client
    kind: library.lua
    source: file://client.lua
    modules: [contract, security]
    imports: { types: kickside.mail:types }
  - name: settings
    kind: library.lua
    source: file://settings.lua
    modules: [contract, registry, env, security]
    imports: { types: kickside.mail:types, config: kickside.mail.domain:config }
  - name: drivers_registry
    kind: library.lua
    source: file://drivers_registry.lua
    modules: [registry, contract, funcs]
    imports: { settings: kickside.mail:settings, types: kickside.mail:types, config: kickside.mail.domain:config }
  - name: mailer
    kind: contract.definition
    meta: { title: Mailer }
    methods:
      - name: send
        description: Queue delivery from the installation's configured address using a named template or a supplied body.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/send.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/send.output.json
      - name: resend
        description: Queue a new delivery from the retained content of a visible failed message.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/get_message.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/send.output.json
      - name: get_message
        description: Read one visible delivery log entry. Provider fields require mail.log.admin.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/get_message.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/get_message.output.json
      - name: list_messages
        description: List visible delivery log entries in descending creation order. Provider fields require mail.log.admin.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/list_messages.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/list_messages.output.json
      - name: list_templates
        description: List mail library messages and their variable schemas.
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/list_templates.output.json
      - name: get_template
        description: Read a mail library message's description, variable schema, samples, and Jet names.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/get_template.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/get_template.output.json
      - name: preview
        description: Render a mail library message without delivering it.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/preview.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/preview.output.json
  - name: mailer_binding
    kind: contract.binding
    contracts:
      - contract: kickside.mail:mailer
        default: true
        methods:
          send: kickside.mail.service:send
          resend: kickside.mail.service:resend
          get_message: kickside.mail.outbox:get_message
          list_messages: kickside.mail.outbox:list_messages
          list_templates: kickside.mail.service:list_templates
          get_template: kickside.mail.service:get_template
          preview: kickside.mail.service:preview
  - name: transport
    kind: contract.definition
    meta: { comment: Internal delivery protocol for registered mail drivers. }
    methods:
      - name: send
        description: Deliver one rendered message with the configured sender identity.
        input_schemas:
          - format: application/schema+json
            definition: file://schemas/transport.input.json
        output_schemas:
          - format: application/schema+json
            definition: file://schemas/transport.output.json
