version: "1.0"
namespace: kickside.mail.jobs
entries:
  - name: owner
    kind: function.lua
    meta: { private: true, type: kickside.retention.owner }
    source: file://owner.lua
    method: run
    modules: [time]
    imports:
      config: kickside.mail.domain:config
      policy: kickside.mail.domain:policy
      retention: kickside.mail.command:retention
      settings: kickside.mail.read:settings
      types: kickside.mail:types
    security:
      actor: { id: "system:kickside.mail.retention" }
      policies:
        - kickside.mail.security:realtime_calls
        - kickside.mail.security:realtime_topics
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:settings_read
        - kickside.mail.security:library_retention_threads
        - kickside.mail.security:library_threads_caller
        - kickside.mail.security:library_thread_config
        - kickside.mail.security:library_prune_boundary
        - kickside.mail.security:asset_reap_call
        - kickside.mail.security:asset_reap_action
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:overlay_drafts
        - kickside.uploads.security:uploads_resource_access
  - name: library_sync
    kind: function.lua
    meta: {private: true, type: kickside.core.jobs.worker}
    source: file://library_sync.lua
    method: run
    imports:
      live: kickside.mail.command:live
      notify: kickside.mail.command:notify
    security:
      actor: {id: "system:kickside.mail.library"}
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:live_sets
        - kickside.mail.security:live_entries
        - kickside.mail.security:live_marker_write
        - kickside.mail.security:overlay_originals
        - kickside.mail.security:realtime_calls
        - kickside.mail.security:realtime_topics
        - kickside.core.retention:notify_access
  - name: reconcile
    kind: function.lua
    meta:
      private: true
      type: bootloader
      requires: [wippy.migration:migration_bootloader]
      order: 35
    source: file://reconcile.lua
    method: boot
    imports:
      live: kickside.mail.command:live
      scratch: kickside.mail.render:scratch
    security:
      actor: { id: "system:kickside.mail.library" }
      policies:
        - kickside.mail.security:outbox_db
        - kickside.mail.security:outbox_config
        - kickside.mail.security:template_access
        - kickside.mail.security:overlay_owner
        - kickside.mail.security:live_sets
        - kickside.mail.security:live_entries
        - kickside.mail.security:live_marker_write
        - kickside.mail.security:realtime_calls
        - kickside.mail.security:realtime_topics
        - kickside.mail.security:overlay_originals
        - kickside.mail.security:overlay_drafts
        - kickside.mail.security:site_url
        - kickside.mail.security:settings_read
