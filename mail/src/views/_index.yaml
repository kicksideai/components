version: "1.0"
namespace: kickside.mail.views
entries:
  - name: templates
    kind: template.set
    engine: { escape: html }
  - name: text_templates
    kind: template.set
    engine: { escape: none }
  - name: layout
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "base/standard" }
    source: file://layout.jet
  - name: layout.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "base/standard" }
    source: file://layout.text.jet
  - name: plain
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "base/plain" }
    source: file://plain.jet
  - name: plain.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "base/plain" }
    source: file://plain.text.jet
  - name: header
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "part/header" }
    source: file://header.jet
  - name: header.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "part/header" }
    source: file://header.text.jet
  - name: footer
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "part/footer" }
    source: file://footer.jet
  - name: footer.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "part/footer" }
    source: file://footer.text.jet
  - name: preheader
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "part/preheader" }
    source: file://preheader.jet
  - name: preheader.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "part/preheader" }
    source: file://preheader.text.jet
  - name: button
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "part/button" }
    source: file://button.jet
  - name: button.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "part/button" }
    source: file://button.text.jet
  - name: details
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "part/details" }
    source: file://details.jet
  - name: details.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "part/details" }
    source: file://details.text.jet
  - name: notice
    kind: template.jet
    set: kickside.mail.views:templates
    meta: { name: "message/notice" }
    source: file://notice.jet
  - name: notice.subject
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "message/notice.subject" }
    source: |-
      {{ subject }}
  - name: notice.text
    kind: template.jet
    set: kickside.mail.views:text_templates
    meta: { name: "message/notice" }
    source: file://notice.text.jet
  - name: notice_template
    kind: registry.entry
    meta: { type: "kickside.mail:template" }
    template:
      name: notice
      title: Notice
      description: Send a notice with optional details, a link, and an inline image.
      parts: { subject: message/notice.subject, html: message/notice, text: message/notice }
      variable_schema:
        type: object
        additionalProperties: false
        required: [subject]
        properties:
          subject: { type: string, description: Email subject. }
          preheader: { type: string, description: Text shown in an inbox preview. }
          heading: { type: string, description: Heading in the message body. }
          message: { type: string, description: Opening message. }
          paragraphs:
            type: array
            description: Additional paragraphs.
            items: { type: string }
          action_url: { type: string, description: HTTP or HTTPS address for the action link. }
          action_label: { type: string, description: Text for the action link. }
          inline_content_id: { type: string, description: Content ID of an inline attachment. }
          image_alt: { type: string, description: Alternative text for the inline image. }
          details:
            type: array
            description: Labeled details to include in the message.
            items:
              type: object
              additionalProperties: false
              required: [key, value]
              properties:
                key: { type: string, description: Label. }
                value: { type: string, description: Detail to display. }
      sample: { subject: Activity report ready, message: Your activity report is ready to review. }
  - name: catalog
    kind: library.lua
    source: file://catalog.lua
    modules: [registry, json]
    imports:
      types: kickside.mail:types
      canonical_json: kickside.contract:canonical_json
      error_envelope: kickside.contract:error_envelope
  - name: render
    kind: library.lua
    source: file://render.lua
    modules: [templates, html]
    imports:
      types: kickside.mail:types
      catalog: kickside.mail.views:catalog
      message: kickside.mail:message
      globals: kickside.mail.views:globals
      error_envelope: kickside.contract:error_envelope
  - name: globals
    kind: library.lua
    source: file://globals.lua
    modules: [env, registry, security]
    imports: { types: kickside.mail:types }
