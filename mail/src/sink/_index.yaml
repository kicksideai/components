version: "1.0"
namespace: kickside.mail.sink
entries:
  - name: write
    kind: function.lua
    source: file://write.lua
    method: write
    imports:
      types: kickside.mail:types
      client: kickside.mail:client
      writable_sink: kickside.data:writable_sink
  - name: writable
    kind: contract.binding
    meta: { title: Send email, delivery: at_least_once, input_shape: record }
    contracts:
      - contract: kickside.data:writable
        methods: { write: "kickside.mail.sink:write" }
