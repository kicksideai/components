version: '1.0'
namespace: kickside.storage_s3.security
entries:
- name: cloud
  kind: security.policy
  groups: []
  policy:
    resources:
    - kickside.storage_s3.runtime:*
    actions:
    - cloudstorage.get
    effect: allow
- name: filesystem
  kind: security.policy
  groups: []
  policy:
    resources: ''
    actions:
    - fs.get
    effect: allow
- name: runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.storage_s3:*
    - kickside.storage_s3.*:*
    - kickside.uploads.env:database_resource
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - funcs.call
    - funcs.security
    - fs.get
    - cloudstorage.get
    - env.get
    effect: allow
- name: module_access
  kind: security.policy
  meta:
    title: S3 storage
    surface: kickside.storage_s3
    intent: module_access
    includes:
    - kickside.storage_s3.security:runtime
    - kickside.storage_s3.security:cloud
    - kickside.storage_s3.security:filesystem
  groups: []
  policy:
    resources:
    - kickside.storage_s3:settings_view
    - kickside.storage_s3:ui_static
    - kickside.storage_s3.api:inspect.endpoint
    - kickside.storage_s3.api:test.endpoint
    - kickside.storage_s3.api:configure.endpoint
    - kickside.storage_s3.api:reset.endpoint
    actions:
    - access
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Members allowed to discover and use the installed S3 extension; configuration handlers independently
      require Settings administration.
  targets:
  - entry: kickside.storage_s3.security:module_access
    path: .groups +=
