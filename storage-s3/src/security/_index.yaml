version: '1.0'
namespace: kickside.storage_s3.security
entries:
- name: runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.storage_s3:resources
    - kickside.storage_s3:setting.policy
    - kickside.storage_s3:stage
    - kickside.storage_s3.policy:policy
    - kickside.storage_s3.policy:validate_policy
    - kickside.storage_s3.security:runtime
    - kickside.storage_s3.storage:copy
    - kickside.storage_s3.storage:stage
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - funcs.call
    - funcs.security
    - cloudstorage.get
    effect: allow
- name: module_access
  kind: security.policy
  meta:
    title: S3 storage
    surface: kickside.storage_s3
    intent: module_access
  groups: []
  policy:
    resources:
    - kickside.storage_s3:settings_view
    - kickside.storage_s3:ui_static
    - kickside.storage_s3.api:inspect.endpoint
    - kickside.storage_s3.api:test.endpoint
    - kickside.storage_s3.api:configure.endpoint
    - kickside.storage_s3.api:reset.endpoint
    actions:
    - access
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Members allowed to use the installed S3 extension; configuration handlers independently require Settings administration.
  targets:
  - entry: kickside.storage_s3.security:module_access
    path: .groups +=
