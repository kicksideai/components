version: '1.0'
namespace: app
entries:
- name: dedup_migration_db
  kind: db.sql.sqlite
  file: ':memory:'
  pool:
    max_open: 1
    max_idle: 1
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  meta:
    comment: In-memory database for kickside/uploads.
  file: ${sqlite_path}
- name: other_uploads
  kind: fs.directory
  meta:
    comment: Secondary storage ID for artifact dedupe scope checks.
  directory: ./.wippy/uploads/
  auto_init: true
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: test_scope_policy
  kind: security.policy
  meta:
    comment: Permissive scope the uploads suites run their scoped actors under.
  groups:
  - app:uploads_test
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: component_lifecycle_impl
  kind: ns.requirement
  meta:
    comment: Harness-local component lifecycle implementation; uploads tests run without core threads.
  default: kickside.core.lifecycle:component_lifecycle_impl
  targets:
  - entry: kickside.component:component_lifecycle
    path: .imports.lifecycle_impl
- name: gateway
  kind: http.service
  meta:
    comment: Test HTTP server.
  addr: :0
  lifecycle:
    auto_start: true
- name: api
  kind: http.router
  meta:
    comment: Test API router.
    server: gateway
  prefix: /api
- name: api_public
  kind: http.router
  meta:
    comment: Separate router for wippy/views so its component routes do not collide with KickSide component endpoints.
    server: gateway
  prefix: /public
- name: admit_upload
  kind: function.lua
  meta:
    comment: Executes upload admission under a named test user through the real Users resolver.
  source: file://admit_upload.lua
  imports:
    upload_lib: kickside.uploads:uploads
  method: run
- name: dep.kickside.uploads
  version: '*'
  kind: ns.dependency
  meta:
    comment: KickSide upload API/storage backing the upload package tests.
  component: kickside/uploads
  parameters:
  - name: kickside.uploads:database_resource
    value: app:db
  - name: kickside.uploads:storage_id
    value: app:uploads
  - name: kickside.uploads:env_storage
    value: app:env_storage
  - name: kickside.uploads:api_router
    value: app:api
  - name: kickside.uploads:ui_server
    value: app:gateway
  - name: kickside.uploads.security:user_security_scope
    value: app.security:user
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app:uploads_test
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app:uploads_test
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.retention:user_security_scope
    value: app:test_scope_policy
  - name: kickside.core.threads:user_security_scope
    value: app:test_scope_policy
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
- name: dep.kickside.pdf2image
  kind: ns.dependency
  meta:
    comment: PDF rasterizer converter providing the convert.rasterizer plugin for the rasterize stage tests.
  component: kickside/pdf2image
  version: '*'
- name: dep.kickside.users
  kind: ns.dependency
  component: kickside/users
  version: '*'
  parameters:
  - name: kickside.users:env_storage
    value: app:env_storage
  - name: kickside.users:public_router
    value: app:api_public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app:test_scope_policy
  - name: kickside.users:admin_security_scope
    value: app:test_scope_policy
  - name: kickside.users:login_role_resource
    value: app:*
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
- name: dep.wippy.bootloader
  kind: ns.dependency
  meta:
    comment: Bootloader applies kickside upload migrations.
  component: wippy/bootloader
  version: '*'
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
- name: dep.wippy.views
  kind: ns.dependency
  meta:
    comment: View component registry dependencies for uploads UI packaging tests.
  component: wippy/views
  version: '*'
  parameters:
  - name: api_router
    value: app:api_public
  - name: env_storage
    value: app:env_storage
- name: dep.wippy.session
  kind: ns.dependency
  meta:
    comment: Session contract definitions used by the upload-backed file_provider binding.
  component: wippy/session
  version: '*'
  parameters:
  - name: api_router
    value: app:api
  - name: database_resource
    value: app:db
  - name: default_host
    value: app:processes
  - name: env_storage
    value: app:env_storage
  - name: delegation_func_id
    value: userspace.dataflow.session:delegate
- name: retention_runtime_read
  kind: security.policy
  meta:
    comment: Runtime reads a Core contract call needs, isolating the uploads boundary grant from an allow-all scope.
  policy:
    resources: '*'
    actions:
    - db.get
    - registry.get
    effect: allow
- name: upload_runtime_resources
  kind: security.policy
  policy:
    resources: '*'
    actions:
    - funcs.call
    - registry.get
    - db.get
    - fs.get
    effect: allow
- name: no_actor_creation
  kind: security.policy
  policy:
    resources: '*'
    actions: security.actor.create
    effect: deny
- name: attachment_owner_only
  kind: security.policy
  policy:
    resources: '*'
    actions:
    - view_all
    - security.actor.create
    effect: deny
- name: dep.kickside.realtime
  kind: ns.dependency
  component: kickside/realtime
  version: '*'
  parameters:
  - name: wippy.relay:application_host
    value: app:processes
  - name: wippy.relay:env_storage
    value: app:env_storage
  - name: wippy.relay:user_security_scope
    value: app:test_scope_policy
- name: no_deferred_owner
  kind: security.policy
  policy:
    resources: '*'
    actions: kickside.execution.defer
    effect: deny
- name: dep.member_endpoint_contract
  kind: ns.dependency
  component: kickside/contract
  version: '*'
  parameters:
  - name: kickside.contract.http:user_security_scope
    value: app.security:user
- name: uploads_runtime_base
  kind: security.policy
  policy:
    resources: '*'
    actions:
    - funcs.call
    - funcs.security
    - contract.get
    - contract.open
    - contract.call
    - contract.security
    - db.get
    - registry.get
    - registry.find
    - env.get
    - security.actor.create
    - security.policy.get
    - security.policy_group.get
    effect: allow
- name: dep.kickside.security
  kind: ns.dependency
  component: kickside/security
  version: '*'
  parameters:
  - name: api_router
    value: app:api
  - name: ui_server
    value: app:gateway
  - name: target_db
    value: app:db
  - name: process_host
    value: app:processes
- name: dep.kickside.storage_s3
  kind: ns.dependency
  component: kickside/storage-s3
  version: '*'
  parameters:
  - name: kickside.storage_s3:s3_resource
    value: app.storage_s3:s3
  - name: kickside.storage_s3:api_router
    value: app:api
  - name: kickside.storage_s3:ui_server
    value: app:gateway
- name: uploads
  kind: fs.directory
  directory: ./.wippy/uploads
  auto_init: true
- name: dep.kickside.models
  kind: ns.dependency
  version: '*'
  component: kickside/models
  parameters:
  - name: kickside.models:target_db
    value: app:db
  - name: kickside.models:api_router
    value: app:api
  - name: kickside.models:ui_server
    value: app:gateway
  - name: kickside.models:process_host
    value: app:processes
- name: test_engine_wiki
  kind: registry.entry
  meta:
    type: kickside.kb_engine
    kb_type: wiki
    title: Wiki
    impl_id: test.kb:embeddable
    store_contract: shared:kb_store
    is_graph: true
    projections:
    - kind: knowledge.injection.source
      projection_key: source
      cursor_key: source
      worker_ref: proc://kickside.kb10.injection:source_worker_proc
      input_mode: prefetch_events
      batch_size: 1
      events:
        input:
        - type: kickside.knowledge.events:content.upserted
        - type: kickside.knowledge.events:content.deleted
    default_config:
      chunk_size: 400
      chunk_overlap: 0
      summary_max_chars: 0
- name: limited_user
  kind: security.policy
  meta:
    comment: User-like test scope; broad runtime/app access with a deny layered below for process policy groups.
  groups:
  - kb_limited
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: limited_no_process_scope
  kind: security.policy
  meta:
    comment: Proves user-triggered ingestion does not fetch the privileged process policy group.
  groups:
  - kb_limited
  policy:
    resources: wippy.security:process
    actions: security.policy_group.get
    effect: deny
- name: dep.kickside.knowledge
  kind: ns.dependency
  component: kickside/knowledge
  version: '*'
  parameters:
  - name: kickside.knowledge:api_router
    value: app:api
  - name: kickside.knowledge:ui_server
    value: app:gateway
  - name: kickside.knowledge.security:user_security_scope
    value: app:user
- name: ingest_upload_probe
  kind: function.lua
  source: file://ingest_upload_probe.lua
  method: handler
  imports:
    ingest_upload: kickside.knowledge.api:ingest_upload
- name: fixture_cleanup
  kind: library.lua
  source: file://fixture_cleanup.lua
  modules:
  - sql
  imports:
    component: kickside.component:component
    teardown: kickside.core.threads.persist:teardown
    test: wippy.test:test
