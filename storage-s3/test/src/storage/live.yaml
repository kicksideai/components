version: '1.0'
namespace: app.storage_s3
entries:
- name: os_env
  kind: env.storage.os
- name: prefix
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_PREFIX
  default: native-tests
- name: access_key
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_ACCESS_KEY
  default: storage-test
- name: secret_key
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_SECRET_KEY
  default: storage-test
- name: aws
  kind: config.aws
  region: us-east-1
  access_key_id_env: app.storage_s3:access_key
  secret_access_key_env: app.storage_s3:secret_key
- name: s3
  kind: cloudstorage.s3
  config: app.storage_s3:aws
  bucket: ks-upload-storage
  endpoint: http://127.0.0.1:18333
- name: alternate_s3
  kind: cloudstorage.s3
  config: app.storage_s3:aws
  bucket: ks-upload-storage
  endpoint: http://127.0.0.1:18333
- name: pipeline_artifact_stage
  kind: function.lua
  source: file://pipeline_artifact_stage.lua
  method: process
  imports:
    artifacts: kickside.uploads.persist:artifact_content_repo
- name: types.pipeline_artifact
  kind: registry.entry
  meta:
    type: upload.type
  type_key: pipeline_artifact
  priority: -100
  mime_types:
  - application/x-storage-s3-pipeline-test
  pipeline:
  - func: app.storage_s3:pipeline_artifact_stage
    title: Create derived content
- name: stage_runtime_without_discovery
  kind: security.policy
  policy:
    resources:
    - '*'
    actions:
    - registry.get
    - contract.get
    - contract.open
    - contract.call
    - funcs.call
    - funcs.security
    - env.get
    - db.get
    - fs.get
    - fs.read
    - fs.write
    effect: allow
- name: live_tests
  kind: function.lua
  meta:
    type: test_support
    suite: storage_s3_live
  source: file://live_tests.lua
  method: run
  modules:
  - cloudstorage
  - contract
  - env
  - fs
  - funcs
  - security
  - sql
  - uuid
  security:
    policies:
    - kickside.uploads.security:deferred_owner
    - kickside.uploads.security:deferred_actor
  imports:
    test: wippy.test:test
    records: kickside.uploads.persist:upload_record_repo
    artifacts: kickside.uploads.persist:artifact_content_repo
    pipeline: kickside.uploads:pipeline
    cleanup: kickside.uploads.persist:artifact_cleanup_repo
    execution_identity: kickside.execution:execution_identity
    fixture_cleanup: app:fixture_cleanup
