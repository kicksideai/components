version: '1.0'
namespace: app.storage_s3
entries:
- name: os_env
  kind: env.storage.os
- name: prefix
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_PREFIX
  default: native-tests
- name: access_key
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_ACCESS_KEY
  default: storage-test
- name: secret_key
  kind: env.variable
  storage: app.storage_s3:os_env
  variable: KICKSIDE_UPLOAD_STORAGE_TEST_SECRET_KEY
  default: storage-test
- name: aws
  kind: config.aws
  region: us-east-1
  access_key_id_env: app.storage_s3:access_key
  secret_access_key_env: app.storage_s3:secret_key
- name: s3
  kind: cloudstorage.s3
  config: app.storage_s3:aws
  bucket: ks-upload-storage
  endpoint: http://127.0.0.1:18333
- name: live_tests
  kind: function.lua
  meta:
    type: test_support
    suite: upload_storage_live
  source: file://live_tests.lua
  method: run
  modules:
  - sql
  - fs
  - registry
  - funcs
  - security
  - uuid
  - contract
  - json
  - cloudstorage
  - env
  imports:
    test: wippy.test:test
    policy: kickside.storage_s3.policy:policy
    locations: kickside.storage_s3.persist:locations
    offload: kickside.storage_s3.storage:offload
    records: kickside.uploads.persist:upload_query_repo
    artifacts: kickside.uploads.persist:artifact_parts_repo
    content: kickside.uploads.persist:artifact_content_repo
    jobs: kickside.core.jobs:jobs
    lifecycle: kickside.core.jobs.persist:lifecycle
    dispatch: kickside.core.jobs.service:worker_dispatch
- name: restart_test
  kind: function.lua
  meta:
    type: test_support
    suite: upload_storage_restart
  source: file://restart_test.lua
  method: run
  modules:
  - sql
  - uuid
  - fs
  - registry
  - funcs
  - contract
  - env
  imports:
    test: wippy.test:test
    records: kickside.uploads.persist:upload_record_repo
    locations: kickside.storage_s3.persist:locations
    policy: kickside.storage_s3.policy:policy
    offload: kickside.storage_s3.storage:offload
    resources: kickside.uploads.binding:uploads_resources
- name: read_probe
  kind: function.lua
  source: file://read_probe.lua
  method: run
  modules:
  - contract
  imports:
    file_provider: kickside.uploads.binding:file_provider_func
    prompt_builder: wippy.session:prompt_builder
- name: api_probe
  kind: function.lua
  source: file://../upload_read_probe.lua
  method: raw
  modules:
  - security
  - contract
  imports:
    raw_api: app:upload_raw_fixture
    api: app:upload_get_fixture
    probe: app:upload_http_probe
    artifacts: app:upload_artifacts_fixture
    delete_api: app:upload_delete_fixture
    execution_identity: kickside.execution:execution_identity
    types: kickside.uploads:types
- name: content_contracts
  kind: security.policy
  policy:
    resources:
    - kickside.contract:content_provider
    - kickside.component:component_service
    - kickside.component.binding:component_service_impl
    - context
    - get_content
    - get_access_context
    - security
    actions:
    - contract.get
    - contract.open
    - contract.call
    - contract.context
    - contract.security
    effect: allow
- name: ingest_test
  kind: function.lua
  meta:
    type: test_support
    suite: knowledge_storage
  source: file://ingest_test.lua
  method: run
  modules:
  - sql
  - uuid
  - fs
  - funcs
  - security
  - contract
  - json
  - env
  imports:
    test: wippy.test:test
    records: kickside.uploads.persist:upload_record_repo
    artifacts: kickside.uploads.persist:artifact_content_repo
    cleanup: kickside.uploads.persist:artifact_cleanup_repo
    locations: kickside.storage_s3.persist:locations
    offload: kickside.storage_s3.storage:offload
    policy: kickside.storage_s3.policy:policy
    upload_types: kickside.uploads:types
    fixture_cleanup: app:fixture_cleanup
