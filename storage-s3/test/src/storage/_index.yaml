version: '1.0'
namespace: app.storage_s3
entries:
- name: unit_tests
  kind: function.lua
  meta:
    type: test
    suite: packed_storage
  source: file://packed_storage_test.lua
  method: run
  modules:
  - registry
  imports:
    test: wippy.test:test
- name: member_read_policy_test
  kind: function.lua
  meta:
    type: test
    suite: storage_s3_member_policy
  source: file://member_read_policy_test.lua
  method: run
  modules: [security, funcs, cloudstorage, uuid]
  imports:
    test: wippy.test:test
- name: member_relocated_read_test
  kind: function.lua
  meta: {type: test_support, suite: storage_s3_member_policy}
  source: file://member_read_policy_test.lua
  method: relocated
  modules: [security, funcs, cloudstorage, uuid]
  imports:
    test: wippy.test:test
- name: member_read_probe
  kind: function.lua
  source: file://member_read_probe.lua
  method: run
  imports:
    adapter: kickside.uploads.binding:storage_adapter_default
- name: member_read_runtime
  kind: security.policy
  policy:
    resources: [app.storage_s3:member_read_probe, app:uploads]
    actions: [funcs.call, fs.get]
    effect: allow
- name: architecture_test
  kind: function.lua
  meta: {type: test, suite: storage_s3_architecture}
  source: file://unit_tests.lua
  method: run
  modules: [registry]
  imports: {test: wippy.test:test}
- name: stage_order_test
  kind: function.lua
  meta: {type: test, suite: storage_s3_stage_order}
  source: file://ingest_test.lua
  method: run
  modules: [registry]
  imports: {test: wippy.test:test}
- name: restart_test
  kind: function.lua
  meta: {type: test_support, suite: storage_s3_restart}
  source: file://restart_test.lua
  method: run
  modules: [sql, fs, contract, funcs, env]
  imports:
    test: wippy.test:test
    records: kickside.uploads.persist:upload_record_repo
    pipeline: kickside.uploads:pipeline
    resources: kickside.uploads.binding:uploads_resources
- name: reader_owner_test
  kind: function.lua
  meta: {type: test_support, suite: storage_s3_reader_owner}
  source: file://read_probe.lua
  method: run
  modules: [cloudstorage, uuid]
  imports:
    test: wippy.test:test
    resources: kickside.uploads.binding:uploads_resources
- name: settings_test
  kind: function.lua
  meta: {type: test, suite: storage_s3_settings}
  source: file://settings_probe.lua
  method: run
  imports:
    test: wippy.test:test
    resources: kickside.storage_s3:resources
    policy: kickside.storage_s3.policy:policy
- name: fake_cloud
  kind: library.lua
  source: file://fake_cloud.lua
- name: copy_failure_test
  kind: function.lua
  meta: {type: test, suite: storage_s3_copy}
  source: file://copy_failure_test.lua
  method: run
  imports:
    test: wippy.test:test
    cloud_factory: app.storage_s3:fake_cloud
    copier: kickside.storage_s3.storage:copy
- name: settings_http
  kind: library.lua
  source: file://../upload_http_probe.lua
  modules: [ctx]
- name: settings_handlers
  kind: library.lua
  source: file://../fixtures/storage_settings.lua
  modules: [security, cloudstorage, uuid, contract]
  imports:
    http: app.storage_s3:settings_http
    policy: kickside.storage_s3.policy:policy
    resources: kickside.storage_s3:resources
- name: settings_member_probe
  kind: function.lua
  source: file://settings_member_probe.lua
  method: run
  imports:
    http: app.storage_s3:settings_http
    handlers: app.storage_s3:settings_handlers
- name: settings_member_runtime
  kind: security.policy
  policy:
    resources: [app.storage_s3:settings_member_probe]
    actions: [funcs.call]
    effect: allow
- name: settings_member_test
  kind: function.lua
  meta: {type: test, suite: storage_s3_settings}
  source: file://settings_member_test.lua
  method: run
  modules: [security, funcs]
  imports:
    test: wippy.test:test
