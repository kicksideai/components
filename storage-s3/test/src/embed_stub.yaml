version: '1.0'
namespace: test.kb
entries:
- name: embed_content
  kind: function.lua
  meta:
    comment: "Harness embed_content \u2014 forwards writes into knowledge thread_ingest."
  source: file://embed_stub.lua
  method: handle
  modules:
  - ctx
  imports:
    thread_ingest: kickside.knowledge.injection:thread_ingest
- name: embed_reference
  kind: function.lua
  meta:
    comment: "Harness embed_reference \u2014 unsupported placeholder to fully bind the contract."
  source: file://embed_stub.lua
  method: handle_reference
  modules:
  - ctx
  imports:
    thread_ingest: kickside.knowledge.injection:thread_ingest
- name: embeddable
  kind: contract.binding
  meta:
    comment: Harness KB embeddable binding backing test.kb KBs.
    events:
      output:
      - type: kickside.knowledge.events:content.upserted
      - type: kickside.knowledge.events:content.deleted
      - type: kickside.knowledge.events:delivery.claimed
      - type: kickside.knowledge.events:graph.changed
      - type: kickside.knowledge.events:digest.requested
      - type: kickside.knowledge.events:treatment.requested
  contracts:
  - contract: kickside.contract:embeddable
    context_required:
    - component_id
    methods:
      embed_content: test.kb:embed_content
      embed_reference: test.kb:embed_reference
