organization: kickside
module: sso
type: plugin
description: KickSide SSO — user single sign-on via OAuth2/OIDC identity providers (Google, Microsoft/Entra, GitHub, generic OIDC). Pluggable connectors, settings-driven configuration, account linking by verified email.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/components
homepage: https://wippy.ai
keywords:
  - kickside
  - sso
  - authentication
  - oidc
  - oauth
  - login
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
embed:
  - kickside.sso:ui_fs
exclude:
