version: '1.0'
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
  enable_history: true
  history_type: memory
disable:
  entries: ['app:work_time_combined_integration_test', 'app:work_time_combined_stress_test']
override:
  kickside.work.time.api:http_export:imports.handlers: app:work_time_export_fixture
  kickside.work.settings:read_deadline_ms:default: 10000
  kickside.work.settings:command_deadline_ms:default: 10000
  kickside.core.retention.service:sweeper.service:lifecycle.auto_start: false
workspace:
  replacements:
    kickside/work-time: ..
    kickside/agent-onboarding: ../../agent-onboarding
    kickside/sso: ../../sso
    kickside/dashboard: ../../dashboard
vars:
  pg_host: localhost
  pg_port: 5434
  pg_database: kickside_test_work_time
  pg_username: kickside
  pg_password: kickside
profiles:
  combined:
    workspace:
      replacements:
        kickside/work: ../../work
        kickside/work-planning: ../../work-planning
    disable:
      entries: ['app:work_time_sprint_reference_test']
      meta:
        type: [test_support] # Omit the simulated Planning capability from the dependency harness.
    override:
      app:dep.planning:parameters:
      - name: kickside.work.planning.api:api_router
        value: app:api
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
