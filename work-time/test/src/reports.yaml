version: '1.0'
namespace: app
entries:
- name: work_time_reports_test
  kind: function.lua
  meta: {type: test, suite: work_time_reports, timeout: 180s}
  source: file://reports_test.lua
  method: run
  modules: [sql, time, registry]
  imports:
    test: wippy.test:test
    scoped: app:scoped
    steps: app:steps
# Enable with the published Work release that bounds plugin scope membership.
- name: work_time_scope_plan_gate
  kind: registry.entry
  meta: {enabled: false}
