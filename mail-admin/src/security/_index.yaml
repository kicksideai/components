version: '1.0'
namespace: kickside.mail.admin.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: KickSide Mail administration
    surface: kickside.mail.admin
    includes:
    - kickside.mail.admin.security:member_endpoints
  groups: []
  policy:
    resources:
    - kickside.mail.admin:admin
    - kickside.mail.admin:settings_tab
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: member_endpoints
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.mail.admin:ui_static
    - kickside.mail.admin:admin
    actions: access
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  meta:
    value_kind: security.scope
    comment: Group that can load the Mail administration bundle. The System tab appears only
      for callers that can read the mail library.
  default: kickside.security.groups:members
  targets:
  - entry: kickside.mail.admin.security:module_access
    path: .groups +=
  - entry: kickside.mail.admin.security:member_endpoints
    path: .groups +=
