            createdb "$database"
            databases+=("$database")
            wippy lint --ns kickside.sso --ns 'kickside.sso.*' --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433
            wippy test --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path sso '.[$path]' .release-please-manifest.json)
            wippy publish --config sso --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.sso:ui_fs
        - module: storage-s3
          engine: sqlite
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            make -C storage-s3 setup build typecheck
            make -C storage-s3 lint test
            version=$(jq -r '."storage-s3" // "0.1.0"' .release-please-manifest.json)
            wippy publish --config storage-s3 --version "$version" --dry-run --create --module-visibility public --module-type plugin
        - module: storage-s3
          engine: postgres
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            make -C storage-s3 setup build typecheck
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_storage_s3"
            createdb "$database"
            trap 'dropdb "$database"' EXIT
            make -C storage-s3 lint WIPPY_ARGS="--profile postgres --set vars.pg_database=$database"
            make -C storage-s3 test-pg WIPPY_ARGS="--set vars.pg_database=$database"
            version=$(jq -r '."storage-s3" // "0.1.0"' .release-please-manifest.json)
            wippy publish --config storage-s3 --version "$version" --dry-run --create --module-visibility public --module-type plugin
        - module: storage-s3
          engine: s3
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            make -C storage-s3 setup build typecheck
            make -C storage-s3 test-s3
            version=$(jq -r '."storage-s3" // "0.1.0"' .release-please-manifest.json)
            wippy publish --config storage-s3 --version "$version" --dry-run --create --module-visibility public --module-type plugin
        - module: docscout
          engine: sqlite
          commands: |
            set -euo pipefail
            export TMPDIR="$PWD/.scratch"
            mkdir -p "$TMPDIR"
            make -C docscout lockrefresh ui-install build typecheck test-ui lint test
        - module: docscout
          engine: postgres
          commands: |
            set -euo pipefail
            export TMPDIR="$PWD/.scratch"
            mkdir -p "$TMPDIR"
            make -C docscout lockrefresh ui-install build typecheck test-ui lint
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_docscout"
            createdb "$database"
            trap 'dropdb "$database"' EXIT
            make -C docscout test-pg WIPPY_ARGS="--set vars.pg_database=$database"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
          POSTGRES_DB: postgres
        ports:
        - 5433:5432
        options: --health-cmd "pg_isready -U kickside -d postgres" --health-interval 5s --health-timeout
          5s --health-retries 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        path: source
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.56a
        hub-url: https://hub.wippy.ai
    - name: Check out converters module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/converters
        ref: main
        path: converters
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out kickside module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/kickside
        ref: main
        path: kickside
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out providers module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/providers
        ref: main
        path: providers
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Build, lint and Lua module tests
      run: ${{ matrix.commands }}
    defaults:
      run:
        working-directory: source
