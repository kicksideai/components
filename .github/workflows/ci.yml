            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path research '.[$path]' .release-please-manifest.json)
            wippy publish --config research --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.research:ui_fs
        - module: research
          engine: postgres
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm --prefix research/ui ci
            npm --prefix research/ui run build
            make -C research lockrefresh
            cd research/test
            databases=()
            cleanup_databases() { for database in "${databases[@]}"; do dropdb "$database"; done; }
            trap cleanup_databases EXIT
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_0"
            createdb "$database"
            databases+=("$database")
            wippy lint --ns kickside.research --ns 'kickside.research.*' --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433
            wippy test --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path research '.[$path]' .release-please-manifest.json)
            wippy publish --config research --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.research:ui_fs
        - module: agent-onboarding
          engine: sqlite
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm --prefix agent-onboarding/ui ci
            npm --prefix agent-onboarding/ui run build
            make -C agent-onboarding lockrefresh
            cd agent-onboarding/test
            wippy lint --ns kickside.agent_onboarding --ns 'kickside.agent_onboarding.*'
            wippy test  2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path agent-onboarding '.[$path]' .release-please-manifest.json)
            wippy publish --config agent-onboarding --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.agent_onboarding:ui_fs
        - module: agent-onboarding
          engine: postgres
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm --prefix agent-onboarding/ui ci
            npm --prefix agent-onboarding/ui run build
            make -C agent-onboarding lockrefresh
            cd agent-onboarding/test
            databases=()
            cleanup_databases() { for database in "${databases[@]}"; do dropdb "$database"; done; }
            trap cleanup_databases EXIT
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_0"
            createdb "$database"
            databases+=("$database")
            wippy lint --ns kickside.agent_onboarding --ns 'kickside.agent_onboarding.*' --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433
            wippy test --profile postgres --set "vars.pg_database=${databases[0]}" --set vars.pg_host=127.0.0.1 --set vars.pg_port=5433 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path agent-onboarding '.[$path]' .release-please-manifest.json)
            wippy publish --config agent-onboarding --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.agent_onboarding:ui_fs
        - module: sso
          engine: sqlite
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm --prefix sso/ui ci
            npm --prefix sso/ui run build
            make -C sso lockrefresh
            cd sso/test
            mkdir -p .wippy
            wippy lint --ns kickside.sso --ns 'kickside.sso.*' --set "vars.sqlite_path=$PWD/.wippy/ci.sqlite"
            wippy test --set "vars.sqlite_path=$PWD/.wippy/ci.sqlite" 2>&1 | tee .wippy-test.log
            sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' .wippy-test.log > .wippy-test.clean.log
            awk '/No tests found/ { empty=1 } /^[[:space:]]*FAILED([[:space:]]|$)/ { failed=1 } /^[[:space:]]*PASSED([[:space:]]|$)/ { passed=1 } END { exit(empty || failed || !passed) }' .wippy-test.clean.log
            cd "$source_root"
            version=$(jq -er --arg path sso '.[$path]' .release-please-manifest.json)
            wippy publish --config sso --version "$version" --dry-run --create --module-visibility public --module-type plugin --embed kickside.sso:ui_fs
        - module: sso
          engine: postgres
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            npm --prefix sso/ui ci
            npm --prefix sso/ui run build
            make -C sso lockrefresh
            cd sso/test
            databases=()
            cleanup_databases() { for database in "${databases[@]}"; do dropdb "$database"; done; }
            trap cleanup_databases EXIT
