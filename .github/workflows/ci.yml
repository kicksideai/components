            createdb "$database"
            trap 'dropdb "$database"' EXIT
            make -C storage-s3 lint WIPPY_ARGS="--profile postgres --set vars.pg_database=$database"
            make -C storage-s3 test-pg WIPPY_ARGS="--set vars.pg_database=$database"
            version=$(jq -r '."storage-s3" // "0.1.0"' .release-please-manifest.json)
            wippy publish --config storage-s3 --version "$version" --dry-run --create --module-visibility public --module-type plugin
        - module: storage-s3
          engine: s3
          commands: |
            set -euo pipefail
            source_root="$PWD"
            export TMPDIR="$source_root/.scratch"
            mkdir -p "$TMPDIR"
            make -C storage-s3 setup build typecheck
            make -C storage-s3 test-s3
            version=$(jq -r '."storage-s3" // "0.1.0"' .release-please-manifest.json)
            wippy publish --config storage-s3 --version "$version" --dry-run --create --module-visibility public --module-type plugin
        - module: docscout
          engine: sqlite
          commands: |
            set -euo pipefail
            export TMPDIR="$PWD/.scratch"
            mkdir -p "$TMPDIR"
            python3 docscout/test/check-package-bindings.py
            python3 docscout/test/test_build_inputs.py
            make -C docscout lockrefresh ui-install build typecheck test-ui lint test
        - module: docscout
          engine: postgres
          commands: |
            set -euo pipefail
            export TMPDIR="$PWD/.scratch"
            mkdir -p "$TMPDIR"
            python3 docscout/test/check-package-bindings.py
            python3 docscout/test/test_build_inputs.py
            make -C docscout lockrefresh ui-install build typecheck test-ui lint
            database="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_docscout"
            createdb "$database"
            trap 'dropdb "$database"' EXIT
            make -C docscout test-pg WIPPY_ARGS="--set vars.pg_database=$database"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        path: source
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: kicksideai/.github/actions/setup-wippy@5401fa65bed7d8648125957520e94206ed1ffd0b
      with:
        version: 0.3.66a
        hub-url: https://hub.wippy.ai
    - name: Check out converters module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/converters
        ref: main
        path: converters
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out kickside module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/kickside
        ref: main
        path: kickside
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Check out providers module sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kicksideai/providers
        ref: main
        path: providers
        token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Build, lint and Lua module tests
      env:
        PGPORT: '5433'
        MODULE_ENGINE: ${{ matrix.engine }}
        MODULE_COMMANDS: ${{ matrix.commands }}
        TEST_POSTGRES_LOG: ${{ runner.temp }}/components-postgres.log
      run: |
        if [[ "$MODULE_ENGINE" == postgres ]]; then
          bash test-support/postgres.sh postgres bash -eo pipefail -c "$MODULE_COMMANDS"
        else
          bash -eo pipefail -c "$MODULE_COMMANDS"
        fi
    - name: Upload PostgreSQL server log
      if: ${{ failure() && matrix.engine == 'postgres' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: postgres-${{ matrix.module }}
        path: ${{ runner.temp }}/components-postgres.log
    defaults:
      run:
        working-directory: source
